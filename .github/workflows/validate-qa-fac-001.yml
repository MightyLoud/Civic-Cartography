name: Validate QA-FAC-001 Shared Core

on:
  pull_request:
    paths:
      - 'schemas/qa-fac-core-v1.schema.json'
      - 'tests/fixtures/qa_fac_001_outcome_matrix.json'
      - 'tests/fixtures/qa_fac_001_angels_false_clean.json'
      - 'scripts/validate_qa_fac_001.py'
      - '.github/workflows/validate-qa-fac-001.yml'
      - 'tests/fixtures/production_batch_ca_20.yml'
      - 'evidence/production-batch-ca-20/selection-crosswalk.json'
      - 'evidence/candidate-factory-ca-smoke/**'
      - 'evidence/geo-fac-001/**'
      - 'tests/fixtures/src_fac_001_known_good_sources.json'
  workflow_dispatch:

jobs:
  qa-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture validators
        run: python -m pip install jsonschema pyyaml
      - name: Validate evidence-derived shared QA outcomes
        run: python scripts/validate_qa_fac_001.py
