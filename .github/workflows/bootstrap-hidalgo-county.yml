name: Bootstrap Hidalgo County dual-body schema

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap-hidalgo-county:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate reviewed Hidalgo County source contract
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          ITEM_ID = 'bc95c6e0bbed4ba98a16b303219de88a'
          ITEM_URL = f'https://www.arcgis.com/sharing/rest/content/items/{ITEM_ID}'
          LAYER_URL = 'https://services9.arcgis.com/dwMDP55HTfoj4n1c/arcgis/rest/services/County_Commissioners_View/FeatureServer/0'
          DISTRICT_FIELD = 'DISTRICT'

          def fetch_json(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'Civic-Cartography-bootstrap/1.0'})
              last_error = None
              for attempt in range(1, 6):
                  try:
                      with urllib.request.urlopen(request, timeout=45) as response:
                          return json.load(response)
                  except Exception as exc:
                      last_error = exc
                      if attempt == 5:
                          raise
                      time.sleep(attempt * 5)
              raise last_error

          item = fetch_json(f'{ITEM_URL}?f=json')
          if item.get('id') != ITEM_ID or item.get('title') != 'Hidalgo County Basemap' or item.get('owner') != 'rpresas':
              raise SystemExit(f'Unexpected Hidalgo County ArcGIS item metadata: {item!r}')

          metadata = fetch_json(f'{LAYER_URL}?f=json')
          if metadata.get('geometryType') != 'esriGeometryPolygon':
              raise SystemExit(f'Unexpected Hidalgo County geometry type: {metadata.get("geometryType")!r}')
          fields = {field.get('name') for field in metadata.get('fields', [])}
          if DISTRICT_FIELD not in fields:
              raise SystemExit(f'Hidalgo County layer lost {DISTRICT_FIELD}: {sorted(fields)}')
          query = urllib.parse.urlencode({
              'where': '1=1',
              'outFields': DISTRICT_FIELD,
              'returnGeometry': 'false',
              'orderByFields': DISTRICT_FIELD,
              'f': 'json',
          })
          payload = fetch_json(f'{LAYER_URL}/query?{query}')
          values = sorted({str(feature['attributes'][DISTRICT_FIELD]) for feature in payload.get('features', [])})
          if values != ['1', '2', '3', '4']:
              raise SystemExit(f'Unexpected Hidalgo County Commissioner precinct values: {values}')

          contract = {
              'item_id': ITEM_ID,
              'item_title': item.get('title'),
              'item_owner': item.get('owner'),
              'item_type': item.get('type'),
              'item_url': item.get('url'),
              'operational_layer_url': LAYER_URL,
              'layer_name': metadata.get('name'),
              'district_field': DISTRICT_FIELD,
              'district_values': values,
              'source_classification': 'county-associated ArcGIS source controlled by official Hidalgo County roster and 2021 redistricting evidence',
          }
          output = Path('build/hidalgo-county/portal-source-contract.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(contract, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f'Hidalgo County item: {ITEM_ID} / {item.get("owner")} / {item.get("title")}')
          print(f'Hidalgo County operational layer: {LAYER_URL}')
          print(f'Hidalgo County district field: {DISTRICT_FIELD}')
          PY

      - name: Fetch current Hidalgo County Commissioner precincts
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url https://services9.arcgis.com/dwMDP55HTfoj4n1c/arcgis/rest/services/County_Commissioners_View/FeatureServer/0 \
            --district-ids 1,2,3,4 \
            --district-field DISTRICT \
            --district-type commissioner_precinct \
            --district-name-prefix "Commissioner Precinct" \
            --jurisdiction-name "Hidalgo County" \
            --record-id-prefix TX:county:hidalgo:commissioner_precinct \
            --geometry-id-prefix hidalgo-county-commissioner-precinct \
            --source-agency "Hidalgo County GIS" \
            --retrieved-at 2026-08-02 \
            --raw-output build/hidalgo-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --output build/hidalgo-county/precincts/geojson/hidalgo_county_commissioner_precincts.geojson

      - name: Fetch current Hidalgo County boundary
        run: |
          python scripts/fetch_tigerweb_county.py \
            --geoid 48215 \
            --record-id TX:county:hidalgo:countywide:COUNTYWIDE \
            --geometry-id hidalgo-county-countywide \
            --retrieved-at 2026-08-02 \
            --raw-output build/hidalgo-county/county/raw/tigerweb-county-48215.geojson \
            --output build/hidalgo-county/county/geojson/hidalgo_county_countywide.geojson

      - name: Commit generated Hidalgo County snapshots
        if: github.event_name == 'push'
        run: |
          mkdir -p data/raw/hidalgo-county data/geojson
          cp build/hidalgo-county/precincts/raw/commissioner-precincts-1-4.geojson data/raw/hidalgo-county/commissioner-precincts-1-4.geojson
          cp build/hidalgo-county/precincts/geojson/hidalgo_county_commissioner_precincts.geojson data/geojson/hidalgo_county_commissioner_precincts.geojson
          cp build/hidalgo-county/county/raw/tigerweb-county-48215.geojson data/raw/hidalgo-county/tigerweb-county-48215.geojson
          cp build/hidalgo-county/county/geojson/hidalgo_county_countywide.geojson data/geojson/hidalgo_county_countywide.geojson
          cp build/hidalgo-county/portal-source-contract.json data/raw/hidalgo-county/portal-source-contract.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/raw/hidalgo-county/commissioner-precincts-1-4.geojson \
            data/geojson/hidalgo_county_commissioner_precincts.geojson \
            data/raw/hidalgo-county/tigerweb-county-48215.geojson \
            data/geojson/hidalgo_county_countywide.geojson \
            data/raw/hidalgo-county/portal-source-contract.json
          if git diff --cached --quiet; then
            echo "Hidalgo County snapshots already match generated output."
            exit 0
          fi
          git commit -m "Add Hidalgo County source snapshots"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload Hidalgo County bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: hidalgo-county-bootstrap
          path: build/hidalgo-county/
          if-no-files-found: error
