name: Bootstrap Hidalgo County dual-body schema

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap-hidalgo-county:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Resolve official Hidalgo County Commissioner layer
        id: source
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          USER_AGENT = 'Civic-Cartography-bootstrap/1.0'
          SEARCH = 'https://www.arcgis.com/sharing/rest/search'

          def fetch_json(url):
              request = urllib.request.Request(url, headers={'User-Agent': USER_AGENT})
              last_error = None
              for attempt in range(1, 6):
                  try:
                      with urllib.request.urlopen(request, timeout=45) as response:
                          return json.load(response)
                  except Exception as exc:
                      last_error = exc
                      if attempt == 5:
                          raise
                      time.sleep(attempt * 5)
              raise last_error

          queries = [
              'title:"Commissioner Precincts" AND tags:"HIDALGO COUNTY"',
              'title:"Hidalgo County Basemap" AND tags:"HIDALGO COUNTY"',
              'tags:"HIDALGO COUNTY" AND (type:"Feature Service" OR type:"Map Service" OR type:"Web Map")',
          ]
          items = {}
          for query_text in queries:
              query = urllib.parse.urlencode({'q': query_text, 'num': 100, 'f': 'json'})
              payload = fetch_json(f'{SEARCH}?{query}')
              for item in payload.get('results', []):
                  if item.get('id'):
                      items[item['id']] = item

          direct = []
          roots = []
          web_maps = []
          for item in items.values():
              title = str(item.get('title') or '')
              tags = ' '.join(str(value) for value in item.get('tags', []))
              text = f'{title} {tags}'.lower()
              if 'hidalgo' not in text and 'commissioner precinct' not in text:
                  continue
              item_type = item.get('type')
              url = item.get('url')
              if item_type == 'Web Map':
                  web_maps.append(item)
              if isinstance(url, str):
                  url = url.rstrip('/')
                  if re.search(r'/(?:MapServer|FeatureServer)/\d+$', url, re.I):
                      direct.append((item, url))
                      roots.append((item, url.rsplit('/', 1)[0]))
                  elif re.search(r'/(?:MapServer|FeatureServer)$', url, re.I):
                      roots.append((item, url))

          for item in web_maps:
              data = fetch_json(f"https://www.arcgis.com/sharing/rest/content/items/{item['id']}/data?f=json")
              stack = list(data.get('operationalLayers') or [])
              while stack:
                  layer = stack.pop()
                  if not isinstance(layer, dict):
                      continue
                  stack.extend(layer.get('layers') or [])
                  url = layer.get('url')
                  if not isinstance(url, str):
                      continue
                  url = url.rstrip('/')
                  if re.search(r'/(?:MapServer|FeatureServer)/\d+$', url, re.I):
                      direct.append((item, url))
                      roots.append((item, url.rsplit('/', 1)[0]))
                  elif re.search(r'/(?:MapServer|FeatureServer)$', url, re.I):
                      roots.append((item, url))

          for item, root in list(roots):
              try:
                  service = fetch_json(f'{root}?f=json')
              except Exception:
                  continue
              for layer in service.get('layers', []):
                  name = str(layer.get('name') or '')
                  if 'commission' in name.lower() or 'precinct' in name.lower():
                      direct.append((item, f"{root}/{layer['id']}"))

          seen = set()
          ranked = []
          field_tokens = ('PRECINCT', 'PREC', 'PCT', 'DISTRICT', 'DIST', 'COMMISH')
          for item, layer_url in direct:
              if layer_url in seen:
                  continue
              seen.add(layer_url)
              try:
                  metadata = fetch_json(f'{layer_url}?f=json')
              except Exception:
                  continue
              if metadata.get('geometryType') != 'esriGeometryPolygon':
                  continue
              layer_name = str(metadata.get('name') or '')
              fields = [str(field.get('name') or '') for field in metadata.get('fields', [])]
              for field in fields:
                  upper = field.upper()
                  if not any(token in upper for token in field_tokens):
                      continue
                  query = urllib.parse.urlencode({
                      'where': '1=1',
                      'outFields': field,
                      'returnGeometry': 'false',
                      'f': 'json',
                  })
                  try:
                      payload = fetch_json(f'{layer_url}/query?{query}')
                  except Exception:
                      continue
                  values = []
                  for feature in payload.get('features', []):
                      raw = feature.get('attributes', {}).get(field)
                      text = str(raw).strip() if raw is not None else ''
                      match = re.search(r'(?<!\d)([1-4])(?!\d)', text)
                      if match:
                          values.append(match.group(1))
                  if sorted(set(values)) != ['1', '2', '3', '4']:
                      continue
                  title = str(item.get('title') or '')
                  tags = ' '.join(str(value) for value in item.get('tags', []))
                  score = 100
                  if 'commission' in layer_name.lower(): score += 30
                  if 'commission' in title.lower(): score += 25
                  if 'hidalgo county' in tags.lower(): score += 20
                  if upper in {'PRECINCT', 'PRECINCT_NO', 'PCT', 'PCT_NO', 'DISTRICT'}: score += 15
                  if item.get('access') == 'public': score += 2
                  ranked.append((score, layer_url, field, item, metadata))

          ranked.sort(key=lambda value: (value[0], value[1], value[2]), reverse=True)
          if not ranked:
              raise SystemExit(f'No Hidalgo County Commissioner polygon layer resolved values 1-4. Items: {list(items.values())!r}')

          score, layer_url, district_field, item, metadata = ranked[0]
          contract = {
              'search_queries': queries,
              'selected_item': item,
              'operational_layer_url': layer_url,
              'district_field': district_field,
              'layer_name': metadata.get('name'),
              'ranked_candidates': [
                  {
                      'score': candidate_score,
                      'layer_url': candidate_url,
                      'district_field': candidate_field,
                      'item_id': candidate_item.get('id'),
                      'item_title': candidate_item.get('title'),
                      'item_owner': candidate_item.get('owner'),
                      'layer_name': candidate_metadata.get('name'),
                  }
                  for candidate_score, candidate_url, candidate_field, candidate_item, candidate_metadata in ranked
              ],
          }
          output = Path('build/hidalgo-county/portal-source-contract.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(contract, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'layer_url={layer_url}\n')
              handle.write(f'district_field={district_field}\n')
              handle.write(f'item_id={item.get("id")}\n')
              handle.write(f'item_owner={item.get("owner")}\n')
          print(f'Hidalgo County item: {item.get("id")} / {item.get("owner")} / {item.get("title")}')
          print(f'Hidalgo County operational layer: {layer_url}')
          print(f'Hidalgo County district field: {district_field}')
          PY

      - name: Fetch current Hidalgo County Commissioner precincts
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url "${{ steps.source.outputs.layer_url }}" \
            --district-ids 1,2,3,4 \
            --district-field "${{ steps.source.outputs.district_field }}" \
            --district-type commissioner_precinct \
            --district-name-prefix "Commissioner Precinct" \
            --jurisdiction-name "Hidalgo County" \
            --record-id-prefix TX:county:hidalgo:commissioner_precinct \
            --geometry-id-prefix hidalgo-county-commissioner-precinct \
            --source-agency "Hidalgo County GIS" \
            --retrieved-at 2026-08-02 \
            --raw-output build/hidalgo-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --output build/hidalgo-county/precincts/geojson/hidalgo_county_commissioner_precincts.geojson

      - name: Fetch current Hidalgo County boundary
        run: |
          python scripts/fetch_tigerweb_county.py \
            --geoid 48215 \
            --record-id TX:county:hidalgo:countywide:COUNTYWIDE \
            --geometry-id hidalgo-county-countywide \
            --retrieved-at 2026-08-02 \
            --raw-output build/hidalgo-county/county/raw/tigerweb-county-48215.geojson \
            --output build/hidalgo-county/county/geojson/hidalgo_county_countywide.geojson

      - name: Commit generated Hidalgo County snapshots
        if: github.event_name == 'push'
        run: |
          mkdir -p data/raw/hidalgo-county data/geojson
          cp build/hidalgo-county/precincts/raw/commissioner-precincts-1-4.geojson data/raw/hidalgo-county/commissioner-precincts-1-4.geojson
          cp build/hidalgo-county/precincts/geojson/hidalgo_county_commissioner_precincts.geojson data/geojson/hidalgo_county_commissioner_precincts.geojson
          cp build/hidalgo-county/county/raw/tigerweb-county-48215.geojson data/raw/hidalgo-county/tigerweb-county-48215.geojson
          cp build/hidalgo-county/county/geojson/hidalgo_county_countywide.geojson data/geojson/hidalgo_county_countywide.geojson
          cp build/hidalgo-county/portal-source-contract.json data/raw/hidalgo-county/portal-source-contract.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/raw/hidalgo-county/commissioner-precincts-1-4.geojson \
            data/geojson/hidalgo_county_commissioner_precincts.geojson \
            data/raw/hidalgo-county/tigerweb-county-48215.geojson \
            data/geojson/hidalgo_county_countywide.geojson \
            data/raw/hidalgo-county/portal-source-contract.json
          if git diff --cached --quiet; then
            echo "Hidalgo County snapshots already match generated output."
            exit 0
          fi
          git commit -m "Add Hidalgo County source snapshots"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload Hidalgo County bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: hidalgo-county-bootstrap
          path: build/hidalgo-county/
          if-no-files-found: error
