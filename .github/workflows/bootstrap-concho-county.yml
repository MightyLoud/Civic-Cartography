name: Bootstrap Concho County geometry

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-concho-county.yml"
      - "scripts/bootstrap_concho_geometry.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-concho-county:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source dependencies
        run: python -m pip install pymupdf pyshp
      - name: Inspect official sources
        run: python scripts/bootstrap_concho_geometry.py
      - uses: actions/upload-artifact@v4
        with:
          name: concho-county-bootstrap
          path: build/concho-bootstrap/
          if-no-files-found: error
