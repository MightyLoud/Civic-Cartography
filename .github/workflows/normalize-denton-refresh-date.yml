name: Normalize Denton constable snapshot date

on:
  pull_request:
    paths:
      - ".github/workflows/normalize-denton-refresh-date.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-denton-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/denton-constable-geometry-refresh
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate with pinned release date
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/5 \
            --district-ids 1,2,3,4,5,6 \
            --district-field JP_C \
            --district-type constable_precinct \
            --district-name-prefix "Constable Precinct" \
            --jurisdiction-name "Denton County" \
            --record-id-prefix TX:county:denton:constable_precinct \
            --geometry-id-prefix denton-county-constable-precinct \
            --source-agency "Denton County GIS" \
            --retrieved-at 2026-08-01 \
            --raw-output data/raw/denton-county/constable-precincts-1-6.geojson \
            --output data/geojson/denton_county_constable_precincts.geojson
      - name: Commit normalized snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/denton-county/constable-precincts-1-6.geojson data/geojson/denton_county_constable_precincts.geojson
          git diff --cached --check
          git commit -m "Normalize Denton constable snapshot date"
          git push origin HEAD:agent/denton-constable-geometry-refresh
