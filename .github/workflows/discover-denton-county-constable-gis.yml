name: Discover Denton County constable GIS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  discover-denton-constable-gis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect official Denton County political-boundary service
        run: |
          mkdir -p build/denton-county-constables
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          service_url = 'https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer'

          def fetch_json(url):
              request = urllib.request.Request(
                  url,
                  headers={'User-Agent': 'Civic-Cartography/0.1 (+https://github.com/MightyLoud/Civic-Cartography)'},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          service = fetch_json(service_url + '?f=pjson')
          layers = [
              {'id': layer.get('id'), 'name': layer.get('name'), 'parentLayerId': layer.get('parentLayerId')}
              for layer in service.get('layers', [])
          ]
          candidates = []
          for layer in layers:
              name = str(layer.get('name') or '')
              lowered = name.lower()
              if not any(token in lowered for token in ('justice', 'constable', 'jp precinct', 'j.p.')):
                  continue
              layer_url = f"{service_url}/{layer['id']}"
              metadata = fetch_json(layer_url + '?f=pjson')
              query = urllib.parse.urlencode({
                  'where': '1=1',
                  'outFields': '*',
                  'returnGeometry': 'false',
                  'f': 'json',
              })
              payload = fetch_json(layer_url + '/query?' + query)
              features = payload.get('features') or []
              fields = [field.get('name') for field in metadata.get('fields', [])]
              samples = [feature.get('attributes') or {} for feature in features[:10]]
              candidates.append({
                  'id': layer['id'],
                  'name': name,
                  'url': layer_url,
                  'geometryType': metadata.get('geometryType'),
                  'feature_count': len(features),
                  'fields': fields,
                  'samples': samples,
              })

          output = {
              'service_url': service_url,
              'service_description': service.get('serviceDescription'),
              'layers': layers,
              'candidate_layers': candidates,
          }
          print(json.dumps(output, indent=2, sort_keys=True))
          with open('build/denton-county-constables/discovery.json', 'w', encoding='utf-8') as handle:
              json.dump(output, handle, indent=2, sort_keys=True)
              handle.write('\n')

          if not candidates:
              raise SystemExit('No Justice / Constable precinct candidate layers found in the official service')
          PY

      - name: Run repository regression checks
        run: |
          python -m pip install -r requirements-dev.txt
          pytest -q
          python scripts/validate.py
          python scripts/validate_geojson.py

      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: denton-county-constable-gis-discovery
          path: build/denton-county-constables/discovery.json
          if-no-files-found: error
