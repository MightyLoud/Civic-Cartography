name: Bootstrap Galveston County effective-date cutover

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap-galveston-county:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate reviewed Galveston County cutover contract
        id: source
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          EXPERIENCE_ID = 'e0b0fef416cd42ad991b8ae95d22bb59'
          EXPERIENCE_OWNER = 'galvcountymaps'
          PORTAL = 'https://www.arcgis.com/sharing/rest'
          HOST = 'https://services5.arcgis.com/NAnnb4W7JLztFw9i/arcgis/rest/services'
          SELECTED_ROOT = f'{HOST}/Galveston_County_Commissioner_Precincts_2026/FeatureServer'
          CANDIDATE_ROOTS = [
              SELECTED_ROOT,
              f'{HOST}/GC_commissionerpct_/FeatureServer',
              f'{HOST}/Galveston_County_Commissioner_Precincts/FeatureServer',
              f'{HOST}/commissionerpct/FeatureServer',
          ]
          EFFECTIVE_DATE = '2026-06-29'
          EFFECTIVE_MS = int(datetime(2026, 6, 29, tzinfo=timezone.utc).timestamp() * 1000)
          ID_RE = re.compile(r'(?<![0-9a-fA-F])([0-9a-fA-F]{32})(?![0-9a-fA-F])')
          USER_AGENT = 'Civic-Cartography-bootstrap/1.0'

          def fetch_json(url, attempts=3):
              request = urllib.request.Request(url, headers={'User-Agent': USER_AGENT})
              last_error = None
              for attempt in range(1, attempts + 1):
                  try:
                      with urllib.request.urlopen(request, timeout=35) as response:
                          return json.load(response)
                  except Exception as exc:
                      last_error = exc
                      if attempt == attempts:
                          raise
                      time.sleep(attempt * 3)
              raise last_error

          def item_meta(item_id):
              return fetch_json(f'{PORTAL}/content/items/{item_id}?f=json')

          def item_data(item_id):
              return fetch_json(f'{PORTAL}/content/items/{item_id}/data?f=json')

          def compact(value):
              return json.dumps(value, separators=(',', ':'), sort_keys=True)

          def to_iso(milliseconds):
              if not milliseconds:
                  return None
              return datetime.fromtimestamp(milliseconds / 1000, tz=timezone.utc).isoformat().replace('+00:00', 'Z')

          def normalize_precinct(value):
              if value is None or isinstance(value, bool):
                  return None
              if isinstance(value, int):
                  return str(value)
              if isinstance(value, float) and value.is_integer():
                  return str(int(value))
              text = str(value).strip()
              if text in {'1', '2', '3', '4'}:
                  return text
              match = re.fullmatch(r'(?:commissioner\s*)?(?:precinct|pct|district)?\s*0*([1-4])', text, re.I)
              return match.group(1) if match else None

          def linked_experience_text():
              experience = item_meta(EXPERIENCE_ID)
              if experience.get('id') != EXPERIENCE_ID:
                  raise SystemExit(f'Unexpected Experience metadata: {experience!r}')
              if experience.get('owner') != EXPERIENCE_OWNER:
                  raise SystemExit(f'Unexpected Experience owner: {experience.get("owner")!r}')
              data = item_data(EXPERIENCE_ID)
              texts = [compact(experience), compact(data)]
              first_level = sorted(set(ID_RE.findall(texts[-1])))[:24]
              inspected = []
              for item_id in first_level:
                  try:
                      metadata = item_meta(item_id)
                      linked_data = item_data(item_id)
                  except Exception as exc:
                      print(f'Skipping linked item {item_id}: {exc}')
                      continue
                  inspected.append({
                      'item_id': item_id,
                      'title': metadata.get('title'),
                      'type': metadata.get('type'),
                      'owner': metadata.get('owner'),
                  })
                  texts.extend([compact(metadata), compact(linked_data)])
              return experience, inspected, '\n'.join(texts)

          def inspect_root(root):
              service = fetch_json(f'{root}?f=json')
              service_item_id = str(service.get('serviceItemId') or '')
              service_item = item_meta(service_item_id) if service_item_id else {}
              layers = service.get('layers') or []
              if not layers:
                  raise ValueError(f'No layers published at {root}')
              field_tokens = ('PRECINCT', 'PCT', 'DISTRICT', 'COMMISH', 'COMMISSION')
              matches = []
              for layer in layers:
                  layer_url = f"{root}/{layer['id']}"
                  metadata = fetch_json(f'{layer_url}?f=json')
                  if metadata.get('geometryType') != 'esriGeometryPolygon':
                      continue
                  fields = [str(field.get('name') or '') for field in metadata.get('fields', [])]
                  ranked_fields = []
                  for field in fields:
                      upper = field.upper()
                      if not any(token in upper for token in field_tokens):
                          continue
                      score = 0
                      if upper in {'PCT_NO', 'PRECINCT', 'PRECINCT_NO', 'DISTRICT'}:
                          score += 100
                      if 'PRECINCT' in upper or 'PCT' in upper:
                          score += 70
                      if 'DIST' in upper:
                          score += 50
                      if 'COMMISSION' in upper:
                          score += 40
                      ranked_fields.append((score, field))
                  ranked_fields.sort(key=lambda value: (-value[0], value[1]))
                  for _, field in ranked_fields:
                      params = urllib.parse.urlencode({
                          'where': '1=1',
                          'outFields': field,
                          'returnGeometry': 'false',
                          'orderByFields': field,
                          'f': 'json',
                      })
                      payload = fetch_json(f'{layer_url}/query?{params}')
                      values = [normalize_precinct(feature.get('attributes', {}).get(field)) for feature in payload.get('features', [])]
                      counts = {value: values.count(value) for value in sorted(set(value for value in values if value))}
                      if counts == {'1': 1, '2': 1, '3': 1, '4': 1}:
                          editing = metadata.get('editingInfo') or {}
                          service_editing = service.get('editingInfo') or {}
                          dates = [
                              int(service_item.get('created') or 0),
                              int(service_item.get('modified') or 0),
                              int(editing.get('lastEditDate') or editing.get('dataLastEditDate') or 0),
                              int(service_editing.get('lastEditDate') or service_editing.get('dataLastEditDate') or 0),
                          ]
                          max_date = max(dates)
                          matches.append({
                              'root_url': root,
                              'layer_url': layer_url,
                              'layer_name': metadata.get('name'),
                              'district_field': field,
                              'district_values': ['1', '2', '3', '4'],
                              'service_item_id': service_item_id,
                              'service_item_title': service_item.get('title'),
                              'service_item_owner': service_item.get('owner'),
                              'service_item_created': service_item.get('created'),
                              'service_item_created_iso': to_iso(int(service_item.get('created') or 0)),
                              'service_item_modified': service_item.get('modified'),
                              'service_item_modified_iso': to_iso(int(service_item.get('modified') or 0)),
                              'max_item_or_layer_date': max_date or None,
                              'max_item_or_layer_date_iso': to_iso(max_date),
                              'post_cutover': max_date >= EFFECTIVE_MS,
                          })
                          break
              if len(matches) != 1:
                  raise ValueError(f'Expected exactly one four-precinct polygon layer at {root}; found {matches!r}')
              return matches[0]

          experience, linked_items, experience_text = linked_experience_text()
          candidates = []
          for root in CANDIDATE_ROOTS:
              try:
                  candidate = inspect_root(root)
              except Exception as exc:
                  candidates.append({'root_url': root, 'available': False, 'error': str(exc)})
                  continue
              candidate['available'] = True
              candidate['referenced_by_experience_graph'] = (
                  root.lower() in experience_text.lower()
                  or candidate['layer_url'].lower() in experience_text.lower()
                  or (candidate['service_item_id'] and candidate['service_item_id'].lower() in experience_text.lower())
              )
              candidates.append(candidate)

          selected = next((candidate for candidate in candidates if candidate.get('root_url') == SELECTED_ROOT and candidate.get('available')), None)
          if selected is None:
              raise SystemExit(f'The dedicated 2026 Galveston Commissioner service did not validate: {candidates!r}')
          if not selected['post_cutover']:
              raise SystemExit(f'The dedicated 2026 service lacks post-cutover item/layer evidence: {selected!r}')
          if not selected['referenced_by_experience_graph']:
              raise SystemExit(f'The public Experience graph does not reference the dedicated 2026 service: {selected!r}; linked={linked_items!r}')

          rejected = []
          pre_cutover_count = 0
          for candidate in candidates:
              if candidate is selected:
                  continue
              if not candidate.get('available'):
                  reason = 'candidate unavailable or does not resolve exactly four Commissioner polygons'
              elif not candidate.get('post_cutover'):
                  reason = 'pre-cutover candidate rejected by the June 29, 2026 effective-date contract'
                  pre_cutover_count += 1
              else:
                  reason = 'non-controlling alternate service rejected in favor of the dedicated 2026 Experience-linked service'
              rejected.append({**candidate, 'rejection_reason': reason})
          if pre_cutover_count < 1:
              raise SystemExit(f'No older official candidate was proven pre-cutover: {rejected!r}')

          contract = {
              'experience_item_id': EXPERIENCE_ID,
              'experience_item_title': experience.get('title'),
              'experience_item_owner': experience.get('owner'),
              'experience_item_type': experience.get('type'),
              'experience_item_created': experience.get('created'),
              'experience_item_created_iso': to_iso(int(experience.get('created') or 0)),
              'experience_item_modified': experience.get('modified'),
              'experience_item_modified_iso': to_iso(int(experience.get('modified') or 0)),
              'effective_date': EFFECTIVE_DATE,
              'selection_rule': 'The dedicated Galveston_County_Commissioner_Precincts_2026 service must resolve exactly four Commissioner polygons, be referenced by the public Experience graph, and carry post-June-29 item or layer evidence; older generic services are rejected.',
              'operational_layer_url': selected['layer_url'],
              'district_field': selected['district_field'],
              'district_values': selected['district_values'],
              'selected_candidate': selected,
              'rejected_candidates': rejected,
              'linked_items_inspected': linked_items,
              'source_classification': 'county-controlled effective-date cutover contract; official county pages control the roster and June 29, 2026 adoption date',
          }
          output = Path('build/galveston-county/portal-source-contract.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(contract, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"layer_url={selected['layer_url']}\n")
              handle.write(f"district_field={selected['district_field']}\n")
          print(f"Galveston County Experience: {EXPERIENCE_ID} / {experience.get('owner')} / {experience.get('title')}")
          print(f"Selected post-cutover layer: {selected['layer_url']}")
          print(f"Stable district field: {selected['district_field']}")
          print(f"Rejected alternative candidates: {len(rejected)}")
          PY

      - name: Fetch current Galveston County Commissioner precincts
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url "${{ steps.source.outputs.layer_url }}" \
            --district-ids 1,2,3,4 \
            --district-field "${{ steps.source.outputs.district_field }}" \
            --district-type commissioner_precinct \
            --district-name-prefix "Commissioner Precinct" \
            --jurisdiction-name "Galveston County" \
            --record-id-prefix TX:county:galveston:commissioner_precinct \
            --geometry-id-prefix galveston-county-commissioner-precinct \
            --source-agency "Galveston County GIS" \
            --retrieved-at 2026-08-02 \
            --raw-output build/galveston-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --output build/galveston-county/precincts/geojson/galveston_county_commissioner_precincts.geojson

      - name: Fetch current Galveston County boundary
        run: |
          python scripts/fetch_tigerweb_county.py \
            --geoid 48167 \
            --record-id TX:county:galveston:countywide:COUNTYWIDE \
            --geometry-id galveston-county-countywide \
            --retrieved-at 2026-08-02 \
            --raw-output build/galveston-county/county/raw/tigerweb-county-48167.geojson \
            --output build/galveston-county/county/geojson/galveston_county_countywide.geojson

      - name: Commit generated Galveston County snapshots
        if: github.event_name == 'push'
        run: |
          mkdir -p data/raw/galveston-county data/geojson
          cp build/galveston-county/precincts/raw/commissioner-precincts-1-4.geojson data/raw/galveston-county/commissioner-precincts-1-4.geojson
          cp build/galveston-county/precincts/geojson/galveston_county_commissioner_precincts.geojson data/geojson/galveston_county_commissioner_precincts.geojson
          cp build/galveston-county/county/raw/tigerweb-county-48167.geojson data/raw/galveston-county/tigerweb-county-48167.geojson
          cp build/galveston-county/county/geojson/galveston_county_countywide.geojson data/geojson/galveston_county_countywide.geojson
          cp build/galveston-county/portal-source-contract.json data/raw/galveston-county/portal-source-contract.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/raw/galveston-county/commissioner-precincts-1-4.geojson \
            data/geojson/galveston_county_commissioner_precincts.geojson \
            data/raw/galveston-county/tigerweb-county-48167.geojson \
            data/geojson/galveston_county_countywide.geojson \
            data/raw/galveston-county/portal-source-contract.json
          if git diff --cached --quiet; then
            echo "Galveston County snapshots already match generated output."
            exit 0
          fi
          git commit -m "Add Galveston County post-cutover snapshots"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload Galveston County bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: galveston-county-bootstrap
          path: build/galveston-county/
          if-no-files-found: error
