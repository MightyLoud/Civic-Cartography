name: Bootstrap Galveston County effective-date cutover

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap-galveston-county:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate reviewed Galveston County cutover contract
        id: source
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          EXPERIENCE_ID = 'e0b0fef416cd42ad991b8ae95d22bb59'
          EXPERIENCE_OWNER = 'sigler_n'
          EXPERIENCE_TITLE = 'Galveston Final2'
          PORTAL = 'https://www.arcgis.com/sharing/rest'
          HOST = 'https://services5.arcgis.com/NAnnb4W7JLztFw9i/arcgis/rest/services'
          SELECTED_ROOT = f'{HOST}/Galveston_County_Commissioner_Precincts_2026/FeatureServer'
          SELECTED_LAYER = f'{SELECTED_ROOT}/0'
          SELECTED_FIELD = 'Commission'
          LEGACY_SOURCES = [
              {
                  'root_url': f'{HOST}/commissionerpct/FeatureServer',
                  'known_item_id': '1c58e007931141a18145d7379c24f21c',
              },
              {
                  'root_url': f'{HOST}/Galveston_County_Commissioner_Precincts/FeatureServer',
                  'known_item_id': None,
              },
              {
                  'root_url': f'{HOST}/GC_commissionerpct_/FeatureServer',
                  'known_item_id': None,
              },
          ]
          EFFECTIVE_DATE = '2026-06-29'
          EFFECTIVE_MS = int(datetime(2026, 6, 29, tzinfo=timezone.utc).timestamp() * 1000)
          ID_RE = re.compile(r'(?<![0-9a-fA-F])([0-9a-fA-F]{32})(?![0-9a-fA-F])')
          USER_AGENT = 'Civic-Cartography-bootstrap/1.0'

          def fetch_json(url, attempts=3):
              request = urllib.request.Request(url, headers={'User-Agent': USER_AGENT})
              last_error = None
              for attempt in range(1, attempts + 1):
                  try:
                      with urllib.request.urlopen(request, timeout=35) as response:
                          return json.load(response)
                  except Exception as exc:
                      last_error = exc
                      if attempt == attempts:
                          raise
                      time.sleep(attempt * 3)
              raise last_error

          def item_meta(item_id):
              return fetch_json(f'{PORTAL}/content/items/{item_id}?f=json')

          def item_data(item_id):
              return fetch_json(f'{PORTAL}/content/items/{item_id}/data?f=json')

          def to_iso(milliseconds):
              if not milliseconds:
                  return None
              return datetime.fromtimestamp(milliseconds / 1000, tz=timezone.utc).isoformat().replace('+00:00', 'Z')

          def normalize_precinct(value):
              if value is None or isinstance(value, bool):
                  return None
              if isinstance(value, int):
                  return str(value)
              if isinstance(value, float) and value.is_integer():
                  return str(int(value))
              text = str(value).strip()
              if text in {'1', '2', '3', '4'}:
                  return text
              match = re.fullmatch(r'(?:commissioner\s*)?(?:precinct|pct|district)?\s*0*([1-4])', text, re.I)
              return match.group(1) if match else None

          experience = item_meta(EXPERIENCE_ID)
          if experience.get('id') != EXPERIENCE_ID or experience.get('owner') != EXPERIENCE_OWNER or experience.get('title') != EXPERIENCE_TITLE:
              raise SystemExit(f'Unexpected Galveston Experience metadata: {experience!r}')
          experience_data = item_data(EXPERIENCE_ID)
          graph_texts = [json.dumps(experience_data, sort_keys=True)]
          linked_items = []
          for item_id in sorted(set(ID_RE.findall(graph_texts[0])))[:24]:
              try:
                  metadata = item_meta(item_id)
                  data = item_data(item_id)
              except Exception as exc:
                  print(f'Skipping linked item {item_id}: {exc}')
                  continue
              linked_items.append({
                  'item_id': item_id,
                  'title': metadata.get('title'),
                  'type': metadata.get('type'),
                  'owner': metadata.get('owner'),
              })
              graph_texts.extend([json.dumps(metadata, sort_keys=True), json.dumps(data, sort_keys=True)])
          graph_text = '\n'.join(graph_texts).lower()

          service = fetch_json(f'{SELECTED_ROOT}?f=json')
          service_item_id = str(service.get('serviceItemId') or '')
          service_item = item_meta(service_item_id) if service_item_id else {}
          metadata = fetch_json(f'{SELECTED_LAYER}?f=json')
          if metadata.get('geometryType') != 'esriGeometryPolygon':
              raise SystemExit(f'Unexpected selected geometry type: {metadata.get("geometryType")!r}')
          fields = {str(field.get('name') or '') for field in metadata.get('fields', [])}
          if SELECTED_FIELD not in fields:
              raise SystemExit(f'Selected layer lost {SELECTED_FIELD!r}: {sorted(fields)}')
          params = urllib.parse.urlencode({
              'where': '1=1',
              'outFields': SELECTED_FIELD,
              'returnGeometry': 'false',
              'orderByFields': SELECTED_FIELD,
              'f': 'json',
          })
          payload = fetch_json(f'{SELECTED_LAYER}/query?{params}')
          values = [normalize_precinct(feature.get('attributes', {}).get(SELECTED_FIELD)) for feature in payload.get('features', [])]
          counts = {value: values.count(value) for value in sorted(set(value for value in values if value))}
          if counts != {'1': 1, '2': 1, '3': 1, '4': 1}:
              raise SystemExit(f'Selected layer did not resolve one each of 1-4: {counts!r}')
          selected_dates = [
              int(service_item.get('created') or 0),
              int(service_item.get('modified') or 0),
              int((service.get('editingInfo') or {}).get('lastEditDate') or (service.get('editingInfo') or {}).get('dataLastEditDate') or 0),
              int((metadata.get('editingInfo') or {}).get('lastEditDate') or (metadata.get('editingInfo') or {}).get('dataLastEditDate') or 0),
          ]
          selected_max_date = max(selected_dates)
          if selected_max_date < EFFECTIVE_MS:
              raise SystemExit('The dedicated 2026 service lacks post-cutover item or layer evidence.')
          referenced = (
              SELECTED_ROOT.lower() in graph_text
              or SELECTED_LAYER.lower() in graph_text
              or (service_item_id and service_item_id.lower() in graph_text)
          )
          if not referenced:
              raise SystemExit(f'The Experience graph no longer references the dedicated 2026 service; linked={linked_items!r}')

          selected = {
              'root_url': SELECTED_ROOT,
              'layer_url': SELECTED_LAYER,
              'layer_name': metadata.get('name'),
              'district_field': SELECTED_FIELD,
              'district_values': ['1', '2', '3', '4'],
              'service_item_id': service_item_id,
              'service_item_title': service_item.get('title'),
              'service_item_owner': service_item.get('owner'),
              'service_item_created': service_item.get('created'),
              'service_item_created_iso': to_iso(int(service_item.get('created') or 0)),
              'service_item_modified': service_item.get('modified'),
              'service_item_modified_iso': to_iso(int(service_item.get('modified') or 0)),
              'max_item_or_layer_date': selected_max_date,
              'max_item_or_layer_date_iso': to_iso(selected_max_date),
              'post_cutover': True,
              'referenced_by_experience_graph': True,
          }

          rejected = []
          pre_cutover_count = 0
          for legacy in LEGACY_SOURCES:
              root = legacy['root_url']
              service_payload = {}
              service_error = None
              try:
                  service_payload = fetch_json(f'{root}?f=json')
              except Exception as exc:
                  service_error = str(exc)
              item_id = str(service_payload.get('serviceItemId') or legacy.get('known_item_id') or '')
              item = {}
              item_error = None
              if item_id:
                  try:
                      item = item_meta(item_id)
                  except Exception as exc:
                      item_error = str(exc)
              item_dates = [int(item.get('created') or 0), int(item.get('modified') or 0)]
              max_item_date = max(item_dates)
              candidate = {
                  'root_url': root,
                  'available': bool(service_payload),
                  'service_item_id': item_id or None,
                  'service_item_title': item.get('title'),
                  'service_item_owner': item.get('owner'),
                  'service_item_created': item.get('created'),
                  'service_item_created_iso': to_iso(int(item.get('created') or 0)),
                  'service_item_modified': item.get('modified'),
                  'service_item_modified_iso': to_iso(int(item.get('modified') or 0)),
                  'max_item_date': max_item_date or None,
                  'max_item_date_iso': to_iso(max_item_date),
                  'geometry_currently_resolves_four_precincts': False,
              }
              if service_error:
                  candidate['service_error'] = service_error
              if item_error:
                  candidate['item_error'] = item_error
              if max_item_date and max_item_date < EFFECTIVE_MS:
                  candidate['post_cutover'] = False
                  candidate['rejection_reason'] = 'pre-cutover candidate rejected by the June 29, 2026 effective-date contract; legacy geometry no longer needs to remain queryable when immutable ArcGIS item dates prove its age'
                  pre_cutover_count += 1
              elif max_item_date:
                  candidate['post_cutover'] = True
                  candidate['rejection_reason'] = 'non-controlling alternate service rejected in favor of the dedicated 2026 Experience-linked service'
              else:
                  candidate['post_cutover'] = None
                  candidate['rejection_reason'] = 'legacy candidate unavailable and not controlling after the dedicated 2026 service cutover'
              rejected.append(candidate)
          if pre_cutover_count < 1:
              raise SystemExit(f'No legacy ArcGIS item was proven pre-cutover: {rejected!r}')

          contract = {
              'experience_item_id': EXPERIENCE_ID,
              'experience_item_title': experience.get('title'),
              'experience_item_owner': experience.get('owner'),
              'experience_item_type': experience.get('type'),
              'experience_item_created': experience.get('created'),
              'experience_item_created_iso': to_iso(int(experience.get('created') or 0)),
              'experience_item_modified': experience.get('modified'),
              'experience_item_modified_iso': to_iso(int(experience.get('modified') or 0)),
              'effective_date': EFFECTIVE_DATE,
              'selection_rule': 'Use the dedicated Galveston_County_Commissioner_Precincts_2026 service linked by the public Experience graph; require exactly four polygons using Commission and post-June-29 item or layer evidence; reject legacy services using immutable ArcGIS item dates even when their polygon layers are no longer queryable.',
              'operational_layer_url': SELECTED_LAYER,
              'district_field': SELECTED_FIELD,
              'district_values': ['1', '2', '3', '4'],
              'selected_candidate': selected,
              'rejected_candidates': rejected,
              'linked_items_inspected': linked_items,
              'source_classification': 'county-controlled effective-date cutover contract; official county pages control the roster and June 29, 2026 effective date',
          }
          output = Path('build/galveston-county/portal-source-contract.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(contract, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'layer_url={SELECTED_LAYER}\n')
              handle.write(f'district_field={SELECTED_FIELD}\n')
          print(f'Galveston County Experience: {EXPERIENCE_ID} / {EXPERIENCE_OWNER} / {EXPERIENCE_TITLE}')
          print(f'Selected post-cutover layer: {SELECTED_LAYER}')
          print(f'Stable district field: {SELECTED_FIELD}')
          print(f'Rejected alternative candidates: {len(rejected)}')
          PY

      - name: Fetch current Galveston County Commissioner precincts
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url "${{ steps.source.outputs.layer_url }}" \
            --district-ids 1,2,3,4 \
            --district-field "${{ steps.source.outputs.district_field }}" \
            --district-type commissioner_precinct \
            --district-name-prefix "Commissioner Precinct" \
            --jurisdiction-name "Galveston County" \
            --record-id-prefix TX:county:galveston:commissioner_precinct \
            --geometry-id-prefix galveston-county-commissioner-precinct \
            --source-agency "Galveston County GIS" \
            --retrieved-at 2026-08-02 \
            --raw-output build/galveston-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --output build/galveston-county/precincts/geojson/galveston_county_commissioner_precincts.geojson

      - name: Fetch current Galveston County boundary
        run: |
          python scripts/fetch_tigerweb_county.py \
            --geoid 48167 \
            --record-id TX:county:galveston:countywide:COUNTYWIDE \
            --geometry-id galveston-county-countywide \
            --retrieved-at 2026-08-02 \
            --raw-output build/galveston-county/county/raw/tigerweb-county-48167.geojson \
            --output build/galveston-county/county/geojson/galveston_county_countywide.geojson

      - name: Commit generated Galveston County snapshots
        if: github.event_name == 'push'
        run: |
          mkdir -p data/raw/galveston-county data/geojson
          cp build/galveston-county/precincts/raw/commissioner-precincts-1-4.geojson data/raw/galveston-county/commissioner-precincts-1-4.geojson
          cp build/galveston-county/precincts/geojson/galveston_county_commissioner_precincts.geojson data/geojson/galveston_county_commissioner_precincts.geojson
          cp build/galveston-county/county/raw/tigerweb-county-48167.geojson data/raw/galveston-county/tigerweb-county-48167.geojson
          cp build/galveston-county/county/geojson/galveston_county_countywide.geojson data/geojson/galveston_county_countywide.geojson
          cp build/galveston-county/portal-source-contract.json data/raw/galveston-county/portal-source-contract.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/raw/galveston-county/commissioner-precincts-1-4.geojson \
            data/geojson/galveston_county_commissioner_precincts.geojson \
            data/raw/galveston-county/tigerweb-county-48167.geojson \
            data/geojson/galveston_county_countywide.geojson \
            data/raw/galveston-county/portal-source-contract.json
          if git diff --cached --quiet; then
            echo "Galveston County snapshots already match generated output."
            exit 0
          fi
          git commit -m "Add Galveston County post-cutover snapshots"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload Galveston County bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: galveston-county-bootstrap
          path: build/galveston-county/
          if-no-files-found: error
