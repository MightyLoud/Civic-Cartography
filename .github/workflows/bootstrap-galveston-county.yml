name: Bootstrap Galveston County effective-date cutover

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap-galveston-county:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Resolve post-cutover Galveston County Commissioner layer
        id: source
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          EXPERIENCE_ID = 'e0b0fef416cd42ad991b8ae95d22bb59'
          PORTAL = 'https://www.arcgis.com/sharing/rest'
          EFFECTIVE_DATE = '2026-06-29'
          EFFECTIVE_MS = int(datetime(2026, 6, 29, tzinfo=timezone.utc).timestamp() * 1000)
          USER_AGENT = 'Civic-Cartography-bootstrap/1.0'
          ID_RE = re.compile(r'(?<![0-9a-fA-F])([0-9a-fA-F]{32})(?![0-9a-fA-F])')
          URL_RE = re.compile(r'https?://[^\s"\'<>]+', re.I)
          LAYER_RE = re.compile(r'/(?:FeatureServer|MapServer)/(\d+)$', re.I)
          ROOT_RE = re.compile(r'/(?:FeatureServer|MapServer)$', re.I)
          FIELD_TOKENS = ('DISTRICT', 'PRECINCT', 'PCT', 'COMMISH', 'COMMISSION')

          def fetch_json(url, attempts=5):
              request = urllib.request.Request(url, headers={'User-Agent': USER_AGENT})
              last_error = None
              for attempt in range(1, attempts + 1):
                  try:
                      with urllib.request.urlopen(request, timeout=45) as response:
                          return json.load(response)
                  except Exception as exc:
                      last_error = exc
                      if attempt == attempts:
                          raise
                      time.sleep(attempt * 4)
              raise last_error

          def item_meta(item_id):
              return fetch_json(f'{PORTAL}/content/items/{item_id}?f=json')

          def item_data(item_id):
              return fetch_json(f'{PORTAL}/content/items/{item_id}/data?f=json')

          def walk_strings(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, dict):
                  for key, child in value.items():
                      yield str(key)
                      yield from walk_strings(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk_strings(child)

          def normalize_service_url(value):
              text = value.strip().rstrip('.,);]')
              text = text.split('?', 1)[0].rstrip('/')
              if LAYER_RE.search(text) or ROOT_RE.search(text):
                  return text
              return None

          def to_iso(milliseconds):
              if not milliseconds:
                  return None
              return datetime.fromtimestamp(milliseconds / 1000, tz=timezone.utc).isoformat().replace('+00:00', 'Z')

          def normalized_precinct(value):
              if value is None or isinstance(value, bool):
                  return None
              if isinstance(value, int):
                  return str(value)
              if isinstance(value, float) and value.is_integer():
                  return str(int(value))
              text = str(value).strip()
              if text in {'1', '2', '3', '4'}:
                  return text
              match = re.fullmatch(r'(?:precinct|pct|district|commissioner)?\s*0*([1-4])', text, re.I)
              return match.group(1) if match else None

          experience = item_meta(EXPERIENCE_ID)
          if experience.get('id') != EXPERIENCE_ID:
              raise SystemExit(f'Unexpected Experience metadata: {experience!r}')
          experience_owner = str(experience.get('owner') or '')
          if not experience_owner:
              raise SystemExit('Galveston County Experience item has no owner.')

          queue = [EXPERIENCE_ID]
          visited = {}
          reachable_ids = set()
          url_sources = {}

          def record_url(url, item_id):
              normalized = normalize_service_url(url)
              if normalized:
                  url_sources.setdefault(normalized, set()).add(item_id)

          while queue and len(visited) < 120:
              item_id = queue.pop(0)
              if item_id in visited:
                  continue
              try:
                  metadata = item_meta(item_id)
              except Exception as exc:
                  print(f'Skipping linked item {item_id}: {exc}')
                  continue
              if metadata.get('id') != item_id:
                  continue
              visited[item_id] = metadata
              reachable_ids.add(item_id)
              if isinstance(metadata.get('url'), str):
                  record_url(metadata['url'], item_id)
              try:
                  data = item_data(item_id)
              except Exception as exc:
                  print(f'Skipping data for {item_id}: {exc}')
                  data = {}
              for text in walk_strings(data):
                  for match in ID_RE.finditer(text):
                      linked_id = match.group(1)
                      if linked_id not in visited and linked_id not in queue:
                          queue.append(linked_id)
                  for match in URL_RE.finditer(text):
                      record_url(match.group(0), item_id)

          # Search the owning account as a secondary catalog. Candidates still rank below
          # layers directly reachable from the public Experience item.
          owner_items = {}
          for start in (1, 101, 201):
              params = urllib.parse.urlencode({
                  'q': f'owner:{experience_owner}',
                  'num': 100,
                  'start': start,
                  'sortField': 'modified',
                  'sortOrder': 'desc',
                  'f': 'json',
              })
              payload = fetch_json(f'{PORTAL}/search?{params}')
              for item in payload.get('results', []):
                  if item.get('id'):
                      owner_items[item['id']] = item
              if payload.get('nextStart', -1) in (-1, None):
                  break
          for item_id, metadata in owner_items.items():
              title_text = ' '.join([
                  str(metadata.get('title') or ''),
                  ' '.join(str(value) for value in metadata.get('tags', [])),
                  str(metadata.get('snippet') or ''),
              ]).lower()
              if not any(token in title_text for token in ('commission', 'precinct', 'redistrict', 'jp')):
                  continue
              if isinstance(metadata.get('url'), str):
                  record_url(metadata['url'], item_id)
              if metadata.get('type') in {'Web Map', 'Web Experience', 'Web Mapping Application', 'Dashboard'}:
                  try:
                      data = item_data(item_id)
                  except Exception:
                      data = {}
                  for text in walk_strings(data):
                      for match in URL_RE.finditer(text):
                          record_url(match.group(0), item_id)

          service_layers = {}
          for candidate_url, source_ids in sorted(url_sources.items()):
              if LAYER_RE.search(candidate_url):
                  service_layers.setdefault(candidate_url, set()).update(source_ids)
                  continue
              if not ROOT_RE.search(candidate_url):
                  continue
              try:
                  service = fetch_json(f'{candidate_url}?f=json')
              except Exception as exc:
                  print(f'Skipping service root {candidate_url}: {exc}')
                  continue
              for layer in service.get('layers', []):
                  if layer.get('id') is not None:
                      service_layers.setdefault(f"{candidate_url}/{layer['id']}", set()).update(source_ids)

          candidates = []
          for layer_url, source_ids in sorted(service_layers.items()):
              try:
                  metadata = fetch_json(f'{layer_url}?f=json')
              except Exception as exc:
                  print(f'Skipping layer {layer_url}: {exc}')
                  continue
              if metadata.get('geometryType') != 'esriGeometryPolygon':
                  continue
              fields = [str(field.get('name') or '') for field in metadata.get('fields', [])]
              field_candidates = []
              for field in fields:
                  upper = field.upper()
                  if any(token in upper for token in FIELD_TOKENS):
                      score = 0
                      if upper in {'DISTRICT', 'PRECINCT', 'PCT', 'PCT_NO', 'PRECINCT_NO'}:
                          score += 100
                      if 'COMMISSION' in upper:
                          score += 80
                      if 'PRECINCT' in upper or 'PCT' in upper:
                          score += 60
                      if 'DIST' in upper:
                          score += 50
                      field_candidates.append((score, field))
              field_candidates.sort(key=lambda value: (-value[0], value[1]))
              for _, field in field_candidates:
                  params = urllib.parse.urlencode({
                      'where': '1=1',
                      'outFields': field,
                      'returnGeometry': 'false',
                      'orderByFields': field,
                      'f': 'json',
                  })
                  try:
                      payload = fetch_json(f'{layer_url}/query?{params}')
                  except Exception:
                      continue
                  values = [normalized_precinct(feature.get('attributes', {}).get(field)) for feature in payload.get('features', [])]
                  values = [value for value in values if value]
                  counts = {value: values.count(value) for value in sorted(set(values))}
                  if counts != {'1': 1, '2': 1, '3': 1, '4': 1}:
                      continue
                  extent_params = urllib.parse.urlencode({
                      'where': '1=1',
                      'returnExtentOnly': 'true',
                      'outSR': 4326,
                      'f': 'json',
                  })
                  try:
                      extent_payload = fetch_json(f'{layer_url}/query?{extent_params}')
                      extent = extent_payload.get('extent') or {}
                      xmin = float(extent.get('xmin'))
                      ymin = float(extent.get('ymin'))
                      xmax = float(extent.get('xmax'))
                      ymax = float(extent.get('ymax'))
                  except Exception:
                      continue
                  if xmax < -96.2 or xmin > -94.3 or ymax < 28.7 or ymin > 30.4:
                      continue

                  service_root = layer_url.rsplit('/', 1)[0]
                  try:
                      service = fetch_json(f'{service_root}?f=json')
                  except Exception:
                      service = {}
                  service_item_id = str(service.get('serviceItemId') or '')
                  all_source_ids = set(source_ids)
                  if service_item_id:
                      all_source_ids.add(service_item_id)
                  source_items = []
                  for item_id in sorted(all_source_ids):
                      item = visited.get(item_id) or owner_items.get(item_id)
                      if item is None:
                          try:
                              item = item_meta(item_id)
                          except Exception:
                              item = {}
                      if item:
                          source_items.append(item)

                  titles = [str(item.get('title') or '') for item in source_items]
                  owners = [str(item.get('owner') or '') for item in source_items]
                  item_modified_values = [int(item.get('modified') or 0) for item in source_items]
                  item_created_values = [int(item.get('created') or 0) for item in source_items]
                  editing = metadata.get('editingInfo') or {}
                  layer_last_edit = int(editing.get('lastEditDate') or editing.get('dataLastEditDate') or 0)
                  service_last_edit = int((service.get('editingInfo') or {}).get('lastEditDate') or 0)
                  max_item_modified = max(item_modified_values or [0])
                  max_item_created = max(item_created_values or [0])
                  max_edit = max(layer_last_edit, service_last_edit)
                  searchable = ' '.join(titles + [str(metadata.get('name') or ''), layer_url]).lower()
                  directly_reachable = bool(all_source_ids & reachable_ids)
                  owner_match = experience_owner in owners
                  score = 0
                  if directly_reachable:
                      score += 1000
                  if owner_match:
                      score += 300
                  if 'commission' in searchable:
                      score += 180
                  if 'precinct' in searchable:
                      score += 100
                  if any(token in searchable for token in ('new', 'current', '2026', 'redistrict')):
                      score += 120
                  if max_item_created >= EFFECTIVE_MS:
                      score += 220
                  if max_item_modified >= EFFECTIVE_MS:
                      score += 220
                  if max_edit >= EFFECTIVE_MS:
                      score += 220
                  if field.upper() in {'DISTRICT', 'PRECINCT', 'PCT', 'PCT_NO', 'PRECINCT_NO'}:
                      score += 80
                  candidates.append({
                      'score': score,
                      'layer_url': layer_url,
                      'layer_name': metadata.get('name'),
                      'district_field': field,
                      'district_values': ['1', '2', '3', '4'],
                      'extent_wgs84': {'xmin': xmin, 'ymin': ymin, 'xmax': xmax, 'ymax': ymax},
                      'directly_reachable_from_experience': directly_reachable,
                      'source_item_ids': sorted(all_source_ids),
                      'source_item_titles': titles,
                      'source_item_owners': owners,
                      'max_item_created': max_item_created or None,
                      'max_item_created_iso': to_iso(max_item_created),
                      'max_item_modified': max_item_modified or None,
                      'max_item_modified_iso': to_iso(max_item_modified),
                      'max_layer_or_service_edit': max_edit or None,
                      'max_layer_or_service_edit_iso': to_iso(max_edit),
                      'post_cutover': max(max_item_created, max_item_modified, max_edit) >= EFFECTIVE_MS,
                  })
                  break

          candidates.sort(key=lambda value: (-value['score'], value['layer_url'], value['district_field']))
          eligible = [
              candidate for candidate in candidates
              if candidate['directly_reachable_from_experience'] and candidate['post_cutover']
          ]
          if not eligible:
              raise SystemExit(f'No post-cutover Galveston Commissioner layer linked through the public Experience item. Candidates: {candidates!r}')
          selected = eligible[0]
          rejected = []
          for candidate in candidates:
              if candidate is selected:
                  continue
              if not candidate['post_cutover']:
                  reason = 'pre-cutover candidate rejected by June 29, 2026 effective-date contract'
              elif not candidate['directly_reachable_from_experience']:
                  reason = 'not linked through the controlling public Experience item'
              else:
                  reason = 'lower-ranked linked candidate; not the controlling reviewed layer'
              rejected.append({**candidate, 'rejection_reason': reason})

          contract = {
              'experience_item_id': EXPERIENCE_ID,
              'experience_item_title': experience.get('title'),
              'experience_item_owner': experience_owner,
              'experience_item_type': experience.get('type'),
              'experience_item_created': experience.get('created'),
              'experience_item_created_iso': to_iso(int(experience.get('created') or 0)),
              'experience_item_modified': experience.get('modified'),
              'experience_item_modified_iso': to_iso(int(experience.get('modified') or 0)),
              'effective_date': EFFECTIVE_DATE,
              'selection_rule': 'Select a Galveston-area four-polygon Commissioner layer linked through the public Experience item with item or layer evidence on or after the June 29, 2026 effective date.',
              'operational_layer_url': selected['layer_url'],
              'district_field': selected['district_field'],
              'district_values': selected['district_values'],
              'selected_candidate': selected,
              'rejected_candidates': rejected,
              'reachable_item_ids': sorted(reachable_ids),
              'source_classification': 'county-controlled post-cutover ArcGIS Experience contract; official county pages control the roster and effective date',
          }
          output = Path('build/galveston-county/portal-source-contract.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(contract, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"layer_url={selected['layer_url']}\n")
              handle.write(f"district_field={selected['district_field']}\n")
              handle.write(f"experience_owner={experience_owner}\n")
          print(f"Galveston County Experience: {EXPERIENCE_ID} / {experience_owner} / {experience.get('title')}")
          print(f"Selected post-cutover layer: {selected['layer_url']}")
          print(f"Stable district field: {selected['district_field']}")
          print(f"Rejected alternative candidates: {len(rejected)}")
          PY

      - name: Fetch current Galveston County Commissioner precincts
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url "${{ steps.source.outputs.layer_url }}" \
            --district-ids 1,2,3,4 \
            --district-field "${{ steps.source.outputs.district_field }}" \
            --district-type commissioner_precinct \
            --district-name-prefix "Commissioner Precinct" \
            --jurisdiction-name "Galveston County" \
            --record-id-prefix TX:county:galveston:commissioner_precinct \
            --geometry-id-prefix galveston-county-commissioner-precinct \
            --source-agency "Galveston County GIS" \
            --retrieved-at 2026-08-02 \
            --raw-output build/galveston-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --output build/galveston-county/precincts/geojson/galveston_county_commissioner_precincts.geojson

      - name: Fetch current Galveston County boundary
        run: |
          python scripts/fetch_tigerweb_county.py \
            --geoid 48167 \
            --record-id TX:county:galveston:countywide:COUNTYWIDE \
            --geometry-id galveston-county-countywide \
            --retrieved-at 2026-08-02 \
            --raw-output build/galveston-county/county/raw/tigerweb-county-48167.geojson \
            --output build/galveston-county/county/geojson/galveston_county_countywide.geojson

      - name: Commit generated Galveston County snapshots
        if: github.event_name == 'push'
        run: |
          mkdir -p data/raw/galveston-county data/geojson
          cp build/galveston-county/precincts/raw/commissioner-precincts-1-4.geojson data/raw/galveston-county/commissioner-precincts-1-4.geojson
          cp build/galveston-county/precincts/geojson/galveston_county_commissioner_precincts.geojson data/geojson/galveston_county_commissioner_precincts.geojson
          cp build/galveston-county/county/raw/tigerweb-county-48167.geojson data/raw/galveston-county/tigerweb-county-48167.geojson
          cp build/galveston-county/county/geojson/galveston_county_countywide.geojson data/geojson/galveston_county_countywide.geojson
          cp build/galveston-county/portal-source-contract.json data/raw/galveston-county/portal-source-contract.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/raw/galveston-county/commissioner-precincts-1-4.geojson \
            data/geojson/galveston_county_commissioner_precincts.geojson \
            data/raw/galveston-county/tigerweb-county-48167.geojson \
            data/geojson/galveston_county_countywide.geojson \
            data/raw/galveston-county/portal-source-contract.json
          if git diff --cached --quiet; then
            echo "Galveston County snapshots already match generated output."
            exit 0
          fi
          git commit -m "Add Galveston County post-cutover snapshots"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload Galveston County bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: galveston-county-bootstrap
          path: build/galveston-county/
          if-no-files-found: error
