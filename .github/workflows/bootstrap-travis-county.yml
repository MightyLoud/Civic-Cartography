name: Bootstrap Travis County geometry

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap-travis-county:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download cached Travis County precinct geometry
        run: |
          mkdir -p build/travis-county/precincts/raw
          curl --fail-with-body --location --silent --show-error --compressed \
            --connect-timeout 30 --max-time 300 --retry 3 --retry-all-errors \
            "https://hub.arcgis.com/api/v3/datasets/1fd888e1d8124c1dbd35b5dac25a0a5a_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1" \
            --output build/travis-county/precincts/raw/hub-download.geojson
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('build/travis-county/precincts/raw/hub-download.geojson')
          payload = json.loads(path.read_text(encoding='utf-8'))
          features = payload.get('features', [])
          if payload.get('type') != 'FeatureCollection' or len(features) != 4:
              raise SystemExit(f'Unexpected Hub response: {payload!r}')
          object_ids = sorted(
              int(feature['properties']['OBJECTID'])
              for feature in features
          )
          Path('build/travis-county/precincts/raw/object-ids.txt').write_text(
              ','.join(str(value) for value in object_ids),
              encoding='utf-8',
          )
          print(f"Downloaded four Hub geometry features with object IDs {object_ids}.")
          PY

      - name: Fetch current Travis County precinct attributes
        run: |
          object_ids="$(cat build/travis-county/precincts/raw/object-ids.txt)"
          curl --fail-with-body --location --silent --show-error --compressed \
            --connect-timeout 30 --max-time 90 --retry 1 --retry-all-errors \
            --get "https://gis.traviscountytx.gov/server1/rest/services/Boundaries_and_Jurisdictions/Travis_County_Commissioner_Precincts/FeatureServer/0/query" \
            --data-urlencode "objectIds=${object_ids}" \
            --data-urlencode "outFields=*" \
            --data-urlencode "returnGeometry=false" \
            --data-urlencode "orderByFields=PRECINCT" \
            --data-urlencode "f=json" \
            --output build/travis-county/precincts/raw/live-attributes.json

      - name: Fetch Travis County boundary with retry
        run: |
          for attempt in 1 2 3 4 5; do
            rm -rf build/travis-county/county
            if python scripts/fetch_tigerweb_county.py \
              --geoid 48453 \
              --record-id TX:county:travis:countywide:COUNTYWIDE \
              --geometry-id travis-county-countywide \
              --retrieved-at 2026-08-02 \
              --raw-output build/travis-county/county/raw/tigerweb-county-48453.geojson \
              --output build/travis-county/county/geojson/travis_county_countywide.geojson; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Combine current attributes with official precinct geometry
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          from scripts.fetch_arcgis_districts import canonicalize, normalize_identifier, select_features, write_json

          hub_url = "https://hub.arcgis.com/api/v3/datasets/1fd888e1d8124c1dbd35b5dac25a0a5a_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1"
          layer_url = "https://gis.traviscountytx.gov/server1/rest/services/Boundaries_and_Jurisdictions/Travis_County_Commissioner_Precincts/FeatureServer/0"
          object_ids = Path("build/travis-county/precincts/raw/object-ids.txt").read_text(encoding="utf-8")
          live_query_url = f"{layer_url}/query?objectIds={object_ids}&outFields=%2A&returnGeometry=false&orderByFields=PRECINCT&f=json"

          hub_payload = json.loads(
              Path("build/travis-county/precincts/raw/hub-download.geojson").read_text(encoding="utf-8")
          )
          live_payload = json.loads(
              Path("build/travis-county/precincts/raw/live-attributes.json").read_text(encoding="utf-8")
          )
          if live_payload.get("error"):
              raise SystemExit(f"Live Travis County attribute query failed: {live_payload['error']!r}")

          live_by_precinct = {}
          for feature in live_payload.get("features", []):
              attributes = feature.get("attributes") or {}
              precinct = normalize_identifier(attributes.get("PRECINCT"))
              if precinct is None or precinct in live_by_precinct:
                  raise SystemExit(f"Invalid live Travis County precinct attributes: {attributes!r}")
              live_by_precinct[precinct] = attributes
          if set(live_by_precinct) != {"1", "2", "3", "4"}:
              raise SystemExit(f"Unexpected live Travis County precinct IDs: {sorted(live_by_precinct)!r}")

          combined_features = []
          for hub_feature in hub_payload.get("features", []):
              properties = hub_feature.get("properties") or {}
              precinct = normalize_identifier(properties.get("PRECINCT"))
              if precinct not in live_by_precinct:
                  continue
              feature = copy.deepcopy(hub_feature)
              feature["properties"] = copy.deepcopy(live_by_precinct[precinct])
              combined_features.append(feature)

          raw_payload = select_features(
              {"type": "FeatureCollection", "features": combined_features},
              district_field="PRECINCT",
              expected_ids={"1", "2", "3", "4"},
          )
          raw_path = Path("build/travis-county/precincts/raw/commissioner-precincts-1-4.geojson")
          write_json(raw_path, raw_payload)

          canonical = canonicalize(
              raw_payload,
              district_field="PRECINCT",
              jurisdiction_name="Travis County",
              record_id_prefix="TX:county:travis:commissioner_precinct",
              geometry_id_prefix="travis-county-commissioner-precinct",
              source_agency="Travis County GIS",
              layer_url=layer_url,
              request_url=hub_url,
              retrieved_at="2026-08-02",
              district_type="commissioner_precinct",
              district_name_prefix="Commissioner Precinct",
          )
          for feature in canonical["features"]:
              feature["properties"]["source_attribute_request_url"] = live_query_url
          write_json(
              Path("build/travis-county/precincts/geojson/travis_county_commissioner_precincts.geojson"),
              canonical,
          )

          found = {
              str(feature["properties"]["PRECINCT"]): feature["properties"]["COMMISSIONER"]
              for feature in raw_payload["features"]
          }
          expected = {
              "1": "Jeff Travillion",
              "2": "Brigid Shea",
              "3": "Ann Howard",
              "4": "George Morales",
          }
          if found != expected:
              raise SystemExit(f"Travis County commissioner roster mismatch: expected {expected!r}; found {found!r}")
          print("Combined four official precinct geometries with the current live commissioner attributes.")
          PY

      - name: Upload Travis County bootstrap artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travis-county-bootstrap
          path: build/travis-county/
          if-no-files-found: error
