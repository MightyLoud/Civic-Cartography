name: Publish Gillespie County release package

on:
  push:
    branches:
      - agent/gillespie-county-surveyor
    paths:
      - ".github/workflows/publish-gillespie-county.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-gillespie-county:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download validated geometry artifact
        run: |
          rm -rf /tmp/gillespie-derived
          mkdir -p /tmp/gillespie-derived
          gh run download 30785679433 \
            --repo "$GITHUB_REPOSITORY" \
            --name gillespie-county-derived-geometry \
            --dir /tmp/gillespie-derived

      - name: Expand permanent release package
        run: |
          cat > /tmp/gillespie-release.tar.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/gillespie-release.tar.gz.b64 > /tmp/gillespie-release.tar.gz
          tar -xzf /tmp/gillespie-release.tar.gz -C .

      - name: Promote exact geometry and source snapshots
        run: |
          mkdir -p data/raw/gillespie-county data/geojson
          cp /tmp/gillespie-derived/raw/commissioner-precincts-1-4.geojson data/raw/gillespie-county/commissioner-precincts-1-4.geojson
          cp /tmp/gillespie-derived/raw/tigerweb-county-48171.geojson data/raw/gillespie-county/tigerweb-county-48171.geojson
          cp /tmp/gillespie-derived/geojson/gillespie_county_commissioner_precincts.geojson data/geojson/gillespie_county_commissioner_precincts.geojson
          cp /tmp/gillespie-derived/geojson/gillespie_county_countywide.geojson data/geojson/gillespie_county_countywide.geojson
          cp /tmp/gillespie-derived/gis-source-contract.json data/raw/gillespie-county/gis-source-contract.json
          cp /tmp/gillespie-derived/derivation-evidence.json data/raw/gillespie-county/derivation-evidence.json

      - name: Retire temporary workflows and publish
        run: |
          git rm -f \
            .github/workflows/bootstrap-gillespie-county.yml \
            .github/workflows/derive-gillespie-county.yml \
            .github/workflows/publish-gillespie-county.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs scripts tests .github/workflows/validate-gillespie-county.yml
          git diff --cached --check
          git commit -m "Add Gillespie County active County Surveyor release"
          git push origin HEAD:${{ github.ref_name }}
