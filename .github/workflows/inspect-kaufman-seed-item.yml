name: Inspect Kaufman County ArcGIS seed item

on:
  pull_request:
    paths:
      - ".github/workflows/inspect-kaufman-seed-item.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-kaufman-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect seed item and exact four-polygon candidates
        run: |
          set -euo pipefail
          mkdir -p build/kaufman-seed
          curl -sS --compressed --retry 3 --retry-all-errors --max-time 90 \
            'https://www.arcgis.com/sharing/rest/content/items/c13f9cf1c9544c90b0e91b5bd8138c59?f=json' \
            -o build/kaufman-seed/item-metadata.json
          python - <<'PY'
          import json, subprocess, urllib.parse
          from pathlib import Path

          OUT = Path('build/kaufman-seed')
          meta = json.loads((OUT/'item-metadata.json').read_text(encoding='utf-8'))
          evidence = {'metadata':meta, 'services':[], 'candidates':[]}
          service_url = str(meta.get('url') or '').rstrip('/')
          if not service_url:
              (OUT/'seed-item-evidence.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
              print(json.dumps(evidence,indent=2,sort_keys=True))
              raise SystemExit('Seed item has no service URL')
          root = service_url.rsplit('/',1)[0] if service_url.rsplit('/',1)[-1].isdigit() else service_url

          def curl_json(url):
              proc = subprocess.run(
                  ['curl','-sS','--compressed','--retry','3','--retry-all-errors','--max-time','90',url],
                  check=True,
                  capture_output=True,
              )
              return json.loads(proc.stdout.decode('utf-8'))

          service = curl_json(f'{root}?f=json')
          entry = {'root':root,'service':service,'layers':[]}
          layer_ids = [int(x['id']) for x in service.get('layers',[]) if 'id' in x]
          if service_url.rsplit('/',1)[-1].isdigit():
              layer_ids = [int(service_url.rsplit('/',1)[-1])]
          for layer_id in layer_ids:
              layer_url = f'{root}/{layer_id}'
              layer = curl_json(f'{layer_url}?f=json')
              params = urllib.parse.urlencode({'where':'1=1','outFields':'*','returnGeometry':'false','f':'json'})
              rows = [f.get('attributes',{}) for f in curl_json(f'{layer_url}/query?{params}').get('features',[])]
              entry['layers'].append({'layer_url':layer_url,'metadata':layer,'rows':rows})
              if layer.get('geometryType') != 'esriGeometryPolygon':
                  continue
              for field in layer.get('fields',[]):
                  name = str(field.get('name') or '')
                  if field.get('type') == 'esriFieldTypeOID' or name.casefold() in {'objectid','fid','oid'}:
                      continue
                  values = [str(int(v) if isinstance(v,float) and v.is_integer() else v).strip() for v in (row.get(name) for row in rows) if v not in (None,'')]
                  if len(values)==4 and set(values)=={'1','2','3','4'}:
                      evidence['candidates'].append({'layer_url':layer_url,'layer_name':layer.get('name'),'district_field':name,'rows':rows,'fields':[x.get('name') for x in layer.get('fields',[])]})
          evidence['services'].append(entry)
          (OUT/'seed-item-evidence.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'metadata':meta,'candidates':evidence['candidates']},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaufman-seed-item
          path: build/kaufman-seed/
          if-no-files-found: error
