name: Recover Kaufman County GIS assets

on:
  pull_request:
    paths:
      - ".github/workflows/recover-kaufman-gis-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-kaufman-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture official static map and DNS diagnostics
        run: |
          set +e
          mkdir -p build/kaufman-recovery
          curl -L --connect-timeout 20 --max-time 120 \
            -D build/kaufman-recovery/map-headers.txt \
            -o build/kaufman-recovery/commissioner-map.bin \
            'https://www.kaufmancounty.net/ImageRepository/Document?documentId=8470'
          file build/kaufman-recovery/commissioner-map.bin | tee build/kaufman-recovery/map-file-type.txt
          sha256sum build/kaufman-recovery/commissioner-map.bin | tee build/kaufman-recovery/map-sha256.txt
          ls -l build/kaufman-recovery/commissioner-map.bin | tee build/kaufman-recovery/map-size.txt

          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          out = Path('build/kaufman-recovery')
          host = 'gis.kaufmancounty.net'
          results = {}
          for rrtype in ('A','AAAA','CNAME'):
              url = f'https://dns.google/resolve?name={host}&type={rrtype}'
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'Civic-Cartography/1.0'})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      results[rrtype] = json.load(response)
              except Exception as exc:
                  results[rrtype] = {'error': repr(exc)}
          (out / 'dns-google.json').write_text(json.dumps(results, indent=2, sort_keys=True) + '\n')
          print(json.dumps(results, indent=2, sort_keys=True))
          PY

          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          out = Path('build/kaufman-recovery')
          dns = json.loads((out / 'dns-google.json').read_text())
          ips = []
          for answer in dns.get('A', {}).get('Answer', []):
              data = str(answer.get('data') or '')
              if data and data[0].isdigit():
                  ips.append(data)
          targets = {
              'portal-item': '/portal/sharing/rest/content/items/da2d7bb2339b4c67bfe382fc24bb775a?f=pjson',
              'portal-item-data': '/portal/sharing/rest/content/items/da2d7bb2339b4c67bfe382fc24bb775a/data?f=pjson',
              'server-root': '/server/rest/services?f=pjson',
              'hosted-root': '/server/rest/services/Hosted?f=pjson',
              'county-service': '/server/rest/services/Hosted/County/FeatureServer?f=pjson',
              'webmap-item': '/portal/sharing/rest/content/items/47d1781a327a4c4eb7449a2b9610c350?f=pjson',
              'webmap-data': '/portal/sharing/rest/content/items/47d1781a327a4c4eb7449a2b9610c350/data?f=pjson',
          }
          attempts = []
          for ip in ips:
              for name, path in targets.items():
                  output = out / f'{name}-{ip}.txt'
                  cmd = ['curl','-k','-sS','--connect-timeout','15','--max-time','60','--resolve',f'gis.kaufmancounty.net:443:{ip}',f'https://gis.kaufmancounty.net{path}']
                  proc = subprocess.run(cmd, capture_output=True)
                  output.write_bytes(proc.stdout + b'\nSTDERR\n' + proc.stderr)
                  attempts.append({'ip':ip,'target':name,'returncode':proc.returncode,'bytes':len(proc.stdout)})
          (out / 'direct-ip-attempts.json').write_text(json.dumps(attempts, indent=2, sort_keys=True) + '\n')
          print(json.dumps(attempts, indent=2, sort_keys=True))
          PY
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: kaufman-county-recovery
          path: build/kaufman-recovery/
          if-no-files-found: error
