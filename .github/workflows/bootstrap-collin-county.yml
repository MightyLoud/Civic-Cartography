name: Bootstrap Collin County Commissioners Court

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap-collin-county:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test and browser dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install selenium

      - name: Resolve official interactive map layer
        id: source
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          APP_URL = 'https://maps.collincountytx.gov/ccmap_commissioners/'
          USER_AGENT = 'Civic-Cartography-bootstrap/1.0'

          def fetch_json(url):
              request = urllib.request.Request(url, headers={'User-Agent': USER_AGENT})
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1600,1200')
          options.add_argument(f'--user-agent={USER_AGENT}')
          options.set_capability('goog:loggingPrefs', {'performance': 'ALL'})

          driver = webdriver.Chrome(options=options)
          try:
              driver.get(APP_URL)
              time.sleep(15)
              page_source = driver.page_source
              logs = driver.get_log('performance')
          finally:
              driver.quit()

          observed_urls = []
          for entry in logs:
              try:
                  message = json.loads(entry['message'])['message']
              except Exception:
                  continue
              params = message.get('params', {})
              for container in ('request', 'response'):
                  value = params.get(container, {})
                  url = value.get('url') if isinstance(value, dict) else None
                  if isinstance(url, str):
                      observed_urls.append(urllib.parse.unquote(url))

          observed_urls.extend(re.findall(r'https?://[^"\'<>\s]+', page_source))
          roots = set()
          direct_layers = set()
          for url in observed_urls:
              normalized = url.replace('\\/', '/')
              for match in re.findall(r'https?://[^"\'<>\s?]+?/(?:MapServer|FeatureServer)/\d+', normalized, flags=re.I):
                  direct_layers.add(match.rstrip('/'))
              for match in re.findall(r'https?://[^"\'<>\s?]+?/(?:MapServer|FeatureServer)', normalized, flags=re.I):
                  roots.add(match.rstrip('/'))

          candidates = set(direct_layers)
          root_evidence = {}
          for root in sorted(roots):
              if 'collincountytx.gov' not in root:
                  continue
              try:
                  service = fetch_json(f'{root}?f=json')
              except Exception:
                  continue
              root_evidence[root] = service
              for layer in service.get('layers', []):
                  if str(layer.get('name', '')).strip().lower() == 'commissioners':
                      candidates.add(f"{root}/{layer['id']}")

          ranked = []
          for layer_url in sorted(candidates):
              if 'collincountytx.gov' not in layer_url:
                  continue
              try:
                  layer = fetch_json(f'{layer_url}?f=json')
              except Exception:
                  continue
              fields = {field.get('name') for field in layer.get('fields', [])}
              if layer.get('geometryType') != 'esriGeometryPolygon':
                  continue
              if not {'COMMISH', 'COMMISH_N'}.issubset(fields):
                  continue
              score = 100
              description = layer.get('description') or ''
              if '2021-1127-11-01' in description:
                  score += 30
              if 'November 1, 2021' in description:
                  score += 20
              if 'Election_Department' in layer_url:
                  score += 12
              if 'InteractiveMap/Election' in layer_url:
                  score += 10
              if 'VotingPrecincts_Edited_PlanC2333' in layer_url:
                  score += 8
              if '/FeatureServer/' in layer_url:
                  score += 3
              ranked.append((score, layer_url, layer))
          ranked.sort(key=lambda item: (item[0], item[1]), reverse=True)

          if not ranked:
              sample = sorted(set(observed_urls))[:100]
              raise SystemExit(f'No Commissioners polygon layer with COMMISH and COMMISH_N found. Observed URL sample: {sample}')

          layer_url = ranked[0][1]
          contract = {
              'application_url': APP_URL,
              'observed_network_urls': sorted(set(observed_urls)),
              'service_roots': sorted(roots),
              'ranked_layer_candidates': [
                  {
                      'score': score,
                      'layer_url': candidate,
                      'description': layer.get('description'),
                      'service_item_id': layer.get('serviceItemId'),
                  }
                  for score, candidate, layer in ranked
              ],
              'operational_layer_url': layer_url,
          }
          output = Path('build/collin-county/app-source-contract.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(contract, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'layer_url={layer_url}\n')
          print(f'Official application operational layer: {layer_url}')
          PY

      - name: Validate live Collin County precinct attributes
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          layer_url = '${{ steps.source.outputs.layer_url }}'
          query = urllib.parse.urlencode({
              'where': '1=1',
              'outFields': 'COMMISH,COMMISH_N',
              'returnGeometry': 'false',
              'orderByFields': 'COMMISH',
              'f': 'json',
          })
          request = urllib.request.Request(f'{layer_url}/query?{query}', headers={'User-Agent': 'Civic-Cartography-bootstrap/1.0'})
          with urllib.request.urlopen(request, timeout=45) as response:
              payload = json.load(response)
          rows = {str(feature['attributes']['COMMISH']): feature['attributes'] for feature in payload.get('features', [])}
          expected = {
              '1': 'Susan Fletcher',
              '2': 'Cheryl Williams',
              '3': 'Darrell Hale',
              '4': 'Duncan Webb',
          }
          if set(rows) != set(expected):
              raise SystemExit(f'Unexpected Collin County precinct IDs: {sorted(rows)}')
          for precinct_id, officeholder in expected.items():
              if rows[precinct_id].get('COMMISH_N') != officeholder:
                  raise SystemExit(f'Precinct {precinct_id} roster drift: {rows[precinct_id].get("COMMISH_N")!r} != {officeholder!r}')
          output = Path('build/collin-county/live-layer-attributes.json')
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(rows, indent=2, sort_keys=True))
          PY

      - name: Fetch current Collin County Commissioner precincts
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url "${{ steps.source.outputs.layer_url }}" \
            --district-ids 1,2,3,4 \
            --district-field COMMISH \
            --district-type commissioner_precinct \
            --district-name-prefix "Commissioner Precinct" \
            --jurisdiction-name "Collin County" \
            --record-id-prefix TX:county:collin:commissioner_precinct \
            --geometry-id-prefix collin-county-commissioner-precinct \
            --source-agency "Collin County GIS" \
            --retrieved-at 2026-08-02 \
            --raw-output build/collin-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --output build/collin-county/precincts/geojson/collin_county_commissioner_precincts.geojson

      - name: Fetch current Collin County boundary
        run: |
          python scripts/fetch_tigerweb_county.py \
            --geoid 48085 \
            --record-id TX:county:collin:countywide:COUNTYWIDE \
            --geometry-id collin-county-countywide \
            --retrieved-at 2026-08-02 \
            --raw-output build/collin-county/county/raw/tigerweb-county-48085.geojson \
            --output build/collin-county/county/geojson/collin_county_countywide.geojson

      - name: Commit generated Collin County snapshots
        if: github.event_name == 'push'
        run: |
          mkdir -p data/raw/collin-county data/geojson
          cp build/collin-county/precincts/raw/commissioner-precincts-1-4.geojson data/raw/collin-county/commissioner-precincts-1-4.geojson
          cp build/collin-county/precincts/geojson/collin_county_commissioner_precincts.geojson data/geojson/collin_county_commissioner_precincts.geojson
          cp build/collin-county/county/raw/tigerweb-county-48085.geojson data/raw/collin-county/tigerweb-county-48085.geojson
          cp build/collin-county/county/geojson/collin_county_countywide.geojson data/geojson/collin_county_countywide.geojson
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/raw/collin-county/commissioner-precincts-1-4.geojson \
            data/geojson/collin_county_commissioner_precincts.geojson \
            data/raw/collin-county/tigerweb-county-48085.geojson \
            data/geojson/collin_county_countywide.geojson
          if git diff --cached --quiet; then
            echo "Collin County snapshots already match generated output."
            exit 0
          fi
          git commit -m "Add Collin County source snapshots"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload Collin County bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: collin-county-bootstrap
          path: build/collin-county/
          if-no-files-found: error
