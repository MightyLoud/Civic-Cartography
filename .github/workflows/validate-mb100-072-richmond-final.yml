name: Validate MB100-072 Richmond final contract

on:
  pull_request:
    paths:
      - ".github/workflows/validate-mb100-072-richmond-final.yml"
      - "scripts/validate_mb100_072_richmond.py"
      - "tests/fixtures/mb100_reconciliation.yml"
      - "tests/test_richmond_independent_city_alias.py"
      - "data/canonical_alias_groups.yml"
      - "data/authoritative_jurisdiction_overrides.yml"
      - "scripts/capture_upstream_batch.py"
      - "scripts/capture_upstream_batch_with_overrides.py"
      - "scripts/normalize_capture_acceptance.py"
      - "scripts/normalize_canonical_alias_acceptance.py"
      - "scripts/run_target_manifest.py"
      - "scripts/check_completion_manifest.py"
      - "scripts/update_completion_register.py"
      - "civic_cartography/canonical_aliases.py"
      - "civic_cartography/completion_manifest.py"
      - "civic_cartography/completion_register.py"
      - "civic_cartography/target_manifest.py"
      - "patches/openstates-jurisdictions/**"
      - "evidence/measured-batch-100/completion-register.csv"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: openstates/jurisdictions
  UPSTREAM_REVISION: 6fbe7d6aed32c3b781490c8e4c5a737bdd6e4705
  RUN_ASOF: 2026-08-09T16:51:22Z
  TARGET_MANIFEST: tests/fixtures/mb100_reconciliation.yml
  OVERRIDE_REGISTRY: data/authoritative_jurisdiction_overrides.yml
  ALIAS_REGISTRY: data/canonical_alias_groups.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Civic-Cartography
        uses: actions/checkout@v4

      - name: Check out pinned upstream generator
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REVISION }}
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install uv
          cd upstream
          uv sync --frozen

      - name: Validate Richmond alias contract
        run: |
          python -m pytest \
            tests/test_canonical_aliases.py \
            tests/test_richmond_independent_city_alias.py

      - name: Apply validated upstream patches
        run: |
          for patch in \
            patches/openstates-jurisdictions/0001-continue-jurisdiction-after-stub.patch \
            patches/openstates-jurisdictions/0002-normalize-blank-lsad-before-classification.patch \
            patches/openstates-jurisdictions/0003-authoritative-jurisdiction-overrides.patch; do
            git -C upstream apply --check "../$patch"
            git -C upstream apply "../$patch"
          done
          git -C upstream add -A
          git -C upstream -c user.name="Civic Cartography" \
            -c user.email="civic-cartography@example.invalid" \
            commit -m "Apply validated upstream fixes 1-3"
          for patch in \
            patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch \
            patches/openstates-jurisdictions/0005-transit-division-jurisdiction-classification.patch \
            patches/openstates-jurisdictions/0006-territory-municipio-support.patch; do
            git -C upstream apply --check "../$patch"
            git -C upstream apply "../$patch"
          done
          git -C upstream diff --check

      - name: Capture two clean deterministic runs
        run: |
          mkdir -p build
          for n in 1 2; do
            success=0
            for attempt in 1 2 3; do
              rm -rf "build/run-$n"
              if PYTHONPATH=. upstream/.venv/bin/python \
                scripts/capture_upstream_batch_with_overrides.py \
                --override-registry "$OVERRIDE_REGISTRY" \
                --alias-registry "$ALIAS_REGISTRY" \
                --upstream-root upstream \
                --target-manifest "$TARGET_MANIFEST" \
                --run-asof "$RUN_ASOF" \
                --source-dir build/upstream-source \
                --work-dir "build/run-$n" \
                --execution-results "build/run-$n/execution-results.json" \
                --diagnostics "build/run-$n/diagnostics.json"; then
                success=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                rm -rf build/upstream-source
                sleep 2
              fi
            done
            if [ "$success" -ne 1 ]; then
              exit 2
            fi
            python scripts/normalize_capture_acceptance.py \
              --target-manifest "$TARGET_MANIFEST" \
              --execution-results "build/run-$n/execution-results.json" \
              --diagnostics "build/run-$n/diagnostics.json"
            PYTHONPATH=. python scripts/normalize_canonical_alias_acceptance.py \
              --alias-registry "$ALIAS_REGISTRY" \
              --target-manifest "$TARGET_MANIFEST" \
              --execution-results "build/run-$n/execution-results.json" \
              --diagnostics "build/run-$n/diagnostics.json"
            python scripts/run_target_manifest.py \
              --target-manifest "$TARGET_MANIFEST" \
              --run-asof "$RUN_ASOF" \
              --execution-results "build/run-$n/execution-results.json" \
              --artifact-root "build/run-$n/artifacts" \
              --result-path "build/run-$n/report.json"
          done

      - name: Build raw-source manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("build/upstream-source")
          files = {}
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              rel = path.relative_to(root).as_posix()
              files[rel] = {
                  "path": rel,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size_bytes": path.stat().st_size,
              }
          if not files:
              raise SystemExit("No raw source files were retained")
          payload = {
              "version": 1,
              "generator_repository": os.environ["UPSTREAM_REPOSITORY"],
              "generator_revision": os.environ["UPSTREAM_REVISION"],
              "files": files,
          }
          Path("build/source-manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Require explicit completion contract
        run: |
          python scripts/check_completion_manifest.py \
            --target-manifest "$TARGET_MANIFEST" \
            --first-report build/run-1/report.json \
            --second-report build/run-2/report.json \
            --source-manifest build/source-manifest.json \
            --result-path build/mb100-072-completion.json \
            --require-all-complete

      - name: Project completion evidence register
        run: |
          cp evidence/measured-batch-100/completion-register.csv \
            build/completion-register.csv
          python scripts/update_completion_register.py \
            --completion-manifest build/mb100-072-completion.json \
            --register-path build/completion-register.csv \
            --evidence-ref \
              "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Validate exact Richmond identity and source alignment
        run: PYTHONPATH=. python scripts/validate_mb100_072_richmond.py

      - name: Upload governed Richmond evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mb100-072-richmond-final-evidence
          path: |
            build/mb100-072-final-summary.json
            build/mb100-072-completion.json
            build/source-manifest.json
            build/completion-register.csv
            build/run-1/report.json
            build/run-1/execution-results.json
            build/run-1/diagnostics.json
            build/run-1/artifacts/divisions/va/local/*.yaml
            build/run-1/artifacts/jurisdictions/va/local/*.yaml
            build/run-2/report.json
            build/run-2/execution-results.json
            build/run-2/diagnostics.json
            build/run-2/artifacts/divisions/va/local/*.yaml
            build/run-2/artifacts/jurisdictions/va/local/*.yaml
          if-no-files-found: error
