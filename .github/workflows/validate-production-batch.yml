name: Validate Generic Production Manifest

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Target manifest path
        required: true
        default: tests/fixtures/production_batch_wa_100.yml
      wave:
        description: Wave identifier
        required: true
        default: WA-PB01-A
      expected_target_count:
        description: Optional expected target count; blank derives it from the manifest
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/validate-production-batch.yml"
      - "scripts/run_production_batch.py"
      - "civic_cartography/target_manifest.py"
      - "civic_cartography/production_wave.py"
      - "schemas/target-manifest.schema.json"
      - "tests/test_target_manifest.py"
      - "tests/test_production_wave.py"
      - "tests/fixtures/production_batch_ca_pilot.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run manifest and production-wave regression tests
        run: python -m pytest tests/test_target_manifest.py tests/test_production_wave.py --color=yes
      - name: Select requested production wave
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          args=(--manifest "${{ inputs.manifest }}" --wave "${{ inputs.wave }}" --result-path build/generic-wave.yml)
          if [[ -n "${{ inputs.expected_target_count }}" ]]; then
            args+=(--expected-target-count "${{ inputs.expected_target_count }}")
          fi
          python scripts/run_production_batch.py "${args[@]}"
