name: Probe Kaufman County GIS two-hop graph

on:
  pull_request:
    paths:
      - ".github/workflows/probe-kaufman-county-gis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-kaufman-county-gis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve two-hop ArcGIS graph
        run: |
          python - <<'PY'
          import json, re, subprocess, urllib.parse, urllib.request
          from pathlib import Path

          PORTAL = "https://gis.kaufmancounty.net/portal/sharing/rest"
          APP = "da2d7bb2339b4c67bfe382fc24bb775a"
          ID_RE = re.compile(r"(?<![0-9a-fA-F])([0-9a-fA-F]{32})(?![0-9a-fA-F])")
          URL_RE = re.compile(r"https?://[^\"'\\\s]+?/(?:FeatureServer|MapServer)(?:/\d+)?", re.I)
          out = Path("build/kaufman-county")
          out.mkdir(parents=True, exist_ok=True)

          def get(url, timeout=12):
              req = urllib.request.Request(url, headers={"User-Agent":"Civic-Cartography/1.0"})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  value = json.load(response)
              return value if isinstance(value, dict) else {}

          def item(item_id, data=False):
              suffix = "/data" if data else ""
              return get(f"{PORTAL}/content/items/{item_id}{suffix}?f=json")

          graph = {}
          roots = set()
          app_meta = item(APP)
          app_data = item(APP, True)
          graph[APP] = {"metadata":app_meta,"data":app_data}
          first_ids = list(dict.fromkeys(x.lower() for x in ID_RE.findall(json.dumps(app_data))))[:12]
          second_ids = []
          for item_id in first_ids:
              try:
                  meta, data = item(item_id), item(item_id, True)
              except Exception as exc:
                  graph[item_id] = {"error":repr(exc)}
                  continue
              graph[item_id] = {"metadata":meta,"data":data}
              if str(meta.get("type") or "") in {"Web Map","Feature Service","Map Service"}:
                  second_ids.extend(x.lower() for x in ID_RE.findall(json.dumps(data)))
          for item_id in list(dict.fromkeys(second_ids))[:12]:
              if item_id in graph:
                  continue
              try:
                  graph[item_id] = {"metadata":item(item_id),"data":item(item_id,True)}
              except Exception as exc:
                  graph[item_id] = {"error":repr(exc)}

          for value in graph.values():
              text = json.dumps(value)
              for url in URL_RE.findall(text):
                  roots.add(re.sub(r"/\d+$","",url.rstrip("/.,;)")))
              meta = value.get("metadata",{}) if isinstance(value,dict) else {}
              url = str(meta.get("url") or "").rstrip("/")
              if re.search(r"/(?:FeatureServer|MapServer)(?:/\d+)?$",url,re.I):
                  roots.add(re.sub(r"/\d+$","",url))

          inspected=[]; candidates=[]
          for root in sorted(roots):
              try:
                  service=get(f"{root}?f=json")
              except Exception as exc:
                  inspected.append({"root":root,"error":repr(exc)}); continue
              for layer in service.get("layers",[]):
                  url=f"{root}/{int(layer['id'])}"
                  try:
                      meta=get(f"{url}?f=json")
                      if meta.get("geometryType") != "esriGeometryPolygon": continue
                      q=urllib.parse.urlencode({"where":"1=1","outFields":"*","returnGeometry":"false","f":"json"})
                      rows=[f.get("attributes",{}) for f in get(f"{url}/query?{q}").get("features",[])]
                  except Exception as exc:
                      inspected.append({"url":url,"error":repr(exc)}); continue
                  inspected.append({"url":url,"name":meta.get("name"),"fields":meta.get("fields",[]),"rows":rows})
                  for field in meta.get("fields",[]):
                      name=str(field.get("name") or "")
                      if field.get("type")=="esriFieldTypeOID" or name.casefold() in {"objectid","fid","oid"}: continue
                      vals=[str(int(v) if isinstance(v,float) and v.is_integer() else v).strip() for v in (r.get(name) for r in rows) if v not in (None,"")]
                      if len(vals)==4 and set(vals)=={"1","2","3","4"}:
                          hay=f"{root} {meta.get('name','')} {name}".casefold()
                          score=sum(p for m,p in (("commissioner",100),("precinct",70),("commission",60),("pct",40),("district",20)) if m in hay)
                          candidates.append({"score":score,"layer_url":url,"layer_name":meta.get("name"),"district_field":name,"geometry_type":meta.get("geometryType"),"layer_fields":[x.get("name") for x in meta.get("fields",[])],"source_rows":rows})

          evidence={"app_metadata":app_meta,"graph":graph,"service_roots":sorted(roots),"inspected":inspected,"candidates":sorted(candidates,key=lambda x:(-x['score'],x['layer_url'],x['district_field']))}
          (out/"discovery-evidence.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n")
          if not candidates: raise SystemExit("Two-hop graph produced no exact Commissioner candidate")
          selected=sorted(candidates,key=lambda x:(-x['score'],x['layer_url'],x['district_field']))[0]
          contract={"portal_url":PORTAL,"application_item_id":APP,"application_title":app_meta.get("title"),"application_owner":app_meta.get("owner"),**selected,"district_values":["1","2","3","4"],"resolved_from_official_county_application":True,"source_retrieved_at":"2026-08-02"}
          (out/"gis-source-contract.json").write_text(json.dumps(contract,indent=2,sort_keys=True)+"\n")
          print(json.dumps(contract,indent=2,sort_keys=True))
          subprocess.run(["python","scripts/fetch_arcgis_districts.py","--layer-url",selected["layer_url"],"--district-ids","1,2,3,4","--district-field",selected["district_field"],"--district-type","commissioner_precinct","--district-name-prefix","Commissioner Precinct","--jurisdiction-name","Kaufman County","--record-id-prefix","TX:county:kaufman:commissioner_precinct","--geometry-id-prefix","kaufman-county-commissioner-precinct","--source-agency","Kaufman County GIS","--retrieved-at","2026-08-02","--raw-output","build/kaufman-county/raw/commissioner-precincts-1-4.geojson","--output","build/kaufman-county/geojson/kaufman_county_commissioner_precincts.geojson"],check=True)
          subprocess.run(["python","scripts/fetch_tigerweb_county.py","--geoid","48257","--record-id","TX:county:kaufman:countywide:COUNTYWIDE","--geometry-id","kaufman-county-countywide","--retrieved-at","2026-08-02","--raw-output","build/kaufman-county/raw/tigerweb-county-48257.geojson","--output","build/kaufman-county/geojson/kaufman_county_countywide.geojson"],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaufman-county-probe
          path: build/kaufman-county/
          if-no-files-found: error
