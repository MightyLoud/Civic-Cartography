name: Capture upstream six fixtures

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/capture-upstream-six-fixtures.yml"
      - "scripts/capture_upstream_fixtures.py"
      - "scripts/capture_upstream_with_authoritative_overrides.py"
      - "scripts/normalize_capture_acceptance.py"
      - "scripts/normalize_canonical_alias_acceptance.py"
      - "data/authoritative_jurisdiction_overrides.yml"
      - "data/canonical_alias_groups.yml"
      - "civic_cartography/authoritative_overrides.py"
      - "civic_cartography/canonical_aliases.py"
      - "patches/openstates-jurisdictions/0001-continue-jurisdiction-after-stub.patch"
      - "patches/openstates-jurisdictions/0002-normalize-blank-lsad-before-classification.patch"
      - "patches/openstates-jurisdictions/0003-authoritative-jurisdiction-overrides.patch"
      - "patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch"
      - "tests/test_authoritative_overrides.py"
      - "tests/test_canonical_aliases.py"
      - "tests/test_canonical_alias_acceptance.py"
      - "tests/fixtures/batch_pilot_25.yml"
      - "civic_cartography/fixture_harness.py"
      - "civic_cartography/target_manifest.py"

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: openstates/jurisdictions
  UPSTREAM_REVISION: 6fbe7d6aed32c3b781490c8e4c5a737bdd6e4705
  RUN_ASOF: 2026-08-02T15:00:00Z
  PATCH_1: patches/openstates-jurisdictions/0001-continue-jurisdiction-after-stub.patch
  PATCH_2: patches/openstates-jurisdictions/0002-normalize-blank-lsad-before-classification.patch
  PATCH_3: patches/openstates-jurisdictions/0003-authoritative-jurisdiction-overrides.patch
  PATCH_4: patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch
  OVERRIDE_REGISTRY: data/authoritative_jurisdiction_overrides.yml
  ALIAS_REGISTRY: data/canonical_alias_groups.yml

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out Civic-Cartography
        uses: actions/checkout@v4

      - name: Check out pinned upstream generator
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REVISION }}
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Civic-Cartography test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate maintained registries and acceptance semantics
        run: |
          python -m pytest \
            tests/test_authoritative_overrides.py \
            tests/test_canonical_aliases.py \
            tests/test_canonical_alias_acceptance.py \
            --color=yes

      - name: Record maintained registry evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          Path("build").mkdir(exist_ok=True)
          for source, output in (
              (
                  Path("data/authoritative_jurisdiction_overrides.yml"),
                  Path("build/authoritative-overrides-manifest.json"),
              ),
              (
                  Path("data/canonical_alias_groups.yml"),
                  Path("build/canonical-aliases-manifest.json"),
              ),
          ):
              output.write_text(
                  json.dumps(
                      {
                          "version": 1,
                          "path": source.as_posix(),
                          "sha256": hashlib.sha256(source.read_bytes()).hexdigest(),
                          "verified_asof": "2026-08-02",
                      },
                      indent=2,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Install uv and pinned upstream dependencies
        run: |
          python -m pip install uv
          cd upstream
          uv sync --frozen

      - name: Apply and reproduce validated upstream patches
        run: |
          git -C upstream apply --check "../$PATCH_1"
          git -C upstream apply "../$PATCH_1"
          git -C upstream apply --check "../$PATCH_2"
          git -C upstream apply "../$PATCH_2"
          git -C upstream apply --check "../$PATCH_3"
          git -C upstream apply "../$PATCH_3"
          git -C upstream add -A
          git -C upstream \
            -c user.name="Civic Cartography" \
            -c user.email="civic-cartography@example.invalid" \
            commit -m "Apply validated upstream fixes 1-3"

          git -C upstream apply --check "../$PATCH_4"
          git -C upstream apply "../$PATCH_4"
          git -C upstream add -N .
          git -C upstream diff --check
          git -C upstream diff --binary > build-normalized-patch-4.patch
          if ! cmp -s "$PATCH_4" build-normalized-patch-4.patch; then
            diff -u "$PATCH_4" build-normalized-patch-4.patch
            exit 1
          fi

      - name: Test upstream override and canonical alias behavior
        run: |
          cd upstream
          uv run pytest \
            tests/src/init_migration/test_generate_pipeline_stub_classification.py \
            tests/src/init_migration/test_jurisdiction_seed.py \
            tests/src/init_migration/test_authoritative_jurisdiction_override.py \
            tests/src/init_migration/test_canonical_alias_generation.py \
            --color=yes
          uv run ruff check \
            src/init_migration/pipeline_models.py \
            src/init_migration/generate_pipeline.py \
            src/init_migration/generate_division.py \
            src/init_migration/generate_jurisdiction.py \
            tests/src/init_migration/test_authoritative_jurisdiction_override.py \
            tests/src/init_migration/test_canonical_alias_generation.py

      - name: Capture clean upstream run 1
        run: |
          PYTHONPATH=. upstream/.venv/bin/python scripts/capture_upstream_with_authoritative_overrides.py \
            --override-registry "$OVERRIDE_REGISTRY" \
            --alias-registry "$ALIAS_REGISTRY" \
            --upstream-root upstream \
            --target-manifest tests/fixtures/batch_pilot_25.yml \
            --run-asof "$RUN_ASOF" \
            --source-dir build/upstream-source \
            --work-dir build/run-1 \
            --execution-results build/run-1/execution-results.json \
            --diagnostics build/run-1/diagnostics.json
          python scripts/normalize_capture_acceptance.py \
            --target-manifest tests/fixtures/batch_pilot_25.yml \
            --execution-results build/run-1/execution-results.json \
            --diagnostics build/run-1/diagnostics.json
          PYTHONPATH=. python scripts/normalize_canonical_alias_acceptance.py \
            --alias-registry "$ALIAS_REGISTRY" \
            --target-manifest tests/fixtures/batch_pilot_25.yml \
            --execution-results build/run-1/execution-results.json \
            --diagnostics build/run-1/diagnostics.json
          python scripts/run_target_manifest.py \
            --target-manifest tests/fixtures/batch_pilot_25.yml \
            --run-asof "$RUN_ASOF" \
            --execution-results build/run-1/execution-results.json \
            --artifact-root build/run-1/artifacts \
            --result-path build/run-1/report.json

      - name: Capture clean upstream run 2
        run: |
          PYTHONPATH=. upstream/.venv/bin/python scripts/capture_upstream_with_authoritative_overrides.py \
            --override-registry "$OVERRIDE_REGISTRY" \
            --alias-registry "$ALIAS_REGISTRY" \
            --upstream-root upstream \
            --target-manifest tests/fixtures/batch_pilot_25.yml \
            --run-asof "$RUN_ASOF" \
            --source-dir build/upstream-source \
            --work-dir build/run-2 \
            --execution-results build/run-2/execution-results.json \
            --diagnostics build/run-2/diagnostics.json
          python scripts/normalize_capture_acceptance.py \
            --target-manifest tests/fixtures/batch_pilot_25.yml \
            --execution-results build/run-2/execution-results.json \
            --diagnostics build/run-2/diagnostics.json
          PYTHONPATH=. python scripts/normalize_canonical_alias_acceptance.py \
            --alias-registry "$ALIAS_REGISTRY" \
            --target-manifest tests/fixtures/batch_pilot_25.yml \
            --execution-results build/run-2/execution-results.json \
            --diagnostics build/run-2/diagnostics.json
          python scripts/run_target_manifest.py \
            --target-manifest tests/fixtures/batch_pilot_25.yml \
            --run-asof "$RUN_ASOF" \
            --execution-results build/run-2/execution-results.json \
            --artifact-root build/run-2/artifacts \
            --result-path build/run-2/report.json

      - name: Evaluate strict six-fixture gate
        run: |
          PYTHONPATH=. python scripts/check_regression_fixtures.py \
            --target-manifest tests/fixtures/batch_pilot_25.yml \
            --first-report build/run-1/report.json \
            --second-report build/run-2/report.json \
            --upstream-repository "$UPSTREAM_REPOSITORY" \
            --upstream-revision "$UPSTREAM_REVISION" \
            --result-path build/fixture-evaluation.json

      - name: Assert six-fixture result and canonical artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          evaluation = json.loads(Path("build/fixture-evaluation.json").read_text())
          fixtures = {row["target_id"]: row for row in evaluation["fixtures"]}
          assert all(row["status"] == "passed" for row in fixtures.values())
          assert evaluation["summary"]["passed_count"] == 6
          assert evaluation["summary"]["deterministic_count"] == 6
          assert evaluation["summary"]["report_content_match"] is True
          assert evaluation["summary"]["gate_passed"] is True

          rtd_division_id = (
              "ocd-division/country:us/state:co/"
              "special_district:regional_transportation_district"
          )
          rtd_jurisdiction_id = (
              "ocd-jurisdiction/country:us/state:co/"
              "special_district:regional_transportation_district/transit_authority"
          )
          rtd = fixtures["BP25-018"]
          assert rtd["resolved_ocdids"] == [rtd_division_id]
          assert rtd["inferred_classification"] == "transit_authority"
          assert len(rtd["division_paths"]) == 1
          assert len(rtd["jurisdiction_paths"]) == 1

          artifact_root = Path("build/run-1/artifacts")
          rtd_division = yaml.safe_load(
              (artifact_root / rtd["division_paths"][0]).read_text()
          )
          rtd_jurisdiction = yaml.safe_load(
              (artifact_root / rtd["jurisdiction_paths"][0]).read_text()
          )
          assert rtd_division["ocdid"] == rtd_division_id
          assert rtd_division["jurisdiction_id"] == rtd_jurisdiction_id
          assert rtd_jurisdiction["ocdid"] == rtd_jurisdiction_id
          assert rtd_jurisdiction["classification"] == "transit_authority"
          assert rtd_jurisdiction["url"] == "https://www.rtd-denver.com/"

          place = "ocd-division/country:us/state:co/place:denver"
          county = "ocd-division/country:us/state:co/county:denver"
          canonical_jurisdiction = (
              "ocd-jurisdiction/country:us/state:co/place:denver/government"
          )
          denver = fixtures["BP25-022"]
          assert denver["resolved_ocdids"] == sorted([place, county])
          assert denver["inferred_classification"] == "government"
          assert denver["exception_class"] is None
          assert len(denver["division_paths"]) == 2
          assert len(denver["jurisdiction_paths"]) == 1

          divisions = [
              yaml.safe_load((artifact_root / path).read_text())
              for path in denver["division_paths"]
          ]
          by_ocdid = {division["ocdid"]: division for division in divisions}
          assert set(by_ocdid) == {place, county}
          assert by_ocdid[place]["jurisdiction_id"] == canonical_jurisdiction
          assert by_ocdid[county]["jurisdiction_id"] == canonical_jurisdiction

          jurisdiction = yaml.safe_load(
              (artifact_root / denver["jurisdiction_paths"][0]).read_text()
          )
          assert jurisdiction["ocdid"] == canonical_jurisdiction
          assert jurisdiction["name"] == "City and County of Denver"
          assert jurisdiction["classification"] == "government"
          assert jurisdiction["url"] == "https://www.denvergov.org/"
          assert jurisdiction["sourcing"][0]["source_name"] == "City and County of Denver"

          diagnostics = json.loads(Path("build/run-1/diagnostics.json").read_text())
          by_id = {row["target_id"]: row for row in diagnostics["targets"]}
          assert by_id["BP25-018"]["attempts"][0]["source"] == "authoritative_override"
          assert by_id["BP25-018"]["enrichment_status"] == "partial"
          detail = by_id["BP25-022"]
          assert detail["canonical_alias"]["invariant_errors"] == []
          attempts = {row["ocdid"]: row for row in detail["attempts"]}
          assert attempts[place]["canonical_alias_is_canonical"] is True
          assert attempts[place]["suppress_jurisdiction_generation"] is False
          assert attempts[place]["jurisdiction_path"]
          assert attempts[county]["canonical_alias_is_canonical"] is False
          assert attempts[county]["suppress_jurisdiction_generation"] is True
          assert attempts[county]["jurisdiction_path"] is None
          assert detail["enrichment_status"] == "partial"
          PY

      - name: Write capture summary
        if: always()
        run: |
          if [[ -f build/fixture-evaluation.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/fixture-evaluation.json").read_text())
          diagnostics = json.loads(Path("build/run-1/diagnostics.json").read_text())
          enrichment = {
              row["target_id"]: row.get("enrichment_status", "not_recorded")
              for row in diagnostics["targets"]
          }
          summary = report["summary"]
          lines = [
              "## Real upstream six-fixture capture",
              "",
              f"- Upstream: `{report['upstream']['repository']}@{report['upstream']['revision']}`",
              f"- Fixtures passed: **{summary['passed_count']}/{summary['fixture_count']}**",
              f"- Deterministic fixtures: **{summary['deterministic_count']}/{summary['fixture_count']}**",
              f"- Full report match: **{summary['report_content_match']}**",
              f"- Gate passed: **{summary['gate_passed']}**",
              "",
              "| Fixture | Status | Generation | Enrichment | Exception |",
              "|---|---|---|---|---|",
          ]
          for fixture in report["fixtures"]:
              lines.append(
                  f"| {fixture['jurisdiction_name']} | {fixture['status']} | "
                  f"{fixture.get('generation_status')} | "
                  f"{enrichment.get(fixture['target_id'], '')} | "
                  f"{fixture.get('exception_class') or ''} |"
              )
          Path("capture-summary.md").write_text("\n".join(lines) + "\n")
          PY
            cat capture-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Real upstream six-fixture capture" >> "$GITHUB_STEP_SUMMARY"
            echo "Capture failed before the evaluation report was written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-six-fixture-capture
          path: |
            data/authoritative_jurisdiction_overrides.yml
            data/canonical_alias_groups.yml
            build/authoritative-overrides-manifest.json
            build/canonical-aliases-manifest.json
            build-normalized-patch-4.patch
            build/upstream-source/source-manifest.json
            build/run-1/execution-results.json
            build/run-1/diagnostics.json
            build/run-1/report.json
            build/run-1/artifacts
            build/run-2/execution-results.json
            build/run-2/diagnostics.json
            build/run-2/report.json
            build/run-2/artifacts
            build/fixture-evaluation.json
            capture-summary.md
          if-no-files-found: warn
