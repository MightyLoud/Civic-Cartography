name: Capture MB100-002 through MB100-012

on:
  pull_request:
    paths:
      - ".github/workflows/capture-upstream-six-fixtures.yml"
      - "tests/fixtures/mb100_002_012.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: openstates/jurisdictions
  UPSTREAM_REVISION: 6fbe7d6aed32c3b781490c8e4c5a737bdd6e4705
  RUN_ASOF: 2026-08-06T13:32:00Z
  TARGET_MANIFEST: tests/fixtures/mb100_002_012.yml
  OVERRIDE_REGISTRY: data/authoritative_jurisdiction_overrides.yml
  ALIAS_REGISTRY: data/canonical_alias_groups.yml

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REVISION }}
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install uv
          cd upstream
          uv sync --frozen
      - name: Apply validated patches
        run: |
          for patch in patches/openstates-jurisdictions/0001-continue-jurisdiction-after-stub.patch patches/openstates-jurisdictions/0002-normalize-blank-lsad-before-classification.patch patches/openstates-jurisdictions/0003-authoritative-jurisdiction-overrides.patch; do
            git -C upstream apply --check "../$patch"
            git -C upstream apply "../$patch"
          done
          git -C upstream add -A
          git -C upstream -c user.name="Civic Cartography" -c user.email="civic-cartography@example.invalid" commit -m "Apply validated fixes"
          git -C upstream apply --check ../patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch
          git -C upstream apply ../patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch
          git -C upstream diff --check
      - name: Capture two clean runs
        run: |
          for n in 1 2; do
            PYTHONPATH=. upstream/.venv/bin/python scripts/capture_upstream_with_authoritative_overrides.py \
              --override-registry "$OVERRIDE_REGISTRY" \
              --alias-registry "$ALIAS_REGISTRY" \
              --upstream-root upstream \
              --target-manifest "$TARGET_MANIFEST" \
              --run-asof "$RUN_ASOF" \
              --source-dir build/upstream-source \
              --work-dir "build/run-$n" \
              --execution-results "build/run-$n/execution-results.json" \
              --diagnostics "build/run-$n/diagnostics.json"
            python scripts/normalize_capture_acceptance.py \
              --target-manifest "$TARGET_MANIFEST" \
              --execution-results "build/run-$n/execution-results.json" \
              --diagnostics "build/run-$n/diagnostics.json"
            PYTHONPATH=. python scripts/normalize_canonical_alias_acceptance.py \
              --alias-registry "$ALIAS_REGISTRY" \
              --target-manifest "$TARGET_MANIFEST" \
              --execution-results "build/run-$n/execution-results.json" \
              --diagnostics "build/run-$n/diagnostics.json"
            python scripts/run_target_manifest.py \
              --target-manifest "$TARGET_MANIFEST" \
              --run-asof "$RUN_ASOF" \
              --execution-results "build/run-$n/execution-results.json" \
              --artifact-root "build/run-$n/artifacts" \
              --result-path "build/run-$n/report.json"
          done
      - name: Evaluate strict parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('build/run-1/report.json').read_text())
          b=json.loads(Path('build/run-2/report.json').read_text())
          fields=('match_status','classification_status','generation_status','resolved_ocdids','division_paths','jurisdiction_paths','output_hashes','exception_class','review_reason')
          def norm(r): return {x['target_id']:{k:x[k] for k in fields} for x in r['results']}
          na,nb=norm(a),norm(b)
          rows=[]
          for tid in sorted(na):
            x=na[tid]
            parity=x==nb[tid]
            passed=parity and x['match_status']=='matched' and x['classification_status']=='matched' and x['generation_status']=='generated' and x['exception_class'] is None
            rows.append({'target_id':tid,**x,'canonical_ids':sorted(Path(p).stem for p in x['jurisdiction_paths']),'parity_ok':parity,'qa_status':'PASS' if passed else 'FAIL'})
          out={'schema_version':1,'run_asof':a['run_asof'],'upstream_repository':'openstates/jurisdictions','upstream_revision':'6fbe7d6aed32c3b781490c8e4c5a737bdd6e4705','repository_commit':'${{ github.sha }}','run_1_id':a['run_id'],'run_2_id':b['run_id'],'parity_ok':na==nb,'pass_count':sum(r['qa_status']=='PASS' for r in rows),'target_count':len(rows),'results':rows}
          Path('build/mb100-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          if not out['parity_ok'] or out['pass_count'] != out['target_count']:
            raise SystemExit(json.dumps(out,indent=2))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mb100-002-012-evidence
          path: |
            build/mb100-summary.json
            build/run-1/report.json
            build/run-1/execution-results.json
            build/run-1/diagnostics.json
            build/run-2/report.json
            build/run-2/execution-results.json
            build/run-2/diagnostics.json
          if-no-files-found: error
