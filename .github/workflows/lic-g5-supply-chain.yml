name: Validate LIC-G5 Supply Chain

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "requirements-dev.txt"
      - "requirements-dev.lock"
      - "THIRD_PARTY_NOTICES.md"
      - "sbom.cdx.json"
      - "fitz.py"
      - "scripts/fitz.py"
      - "scripts/build_supply_chain_artifacts.py"
      - "scripts/lic_g5_evidence.py"
      - "scripts/validate_supply_chain.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lic-g5:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Prepare evidence directory
        run: mkdir -p evidence/licensing/lic-g5

      - name: Install exact locked environment
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Regenerate deterministic hashed lock
        id: lock
        shell: bash
        run: |
          set +e
          rm -f /tmp/requirements-dev.generated.lock /tmp/requirements-dev.generated.second.lock
          uv pip compile requirements-dev.txt --generate-hashes --python-version 3.12 --no-header --output-file /tmp/requirements-dev.generated.lock
          first=$?
          uv pip compile requirements-dev.txt --generate-hashes --python-version 3.12 --no-header --output-file /tmp/requirements-dev.generated.second.lock
          second=$?
          cmp -s /tmp/requirements-dev.generated.lock /tmp/requirements-dev.generated.second.lock
          deterministic=$?
          cmp -s requirements-dev.lock /tmp/requirements-dev.generated.lock
          retained=$?
          if [[ $first -eq 0 && $second -eq 0 && $deterministic -eq 0 && $retained -eq 0 ]]; then code=0; else code=1; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cp /tmp/requirements-dev.generated.lock evidence/licensing/lic-g5/requirements-dev.generated.lock 2>/dev/null || true
          exit 0

      - name: Retain dependency graph and license evidence
        shell: bash
        run: |
          python -m pip inspect --local > evidence/licensing/lic-g5/pip-inspect.json
          pip-licenses --format=json --with-license-file --with-system > evidence/licensing/lic-g5/python-licenses.json
          pip-licenses --format=markdown --with-license-file --with-system > evidence/licensing/lic-g5/THIRD_PARTY_NOTICES.md

      - name: Validate every workflow YAML file
        id: yaml
        shell: bash
        run: |
          set +e
          python - <<'PY' > evidence/licensing/lic-g5/workflow-yaml-validation.log 2>&1
          from pathlib import Path
          import yaml
          paths=sorted(Path('.github/workflows').glob('*.y*ml'))
          for path in paths:
              with path.open(encoding='utf-8') as handle:
                  yaml.safe_load(handle)
          print(f'validated={len(paths)}')
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit the exact lock
        id: audit
        shell: bash
        run: |
          set +e
          python -m pip_audit -r requirements-dev.lock --format=json --output=evidence/licensing/lic-g5/pip-audit.json --progress-spinner off
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate retained supply-chain controls
        id: supply
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            python scripts/build_supply_chain_artifacts.py --check
            python scripts/validate_supply_chain.py
          } 2>&1 | tee evidence/licensing/lic-g5/supply-chain-validation.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run full repository regression suite
        id: pytest
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m pytest --color=yes 2>&1 | tee evidence/licensing/lic-g5/pytest.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build fail-closed LIC-G5 evidence
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOCK_EXIT: ${{ steps.lock.outputs.exit_code }}
          YAML_EXIT: ${{ steps.yaml.outputs.exit_code }}
          PYTEST_EXIT: ${{ steps.pytest.outputs.exit_code }}
        run: python scripts/lic_g5_evidence.py

      - name: Upload LIC-G5 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lic-g5-supply-chain-evidence
          path: evidence/licensing/lic-g5
          if-no-files-found: error
          retention-days: 90

      - name: Enforce LIC-G5 gate
        shell: bash
        env:
          SUPPLY_EXIT: ${{ steps.supply.outputs.exit_code }}
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
        run: |
          if [[ "$SUPPLY_EXIT" != "0" ]]; then
            echo "LIC-G5 remains OPEN: retained supply-chain controls failed"
            exit 1
          fi
          if [[ "$AUDIT_EXIT" != "0" ]]; then
            echo "LIC-G5 remains OPEN: vulnerability audit failed"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          evidence=json.loads(Path('evidence/licensing/lic-g5/lic-g5-evidence.json').read_text())
          failed=[key for key,value in evidence['checks'].items() if not value]
          if failed:
              raise SystemExit('LIC-G5 remains OPEN: '+', '.join(failed))
          print('LIC-G5 PASS')
          PY
