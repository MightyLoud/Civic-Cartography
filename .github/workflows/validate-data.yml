name: Validate civic data

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch current Olmos Park boundary
        run: |
          python scripts/fetch_tigerweb_place.py \
            --geoid 4853988 \
            --record-id TX:municipality:olmos-park:at_large:CITYWIDE \
            --geometry-id olmos-park-citywide \
            --retrieved-at 2026-08-01 \
            --raw-output build/raw/tigerweb-incorporated-place-4853988.geojson \
            --output build/geojson/olmos_park_citywide.geojson

      - name: Refresh committed boundary snapshot once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! python scripts/compare_tigerweb_snapshot.py \
            --committed-raw data/raw/olmos-park/tigerweb-incorporated-place-4853988.geojson \
            --fresh-raw build/raw/tigerweb-incorporated-place-4853988.geojson \
            --committed-canonical data/geojson/olmos_park_citywide.geojson \
            --fresh-canonical build/geojson/olmos_park_citywide.geojson; then
            cp build/raw/tigerweb-incorporated-place-4853988.geojson \
              data/raw/olmos-park/tigerweb-incorporated-place-4853988.geojson
            cp build/geojson/olmos_park_citywide.geojson \
              data/geojson/olmos_park_citywide.geojson
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/raw/olmos-park/tigerweb-incorporated-place-4853988.geojson \
              data/geojson/olmos_park_citywide.geojson
            git commit -m "Refresh Olmos Park Census boundary snapshot"
            git push
          fi

      - name: Verify committed boundary matches Census
        run: |
          python scripts/compare_tigerweb_snapshot.py \
            --committed-raw data/raw/olmos-park/tigerweb-incorporated-place-4853988.geojson \
            --fresh-raw build/raw/tigerweb-incorporated-place-4853988.geojson \
            --committed-canonical data/geojson/olmos_park_citywide.geojson \
            --fresh-canonical build/geojson/olmos_park_citywide.geojson

      - name: Run automated tests
        run: pytest -q

      - name: Validate normalized datasets
        run: python scripts/validate.py

      - name: Validate committed geometry joins
        run: python scripts/validate_geojson.py

      - name: Upload generated Census boundary
        uses: actions/upload-artifact@v4
        with:
          name: olmos-park-boundary
          path: build/
          if-no-files-found: error
