name: Validate civic data

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch current Olmos Park boundary
        run: |
          python scripts/fetch_tigerweb_place.py \
            --geoid 4853988 \
            --record-id TX:municipality:olmos-park:at_large:CITYWIDE \
            --geometry-id olmos-park-citywide \
            --retrieved-at 2026-08-01 \
            --raw-output build/olmos-park/raw/tigerweb-incorporated-place-4853988.geojson \
            --output build/olmos-park/geojson/olmos_park_citywide.geojson

      - name: Verify committed Olmos Park boundary matches Census
        run: |
          python scripts/compare_tigerweb_snapshot.py \
            --committed-raw data/raw/olmos-park/tigerweb-incorporated-place-4853988.geojson \
            --fresh-raw build/olmos-park/raw/tigerweb-incorporated-place-4853988.geojson \
            --committed-canonical data/geojson/olmos_park_citywide.geojson \
            --fresh-canonical build/olmos-park/geojson/olmos_park_citywide.geojson

      - name: Fetch current Addison boundary
        run: |
          python scripts/fetch_tigerweb_place.py \
            --geoid 4801240 \
            --record-id TX:municipality:addison:at_large:CITYWIDE \
            --geometry-id addison-citywide \
            --retrieved-at 2026-08-01 \
            --raw-output build/addison/raw/tigerweb-incorporated-place-4801240.geojson \
            --output build/addison/geojson/addison_citywide.geojson

      - name: Verify committed Addison boundary matches Census
        run: |
          python scripts/compare_tigerweb_snapshot.py \
            --committed-raw data/raw/addison/tigerweb-incorporated-place-4801240.geojson \
            --fresh-raw build/addison/raw/tigerweb-incorporated-place-4801240.geojson \
            --committed-canonical data/geojson/addison_citywide.geojson \
            --fresh-canonical build/addison/geojson/addison_citywide.geojson

      - name: Fetch Arlington council districts 3, 4, and 5
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url https://gis2.arlingtontx.gov/agsext2/rest/services/OpenData/OD_PoliticalBoundary/MapServer/0 \
            --district-ids 3,4,5 \
            --district-field DISTRICTID \
            --jurisdiction-name Arlington \
            --record-id-prefix TX:municipality:arlington:district \
            --geometry-id-prefix arlington-district \
            --source-agency "City of Arlington" \
            --retrieved-at 2026-08-01 \
            --raw-output build/arlington/raw/city-council-districts-3-4-5.geojson \
            --output build/arlington/geojson/arlington_districts_3_4_5.geojson

      - name: Commit Arlington district release files once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p data/raw/arlington data/geojson data/normalized
          cp build/arlington/raw/city-council-districts-3-4-5.geojson \
            data/raw/arlington/city-council-districts-3-4-5.geojson
          cp build/arlington/geojson/arlington_districts_3_4_5.geojson \
            data/geojson/arlington_districts_3_4_5.geojson
          cat > data/normalized/arlington_2026_districts.csv <<'CSV'
          record_id,state_fips,state_abbr,jurisdiction_type,jurisdiction_name,district_type,district_id,district_name,source_url,source_retrieved_at,source_confidence,qa_status,parity_ok,office_name,election_date,geometry_source_url,geometry_id,parent_record_id,notes
          TX:municipality:arlington:district:3,48,TX,municipality,Arlington,district,3,District 3,https://www.arlingtontx.gov/Government/City-Government/City-Council/City-Council-District-Map,2026-08-01,high,approved,TRUE,City Council District 3,2026-05-02,https://gis2.arlingtontx.gov/agsext2/rest/services/OpenData/OD_PoliticalBoundary/MapServer/0,arlington-district-3,,"Single-member district; Nikkie Hunter elected in the 2026 bounded contest."
          TX:municipality:arlington:district:4,48,TX,municipality,Arlington,district,4,District 4,https://www.arlingtontx.gov/Government/City-Government/City-Council/City-Council-District-Map,2026-08-01,high,approved,TRUE,City Council District 4,2026-05-02,https://gis2.arlingtontx.gov/agsext2/rest/services/OpenData/OD_PoliticalBoundary/MapServer/0,arlington-district-4,,"Single-member district; Tom Ware elected in the 2026 bounded contest."
          TX:municipality:arlington:district:5,48,TX,municipality,Arlington,district,5,District 5,https://www.arlingtontx.gov/Government/City-Government/City-Council/City-Council-District-Map,2026-08-01,high,approved,TRUE,City Council District 5,2026-05-02,https://gis2.arlingtontx.gov/agsext2/rest/services/OpenData/OD_PoliticalBoundary/MapServer/0,arlington-district-5,,"Single-member district; Brittney Garcia-Dumas elected in the 2026 bounded contest."
          CSV
          sed -i 's/^          //' data/normalized/arlington_2026_districts.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/arlington/city-council-districts-3-4-5.geojson \
            data/geojson/arlington_districts_3_4_5.geojson \
            data/normalized/arlington_2026_districts.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add Arlington district release files"
            git push
          fi

      - name: Run automated tests
        run: pytest -q

      - name: Validate normalized datasets
        run: python scripts/validate.py

      - name: Validate geometry joins
        run: python scripts/validate_geojson.py

      - name: Upload generated boundary checks
        uses: actions/upload-artifact@v4
        with:
          name: civic-boundary-checks
          path: build/
          if-no-files-found: error
