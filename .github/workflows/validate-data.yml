name: Validate civic data

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch current Olmos Park boundary
        run: |
          python scripts/fetch_tigerweb_place.py \
            --geoid 4853988 \
            --record-id TX:municipality:olmos-park:at_large:CITYWIDE \
            --geometry-id olmos-park-citywide \
            --retrieved-at 2026-08-01 \
            --raw-output build/olmos-park/raw/tigerweb-incorporated-place-4853988.geojson \
            --output build/olmos-park/geojson/olmos_park_citywide.geojson

      - name: Verify committed Olmos Park boundary matches Census
        run: |
          python scripts/compare_tigerweb_snapshot.py \
            --committed-raw data/raw/olmos-park/tigerweb-incorporated-place-4853988.geojson \
            --fresh-raw build/olmos-park/raw/tigerweb-incorporated-place-4853988.geojson \
            --committed-canonical data/geojson/olmos_park_citywide.geojson \
            --fresh-canonical build/olmos-park/geojson/olmos_park_citywide.geojson

      - name: Fetch current Addison boundary
        run: |
          python scripts/fetch_tigerweb_place.py \
            --geoid 4801240 \
            --record-id TX:municipality:addison:at_large:CITYWIDE \
            --geometry-id addison-citywide \
            --retrieved-at 2026-08-01 \
            --raw-output build/addison/raw/tigerweb-incorporated-place-4801240.geojson \
            --output build/addison/geojson/addison_citywide.geojson

      - name: Verify committed Addison boundary matches Census
        run: |
          python scripts/compare_tigerweb_snapshot.py \
            --committed-raw data/raw/addison/tigerweb-incorporated-place-4801240.geojson \
            --fresh-raw build/addison/raw/tigerweb-incorporated-place-4801240.geojson \
            --committed-canonical data/geojson/addison_citywide.geojson \
            --fresh-canonical build/addison/geojson/addison_citywide.geojson

      - name: Fetch Arlington council districts 3, 4, and 5
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url https://gis2.arlingtontx.gov/agsext2/rest/services/OpenData/OD_PoliticalBoundary/MapServer/0 \
            --district-ids 3,4,5 \
            --district-field DISTRICTID \
            --jurisdiction-name Arlington \
            --record-id-prefix TX:municipality:arlington:district \
            --geometry-id-prefix arlington-district \
            --source-agency "City of Arlington" \
            --retrieved-at 2026-08-01 \
            --raw-output build/arlington-3-5/raw/city-council-districts-3-4-5.geojson \
            --output build/arlington-3-5/geojson/arlington_districts_3_4_5.geojson

      - name: Verify committed Arlington districts 3, 4, and 5
        run: |
          python scripts/compare_arcgis_district_snapshot.py \
            --committed-raw data/raw/arlington/city-council-districts-3-4-5.geojson \
            --fresh-raw build/arlington-3-5/raw/city-council-districts-3-4-5.geojson \
            --committed-canonical data/geojson/arlington_districts_3_4_5.geojson \
            --fresh-canonical build/arlington-3-5/geojson/arlington_districts_3_4_5.geojson

      - name: Fetch Arlington council districts 1 and 2
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url https://gis2.arlingtontx.gov/agsext2/rest/services/OpenData/OD_PoliticalBoundary/MapServer/0 \
            --district-ids 1,2 \
            --district-field DISTRICTID \
            --jurisdiction-name Arlington \
            --record-id-prefix TX:municipality:arlington:district \
            --geometry-id-prefix arlington-district \
            --source-agency "City of Arlington" \
            --retrieved-at 2026-08-01 \
            --raw-output build/arlington-1-2/raw/city-council-districts-1-2.geojson \
            --output build/arlington-1-2/geojson/arlington_districts_1_2.geojson

      - name: Verify committed Arlington districts 1 and 2
        run: |
          python scripts/compare_arcgis_district_snapshot.py \
            --committed-raw data/raw/arlington/city-council-districts-1-2.geojson \
            --fresh-raw build/arlington-1-2/raw/city-council-districts-1-2.geojson \
            --committed-canonical data/geojson/arlington_districts_1_2.geojson \
            --fresh-canonical build/arlington-1-2/geojson/arlington_districts_1_2.geojson

      - name: Fetch current Eanes ISD unified-school-district boundary
        run: |
          python scripts/fetch_tigerweb_school_district.py \
            --name-token Eanes \
            --record-id TX:school_district:eanes-isd:at_large:DISTRICTWIDE \
            --geometry-id eanes-isd-districtwide \
            --retrieved-at 2026-08-01 \
            --raw-output build/eanes-isd/raw/tigerweb-unified-school-district-4817760.geojson \
            --output build/eanes-isd/geojson/eanes_isd_districtwide.geojson

      - name: Verify committed Eanes ISD boundary matches Census
        run: |
          python scripts/compare_tigerweb_snapshot.py \
            --committed-raw data/raw/eanes-isd/tigerweb-unified-school-district-4817760.geojson \
            --fresh-raw build/eanes-isd/raw/tigerweb-unified-school-district-4817760.geojson \
            --committed-canonical data/geojson/eanes_isd_districtwide.geojson \
            --fresh-canonical build/eanes-isd/geojson/eanes_isd_districtwide.geojson

      - name: Generate Coppell ISD release geometry
        run: |
          python scripts/fetch_tigerweb_school_district.py \
            --name-token Coppell \
            --record-id TX:school_district:coppell-isd:at_large:DISTRICTWIDE \
            --geometry-id coppell-isd-districtwide \
            --retrieved-at 2026-08-01 \
            --raw-output data/raw/coppell-isd/tigerweb-unified-school-district-4815210.geojson \
            --output data/geojson/coppell_isd_districtwide.geojson

      - name: Commit Coppell ISD release files once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p data/normalized
          cat > data/normalized/coppell_isd_2026.csv <<'CSV'
          record_id,state_fips,state_abbr,jurisdiction_type,jurisdiction_name,district_type,district_id,district_name,source_url,source_retrieved_at,source_confidence,qa_status,parity_ok,office_name,election_date,geometry_source_url,geometry_id,parent_record_id,notes
          TX:school_district:coppell-isd:at_large:DISTRICTWIDE,48,TX,school_district,Coppell Independent School District,at_large,DISTRICTWIDE,Districtwide,https://www.coppellisd.com/page/elections,2026-08-01,high,approved,TRUE,Board of Trustees Places 4-5,2026-05-02,https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Current/MapServer/14,coppell-isd-districtwide,,"Trustees run for Places 4 and 5 but represent the whole district at large. Four filing events are preserved; three reached the final ballot; Carly Waters withdrew. Census GEOID 4815210."
          CSV
          sed -i 's/^          //' data/normalized/coppell_isd_2026.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/coppell-isd/tigerweb-unified-school-district-4815210.geojson \
            data/geojson/coppell_isd_districtwide.geojson \
            data/normalized/coppell_isd_2026.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add Coppell ISD release files"
            git push
          fi

      - name: Run automated tests
        run: pytest -q

      - name: Validate normalized datasets
        run: python scripts/validate.py

      - name: Validate geometry joins
        run: python scripts/validate_geojson.py

      - name: Upload generated boundary checks
        uses: actions/upload-artifact@v4
        with:
          name: civic-boundary-checks
          path: build/
          if-no-files-found: error
