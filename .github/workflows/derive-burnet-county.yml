name: Derive Burnet County release geometry

on:
  pull_request:
    paths:
      - ".github/workflows/derive-burnet-county.yml"
      - "scripts/fetch_burnet_commissioner_precincts.py"
      - "scripts/fetch_burnet_district_attorney_service_area.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive-burnet-county:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry dependencies
        run: python -m pip install shapely
      - name: Fetch Commissioner precincts
        run: |
          python scripts/fetch_burnet_commissioner_precincts.py \
            --retrieved-at 2026-08-03 \
            --raw-output build/burnet-county/raw/commissioner-precincts-1-4.geojson \
            --output build/burnet-county/geojson/burnet_county_commissioner_precincts.geojson \
            --contract-output build/burnet-county/gis-source-contract.json
      - name: Fetch Burnet County boundary
        run: |
          python scripts/fetch_tigerweb_county.py \
            --geoid 48053 \
            --record-id TX:county:burnet:countywide:COUNTYWIDE \
            --geometry-id burnet-county-countywide \
            --retrieved-at 2026-08-03 \
            --raw-output build/burnet-county/raw/tigerweb-county-48053.geojson \
            --output build/burnet-county/geojson/burnet_county_countywide.geojson
      - name: Build District Attorney service area
        run: |
          python scripts/fetch_burnet_district_attorney_service_area.py \
            --retrieved-at 2026-08-03 \
            --raw-output build/burnet-county/raw/district-attorney-component-counties.geojson \
            --output build/burnet-county/geojson/burnet_33rd_424th_district_attorney_service_area.geojson \
            --contract-output build/burnet-county/district-attorney-service-area-contract.json
      - uses: actions/upload-artifact@v4
        with:
          name: burnet-county-derived-geometry
          path: build/burnet-county/
          if-no-files-found: error
