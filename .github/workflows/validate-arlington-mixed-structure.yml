name: Validate Arlington mixed structure

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-arlington-mixed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Fetch current Arlington city boundary
        run: |
          python scripts/fetch_tigerweb_place.py \
            --geoid 4804000 \
            --record-id TX:municipality:arlington:at_large:CITYWIDE \
            --geometry-id arlington-citywide \
            --retrieved-at 2026-08-01 \
            --raw-output build/arlington-citywide/raw/tigerweb-incorporated-place-4804000.geojson \
            --output build/arlington-citywide/geojson/arlington_citywide.geojson

      - name: Verify committed Arlington citywide boundary matches Census
        run: |
          python scripts/compare_tigerweb_snapshot.py \
            --committed-raw data/raw/arlington/tigerweb-incorporated-place-4804000.geojson \
            --fresh-raw build/arlington-citywide/raw/tigerweb-incorporated-place-4804000.geojson \
            --committed-canonical data/geojson/arlington_citywide.geojson \
            --fresh-canonical build/arlington-citywide/geojson/arlington_citywide.geojson

      - name: Run automated tests
        run: pytest -q

      - name: Validate normalized datasets
        run: python scripts/validate.py

      - name: Validate geometry joins
        run: python scripts/validate_geojson.py

      - name: Create deterministic Arlington release digest
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          paths = sorted(
              [
                  Path("data/geojson/arlington_districts_1_2.geojson"),
                  Path("data/geojson/arlington_districts_3_4_5.geojson"),
                  Path("data/geojson/arlington_citywide.geojson"),
              ],
              key=lambda path: path.name,
          )
          digest = sha256()
          for path in paths:
              digest.update(path.name.encode("utf-8"))
              digest.update(b"\0")
              digest.update(path.read_bytes())
              digest.update(b"\0")
          output = Path("build/arlington-citywide/arlington_release_sha256.txt")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(digest.hexdigest() + "\n", encoding="utf-8")
          print(digest.hexdigest())
          PY

      - name: Upload Arlington mixed-structure boundary check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arlington-mixed-structure-boundary-check
          path: build/arlington-citywide/
          if-no-files-found: error
