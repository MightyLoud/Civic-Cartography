name: Validate Arlington mixed structure

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate-arlington-mixed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Generate Arlington citywide release geometry
        run: |
          python scripts/fetch_tigerweb_place.py \
            --geoid 4804000 \
            --record-id TX:municipality:arlington:at_large:CITYWIDE \
            --geometry-id arlington-citywide \
            --retrieved-at 2026-08-01 \
            --raw-output data/raw/arlington/tigerweb-incorporated-place-4804000.geojson \
            --output data/geojson/arlington_citywide.geojson

      - name: Create Arlington citywide normalized record
        run: |
          mkdir -p data/normalized
          cat > data/normalized/arlington_citywide.csv <<'CSV'
          record_id,state_fips,state_abbr,jurisdiction_type,jurisdiction_name,district_type,district_id,district_name,source_url,source_retrieved_at,source_confidence,qa_status,parity_ok,office_name,election_date,geometry_source_url,geometry_id,parent_record_id,notes
          TX:municipality:arlington:at_large:CITYWIDE,48,TX,municipality,Arlington,at_large,CITYWIDE,Citywide,https://www.arlingtontx.gov/Government/City-Government/City-Council/City-Council-District-Map,2026-08-01,high,approved,TRUE,Mayor + Council At-Large Districts 6-8,,https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Current/MapServer/28,arlington-citywide,,"Mixed representation structure: Mayor Jim Ross and At-Large Council Members Long Pham (District 6), Bowie Hogg (District 7), and Jason Shelton (District 8) represent the entire city. Existing Single-Member Districts 1-5 remain separate geometries. Census GEOID 4804000."
          CSV
          sed -i 's/^          //' data/normalized/arlington_citywide.csv

      - name: Run automated tests
        run: pytest -q

      - name: Validate normalized datasets
        run: python scripts/validate.py

      - name: Validate geometry joins
        run: python scripts/validate_geojson.py

      - name: Commit Arlington mixed-structure release files once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/arlington/tigerweb-incorporated-place-4804000.geojson \
            data/geojson/arlington_citywide.geojson \
            data/normalized/arlington_citywide.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add Arlington mixed-structure release files"
            git push
          fi

      - name: Upload Arlington mixed-structure release check
        uses: actions/upload-artifact@v4
        with:
          name: arlington-mixed-structure-boundary-check
          path: |
            data/raw/arlington/tigerweb-incorporated-place-4804000.geojson
            data/geojson/arlington_citywide.geojson
            data/normalized/arlington_citywide.csv
          if-no-files-found: error
