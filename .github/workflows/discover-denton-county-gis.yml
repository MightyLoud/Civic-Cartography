name: Discover Denton County commissioner GIS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  discover-denton-gis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Search ArcGIS public catalog
        run: |
          mkdir -p build/denton-county
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          queries = [
              '"Denton County" "Commissioner Precincts"',
              '"Denton County" "Commissioner Precinct"',
              'owner:DentonCountyGIS commissioner',
              'owner:DentonCounty commissioner',
          ]
          collected = {}
          for query in queries:
              params = urllib.parse.urlencode({
                  'f': 'json',
                  'num': 100,
                  'q': query,
                  'sortField': 'modified',
                  'sortOrder': 'desc',
              })
              url = f'https://www.arcgis.com/sharing/rest/search?{params}'
              with urllib.request.urlopen(url, timeout=60) as response:
                  payload = json.load(response)
              for item in payload.get('results', []):
                  haystack = ' '.join(str(item.get(key, '')) for key in ('title', 'owner', 'description', 'snippet', 'tags', 'url')).lower()
                  if 'denton' not in haystack or 'commission' not in haystack:
                      continue
                  collected[item['id']] = {
                      key: item.get(key)
                      for key in ('id', 'title', 'owner', 'type', 'url', 'modified', 'description', 'snippet', 'tags', 'access')
                  }

          results = sorted(collected.values(), key=lambda item: (item.get('owner') or '', item.get('title') or ''))
          output = {'count': len(results), 'results': results}
          print(json.dumps(output, indent=2))
          with open('build/denton-county/arcgis-search-results.json', 'w', encoding='utf-8') as handle:
              json.dump(output, handle, indent=2)
              handle.write('\n')
          if not results:
              raise SystemExit('No Denton County commissioner ArcGIS candidates found')
          PY

      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: denton-county-gis-discovery
          path: build/denton-county/arcgis-search-results.json
          if-no-files-found: error
