name: Derive Schleicher County release geometry

on:
  pull_request:
    paths:
      - ".github/workflows/derive-schleicher-county.yml"
      - "scripts/derive_schleicher_commissioner_precincts.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derive-schleicher-county:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/schleicher-county-combined-clerk
          fetch-depth: 0
      - name: Normalize Shapely collection inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path("scripts/derive_schleicher_commissioner_precincts.py")
          text=path.read_text(encoding="utf-8")
          text=text.replace(
              'geometry = unary_union(\n            part\n            for part in geometry.geoms\n            if part.geom_type in {"Polygon", "MultiPolygon"}\n        )',
              'geometry = unary_union([\n            part\n            for part in geometry.geoms\n            if part.geom_type in {"Polygon", "MultiPolygon"}\n        ])',
          )
          text=text.replace(
              'unary_union(row["g3857"] for row in rows)',
              'unary_union([row["g3857"] for row in rows])',
          )
          text=text.replace(
              'unary_union(row["g4326"] for row in rows)',
              'unary_union([row["g4326"] for row in rows])',
          )
          path.write_text(text,encoding="utf-8")
          PY
          if ! git diff --quiet -- scripts/derive_schleicher_commissioner_precincts.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/derive_schleicher_commissioner_precincts.py
            git commit -m "Normalize Schleicher Shapely collection inputs"
            git push origin HEAD:agent/schleicher-county-combined-clerk
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry dependencies
        run: python -m pip install pymupdf pyshp pyproj shapely pillow
      - name: Derive Commissioner precincts
        run: |
          python scripts/derive_schleicher_commissioner_precincts.py \
            --retrieved-at 2026-08-03 \
            --work-dir build/schleicher-county/work \
            --raw-output build/schleicher-county/raw/commissioner-precincts-1-4.geojson \
            --output build/schleicher-county/geojson/schleicher_county_commissioner_precincts.geojson \
            --contract-output build/schleicher-county/gis-source-contract.json \
            --evidence-output build/schleicher-county/derivation-evidence.json
      - name: Fetch current county boundary
        run: |
          python scripts/fetch_tigerweb_county.py \
            --geoid 48413 \
            --record-id TX:county:schleicher:countywide:COUNTYWIDE \
            --geometry-id schleicher-county-countywide \
            --retrieved-at 2026-08-03 \
            --raw-output build/schleicher-county/raw/tigerweb-county-48413.geojson \
            --output build/schleicher-county/geojson/schleicher_county_countywide.geojson
      - uses: actions/upload-artifact@v4
        with:
          name: schleicher-county-derived-geometry
          path: build/schleicher-county/
          if-no-files-found: error
