name: Validate ORCH-FAC-002 Factory Orchestration

on:
  pull_request:
    paths:
      - 'schemas/orch-fac-002-orchestration.schema.json'
      - 'schemas/orch-fac-002-report.schema.json'
      - 'schemas/orch-fac-worker-dispatch.schema.json'
      - 'schemas/orch-fac-001-report.schema.json'
      - 'tests/fixtures/orch_fac_002_orchestration.json'
      - 'scripts/validate_orch_fac_001.py'
      - 'scripts/validate_orch_fac_002.py'
      - '.github/workflows/validate-orch-fac-002.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Validate ORCH-FAC-001 prerequisite
        run: python scripts/validate_orch_fac_001.py
      - name: Validate evidence-derived end-to-end orchestration
        run: python scripts/validate_orch_fac_002.py
