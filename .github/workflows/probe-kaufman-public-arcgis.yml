name: Probe public Kaufman County ArcGIS copies

on:
  pull_request:
    paths:
      - ".github/workflows/probe-kaufman-public-arcgis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-public-arcgis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search ArcGIS Online and inspect exact four-district polygons
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request
          from pathlib import Path

          ROOT = 'https://www.arcgis.com/sharing/rest'
          OUT = Path('build/kaufman-public-arcgis')
          OUT.mkdir(parents=True, exist_ok=True)
          SEED = ['c13f9cf1c9544c90b0e91b5bd8138c59']

          def get(url, timeout=45):
              req = urllib.request.Request(url, headers={'User-Agent':'Civic-Cartography/1.0'})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  value = json.load(response)
              return value if isinstance(value, dict) else {}

          queries = [
              '"Kaufman County"',
              '"Kaufman County" AND (commissioner OR precinct)',
              'Kaufman AND type:"Feature Service"',
              'Kaufman AND type:"Feature Collection"',
          ]
          results = {}
          item_ids = set(SEED)
          for query in queries:
              params = urllib.parse.urlencode({'f':'json','q':query,'num':100})
              try:
                  payload = get(f'{ROOT}/search?{params}')
              except Exception as exc:
                  results[query] = {'error':repr(exc)}
                  continue
              results[query] = payload
              for item in payload.get('results',[]):
                  item_ids.add(str(item.get('id') or ''))

          inspections=[]; candidates=[]
          for item_id in sorted(x for x in item_ids if re.fullmatch(r'[0-9a-fA-F]{32}',x)):
              try:
                  meta=get(f'{ROOT}/content/items/{item_id}?f=json')
                  data=get(f'{ROOT}/content/items/{item_id}/data?f=json')
              except Exception as exc:
                  inspections.append({'item_id':item_id,'error':repr(exc)}); continue
              record={'item_id':item_id,'metadata':meta,'data':data}
              inspections.append(record)
              urls=set()
              item_url=str(meta.get('url') or '').rstrip('/')
              if re.search(r'/(?:FeatureServer|MapServer)(?:/\d+)?$',item_url,re.I): urls.add(item_url)
              text=json.dumps(data)
              urls.update(re.findall(r'https?://[^"\s]+?/(?:FeatureServer|MapServer)(?:/\d+)?',text,re.I))
              for raw in sorted(urls):
                  root=re.sub(r'/\d+$','',raw.rstrip('/.,;)'))
                  try: service=get(f'{root}?f=json')
                  except Exception: continue
                  layer_ids=[]
                  explicit=re.search(r'/(\d+)$',raw)
                  if explicit: layer_ids=[int(explicit.group(1))]
                  else: layer_ids=[int(x['id']) for x in service.get('layers',[]) if 'id' in x]
                  for layer_id in layer_ids:
                      url=f'{root}/{layer_id}'
                      try:
                          layer=get(f'{url}?f=json')
                          if layer.get('geometryType')!='esriGeometryPolygon': continue
                          q=urllib.parse.urlencode({'where':'1=1','outFields':'*','returnGeometry':'false','f':'json'})
                          rows=[f.get('attributes',{}) for f in get(f'{url}/query?{q}').get('features',[])]
                      except Exception: continue
                      for field in layer.get('fields',[]):
                          name=str(field.get('name') or '')
                          if field.get('type')=='esriFieldTypeOID' or name.casefold() in {'objectid','fid','oid'}: continue
                          vals=[str(int(v) if isinstance(v,float) and v.is_integer() else v).strip() for v in (r.get(name) for r in rows) if v not in (None,'')]
                          if len(vals)==4 and set(vals)=={'1','2','3','4'}:
                              hay=f"{meta.get('title','')} {meta.get('tags',[])} {layer.get('name','')} {name} {url}".casefold()
                              score=sum(p for m,p in (('kaufman',100),('commissioner',100),('precinct',70),('commission',60),('district',20),('2021',10)) if m in hay)
                              candidates.append({'score':score,'item_id':item_id,'item_title':meta.get('title'),'item_owner':meta.get('owner'),'item_modified':meta.get('modified'),'layer_url':url,'layer_name':layer.get('name'),'district_field':name,'layer_fields':[x.get('name') for x in layer.get('fields',[])],'source_rows':rows})

              # Feature collections can contain inline polygon features.
              for layer_entry in data.get('layers',[]) if isinstance(data.get('layers'),list) else []:
                  feature_set=layer_entry.get('featureSet') or {}
                  features=feature_set.get('features') or []
                  if len(features)!=4: continue
                  attrs=[f.get('attributes',{}) for f in features]
                  names=set().union(*(a.keys() for a in attrs)) if attrs else set()
                  for name in names:
                      vals=[str(int(v) if isinstance(v,float) and v.is_integer() else v).strip() for v in (a.get(name) for a in attrs) if v not in (None,'')]
                      if len(vals)==4 and set(vals)=={'1','2','3','4'}:
                          candidates.append({'score':150,'item_id':item_id,'item_title':meta.get('title'),'item_owner':meta.get('owner'),'item_modified':meta.get('modified'),'inline_feature_collection':True,'district_field':name,'source_rows':attrs,'features':features})

          output={'search_results':results,'inspections':inspections,'candidates':sorted(candidates,key=lambda x:(-x['score'],x.get('item_id',''),x.get('layer_url','')))}
          (OUT/'public-arcgis-evidence.json').write_text(json.dumps(output,indent=2,sort_keys=True)+'\n')
          print(json.dumps(output['candidates'][:20],indent=2,sort_keys=True))
          if not candidates: raise SystemExit('No public Kaufman four-district polygon candidate found')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaufman-public-arcgis
          path: build/kaufman-public-arcgis/
          if-no-files-found: error
