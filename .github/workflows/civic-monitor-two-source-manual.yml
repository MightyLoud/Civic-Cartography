name: Civic Monitoring | Two-Source Manual HTTPS Preflight

# Review-only draft: manual dispatch is the sole trigger.
on:
  workflow_dispatch:
    inputs:
      acknowledge_readonly:
        description: 'One-time read-only HTTPS connectivity check for two public county sites'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: civic-monitor-two-source-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ inputs.acknowledge_readonly == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check two pinned public official HTTPS endpoints
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import ssl
          import sys
          import urllib.error
          import urllib.request
          from urllib.parse import urlsplit

          SOURCES = {
              "SRCMON-006": "https://cuyahogacounty.gov/code/roster-of-officials",
              "SRCMON-007": "https://www.cookcountyil.gov/all-people",
          }
          MAX_BYTES = 4 * 1024 * 1024

          class PinnedRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  old = urlsplit(req.full_url)
                  new = urlsplit(newurl)
                  if new.scheme != "https" or new.hostname != old.hostname or new.username or new.password:
                      raise urllib.error.HTTPError(req.full_url, code, "redirect blocked", headers, fp)
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          opener = urllib.request.build_opener(PinnedRedirect)
          failed = False
          for monitor, url in SOURCES.items():
              try:
                  request = urllib.request.Request(url, headers={
                      "User-Agent": "CivicDataTechReadOnlyMonitoringPreflight/0.5",
                      "Accept": "text/html",
                  })
                  with opener.open(request, timeout=20) as response:
                      if response.status != 200:
                          raise ValueError("non-200 response")
                      if urlsplit(response.geturl()).hostname != urlsplit(url).hostname:
                          raise ValueError("unexpected redirect")
                      content_type = response.headers.get("Content-Type", "").lower()
                      if "text/html" not in content_type:
                          raise ValueError("not HTML")
                      data = response.read(MAX_BYTES + 1)
                      if not data or len(data) > MAX_BYTES:
                          raise ValueError("empty/oversized document")
                      print(f"{monitor}: HTTP_OK (HTML received, bounded; no content logged)")
              except Exception as exc:
                  failed = True
                  print(f"{monitor}: BLOCKED ({type(exc).__name__}); GATE-CM-006 remains WAIT")
          if failed:
              sys.exit(2)
          print("Connectivity preflight only: NOT a verified roster parse, source comparison, scan, or operational certification.")
          PY
