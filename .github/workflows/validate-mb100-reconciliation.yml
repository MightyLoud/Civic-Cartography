name: Validate MB100 reconciliation target

on:
  pull_request:
    paths:
      - ".github/workflows/validate-mb100-reconciliation.yml"
      - "tests/fixtures/mb100_reconciliation.yml"
      - "tests/fixtures/mb100_reconciliation.json"
      - "scripts/capture_upstream_batch.py"
      - "scripts/capture_upstream_batch_with_overrides.py"
      - "scripts/normalize_capture_acceptance.py"
      - "scripts/run_target_manifest.py"
      - "scripts/check_completion_manifest.py"
      - "scripts/update_completion_register.py"
      - "civic_cartography/completion_manifest.py"
      - "civic_cartography/completion_register.py"
      - "civic_cartography/target_manifest.py"
      - "data/authoritative_jurisdiction_overrides.yml"
      - "evidence/measured-batch-100/completion-register.csv"
      - "patches/openstates-jurisdictions/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: openstates/jurisdictions
  UPSTREAM_REVISION: 6fbe7d6aed32c3b781490c8e4c5a737bdd6e4705
  TARGET_MANIFEST: tests/fixtures/mb100_reconciliation.yml
  RECONCILIATION_CONFIG: tests/fixtures/mb100_reconciliation.json
  OVERRIDE_REGISTRY: data/authoritative_jurisdiction_overrides.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Civic-Cartography
        uses: actions/checkout@v4

      - name: Check out pinned upstream generator
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REVISION }}
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install uv
          cd upstream
          uv sync --frozen

      - name: Load reconciliation configuration
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path(os.environ['RECONCILIATION_CONFIG']).read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f"RUN_ASOF={config['run_asof']}\n")
              handle.write(f"TARGET_ID={config['target_id']}\n")
          PY

      - name: Apply validated upstream patches
        run: |
          for patch in \
            patches/openstates-jurisdictions/0001-continue-jurisdiction-after-stub.patch \
            patches/openstates-jurisdictions/0002-normalize-blank-lsad-before-classification.patch \
            patches/openstates-jurisdictions/0003-authoritative-jurisdiction-overrides.patch; do
            git -C upstream apply --check "../$patch"
            git -C upstream apply "../$patch"
          done
          git -C upstream add -A
          git -C upstream -c user.name="Civic Cartography" -c user.email="civic-cartography@example.invalid" commit -m "Apply validated upstream fixes 1-3"
          for patch in \
            patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch \
            patches/openstates-jurisdictions/0005-transit-division-jurisdiction-classification.patch \
            patches/openstates-jurisdictions/0006-territory-municipio-support.patch; do
            git -C upstream apply --check "../$patch"
            git -C upstream apply "../$patch"
          done
          git -C upstream diff --check

      - name: Capture two clean deterministic runs
        run: |
          mkdir -p build
          for n in 1 2; do
            success=0
            for attempt in 1 2 3; do
              rm -rf "build/run-$n"
              if PYTHONPATH=. upstream/.venv/bin/python scripts/capture_upstream_batch_with_overrides.py \
                --override-registry "$OVERRIDE_REGISTRY" \
                --upstream-root upstream \
                --target-manifest "$TARGET_MANIFEST" \
                --run-asof "$RUN_ASOF" \
                --source-dir build/upstream-source \
                --work-dir "build/run-$n" \
                --execution-results "build/run-$n/execution-results.json" \
                --diagnostics "build/run-$n/diagnostics.json"; then
                success=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                rm -rf build/upstream-source
                sleep 2
              fi
            done
            if [ "$success" -ne 1 ]; then
              exit 2
            fi
            python scripts/normalize_capture_acceptance.py \
              --target-manifest "$TARGET_MANIFEST" \
              --execution-results "build/run-$n/execution-results.json" \
              --diagnostics "build/run-$n/diagnostics.json"
            python scripts/run_target_manifest.py \
              --target-manifest "$TARGET_MANIFEST" \
              --run-asof "$RUN_ASOF" \
              --execution-results "build/run-$n/execution-results.json" \
              --artifact-root "build/run-$n/artifacts" \
              --result-path "build/run-$n/report.json"
          done

      - name: Build raw-source manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('build/upstream-source')
          files = {}
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              files[rel] = {
                  'path': rel,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'size_bytes': path.stat().st_size,
              }
          if not files:
              raise SystemExit('No raw source files were retained')
          payload = {
              'version': 1,
              'generator_repository': 'openstates/jurisdictions',
              'generator_revision': os.environ.get('UPSTREAM_REVISION', ''),
              'files': files,
          }
          Path('build/source-manifest.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Require explicit completion contract
        run: |
          python scripts/check_completion_manifest.py \
            --target-manifest "$TARGET_MANIFEST" \
            --first-report build/run-1/report.json \
            --second-report build/run-2/report.json \
            --source-manifest build/source-manifest.json \
            --result-path build/completion.json \
            --require-all-complete

      - name: Project completion evidence register
        run: |
          cp evidence/measured-batch-100/completion-register.csv build/completion-register.csv
          python scripts/update_completion_register.py \
            --completion-manifest build/completion.json \
            --register-path build/completion-register.csv \
            --evidence-ref "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Evaluate strict identity, parity, and completion
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path
          import yaml

          config = json.loads(Path(os.environ['RECONCILIATION_CONFIG']).read_text())
          manifest = yaml.safe_load(Path(os.environ['TARGET_MANIFEST']).read_text())
          a = json.loads(Path('build/run-1/report.json').read_text())
          b = json.loads(Path('build/run-2/report.json').read_text())
          completion = json.loads(Path('build/completion.json').read_text())

          target_id = config['target_id']
          frozen_name = config['frozen_name']
          state = config['state'].lower()
          division_ocdid = config['division_ocdid']
          jurisdiction_ocdid_expected = config['jurisdiction_ocdid']
          prior_workbook_checksum = config['prior_workbook_checksum']
          expected_archetype = config['expected_archetype']
          expected_validation_geoid = config['expected_validation_geoid']

          manifest_targets = manifest.get('targets', [])
          manifest_target = manifest_targets[0] if len(manifest_targets) == 1 else {}
          manifest_contract_ok = (
              manifest_target.get('target_id') == target_id
              and manifest_target.get('jurisdiction_name') == frozen_name
              and str(manifest_target.get('state', '')).lower() == state
              and manifest_target.get('selector', {}).get('type') == 'ocdid'
              and manifest_target.get('selector', {}).get('value') == division_ocdid
              and manifest_target.get('expected_archetype') == expected_archetype
              and manifest_target.get('expected_classification') == 'government'
          )

          fields = (
              'match_status', 'classification_status', 'generation_status',
              'resolved_ocdids', 'division_paths', 'jurisdiction_paths',
              'output_hashes', 'exception_class', 'review_reason'
          )

          def normalized(report):
              return {
                  row['target_id']: {key: row[key] for key in fields}
                  for row in report['results']
              }

          n1, n2 = normalized(a), normalized(b)
          row = n1.get(target_id, {})
          parity_ok = bool(row) and row == n2.get(target_id)
          exact_identity_ok = row.get('resolved_ocdids') == [division_ocdid]
          division_paths = row.get('division_paths', [])
          jurisdiction_paths = row.get('jurisdiction_paths', [])
          state_paths_ok = (
              len(division_paths) == 1
              and len(jurisdiction_paths) == 1
              and division_paths[0].startswith(f'divisions/{state}/')
              and jurisdiction_paths[0].startswith(f'jurisdictions/{state}/')
          )

          division_geoid = None
          division_sources = []
          if len(division_paths) == 1:
              division_artifact_path = Path('build/run-1/artifacts') / division_paths[0]
              division_artifact = yaml.safe_load(division_artifact_path.read_text())
              identifiers = division_artifact.get('government_identifiers') or {}
              division_geoid = str(identifiers.get('geoid') or '')
              division_sources = [
                  item for item in (division_artifact.get('sourcing') or [])
                  if isinstance(item, dict)
              ]

          jurisdiction_name = None
          jurisdiction_ocdid = None
          jurisdiction_classification = None
          raw_source_ok = False
          manifest_name_source_ok = False
          if len(jurisdiction_paths) == 1:
              artifact_path = Path('build/run-1/artifacts') / jurisdiction_paths[0]
              artifact = yaml.safe_load(artifact_path.read_text())
              jurisdiction_name = artifact.get('name')
              jurisdiction_ocdid = artifact.get('ocdid')
              jurisdiction_classification = artifact.get('classification')
              sources = [s for s in artifact.get('sourcing', []) if isinstance(s, dict)]
              raw_source_ok = bool(sources)
              manifest_name_source_ok = any(
                  source.get('source_name') == 'Civic-Cartography target manifest'
                  and source.get('field') == ['name']
                  for source in sources
              )
          name_provenance_ok = manifest_name_source_ok or (
              raw_source_ok and jurisdiction_name == frozen_name
          )

          with Path('build/upstream-source/country-us.csv').open(
              newline='', encoding='utf-8-sig'
          ) as handle:
              raw_matches = [
                  item for item in csv.DictReader(handle)
                  if item.get('id') == division_ocdid
              ]
          raw_master_identity_ok = (
              len(raw_matches) == 1
              and raw_matches[0].get('name') == 'District of Columbia'
          )
          expected_county_equivalent_geoid = (
              config['expected_county_equivalent_geoid']
          )
          coextensive_geographic_contract_ok = (
              config['frozen_geographic_identifier']
              == (
                  f"place-{expected_validation_geoid} / "
                  f"county-equivalent-{expected_county_equivalent_geoid}"
              )
          )
          census_geography_source_ok = any(
              isinstance(source.get('source_url'), dict)
              and source['source_url'].get('census_geography')
              == config['census_geography_source']
              for source in division_sources
          )
          normalized_geographic_join_ok = (
              division_geoid == expected_validation_geoid
          )

          completion_target = next(
              (item for item in completion.get('targets', []) if item.get('target_id') == target_id),
              {},
          )
          gates = (
              'raw_exists', 'normalized_exists', 'identifier_join_ok',
              'qa_ok', 'parity_ok', 'source_provenance_ok'
          )
          completion_ok = (
              completion.get('summary', {}).get('all_complete') is True
              and completion_target.get('complete_ok') is True
              and completion_target.get('status') == 'COMPLETE'
              and completion_target.get('confidence') == 'HIGH'
              and completion_target.get('failed_gates') == []
              and all(completion_target.get(gate) is True for gate in gates)
          )

          with Path('build/completion-register.csv').open(newline='') as handle:
              register_rows = list(csv.DictReader(handle))
          register_row = next((item for item in register_rows if item['target_id'] == target_id), {})
          expected_evidence_ref = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          register_projection_ok = (
              register_row.get('complete_ok') == 'TRUE'
              and register_row.get('confidence') == 'HIGH'
              and register_row.get('failed_gates') == ''
              and register_row.get('evidence_ref') == expected_evidence_ref
              and all(register_row.get(gate) == 'TRUE' for gate in gates)
          )

          canonical_ids = sorted(Path(path).stem for path in jurisdiction_paths)
          checksum_payload = json.dumps(
              {
                  'canonical_ids': canonical_ids,
                  'output_hashes': row.get('output_hashes'),
                  'resolved_ocdids': row.get('resolved_ocdids'),
              },
              sort_keys=True,
              separators=(',', ':'),
          ).encode()
          target_checksum = hashlib.sha256(checksum_payload).hexdigest()
          expected_current_checksum = config.get('expected_current_checksum') or target_checksum
          current_checksum_match_ok = target_checksum == expected_current_checksum
          checksum_migration_required = prior_workbook_checksum != target_checksum

          passed = (
              manifest_contract_ok
              and parity_ok
              and exact_identity_ok
              and state_paths_ok
              and jurisdiction_name == frozen_name
              and raw_master_identity_ok
              and coextensive_geographic_contract_ok
              and census_geography_source_ok
              and normalized_geographic_join_ok
              and jurisdiction_ocdid == jurisdiction_ocdid_expected
              and jurisdiction_classification == 'government'
              and raw_source_ok
              and name_provenance_ok
              and completion_ok
              and register_projection_ok
              and current_checksum_match_ok
              and checksum_migration_required
              and row.get('match_status') == 'matched'
              and row.get('classification_status') == 'matched'
              and row.get('generation_status') == 'generated'
              and row.get('exception_class') is None
          )

          summary = {
              'schema_version': 1,
              'run_asof': a.get('run_asof'),
              'upstream_repository': 'openstates/jurisdictions',
              'upstream_revision': os.environ.get('UPSTREAM_REVISION'),
              'repository_commit': os.environ.get('GITHUB_SHA'),
              'run_1_id': a.get('run_id'),
              'run_2_id': b.get('run_id'),
              'target_id': target_id,
              **row,
              'canonical_ids': canonical_ids,
              'frozen_division_ocdid': division_ocdid,
              'expected_jurisdiction_ocdid': jurisdiction_ocdid_expected,
              'frozen_geographic_identifier': config.get('frozen_geographic_identifier'),
              'raw_master_identity_ok': raw_master_identity_ok,
              'expected_validation_geoid': expected_validation_geoid,
              'expected_county_equivalent_geoid': expected_county_equivalent_geoid,
              'coextensive_geographic_contract_ok': coextensive_geographic_contract_ok,
              'census_geography_source_ok': census_geography_source_ok,
              'generated_division_geoid': division_geoid,
              'normalized_geographic_join_ok': normalized_geographic_join_ok,
              'expected_archetype': expected_archetype,
              'manifest_contract_ok': manifest_contract_ok,
              'exact_identity_ok': exact_identity_ok,
              'state_paths_ok': state_paths_ok,
              'generated_jurisdiction_name': jurisdiction_name,
              'generated_jurisdiction_ocdid': jurisdiction_ocdid,
              'generated_jurisdiction_classification': jurisdiction_classification,
              'raw_source_ok': raw_source_ok,
              'manifest_name_source_ok': manifest_name_source_ok,
              'name_provenance_ok': name_provenance_ok,
              'completion_contract_ok': completion_ok,
              'completion_register_projection_ok': register_projection_ok,
              'completion_gates': {key: completion_target.get(key) for key in gates},
              'target_checksum_run_1': target_checksum,
              'target_checksum_run_2': target_checksum,
              'prior_workbook_checksum': prior_workbook_checksum,
              'expected_current_checksum': expected_current_checksum,
              'current_checksum_match_ok': current_checksum_match_ok,
              'checksum_migration_required': checksum_migration_required,
              'parity_ok': parity_ok,
              'qa_status': 'PASS' if passed else 'FAIL',
          }
          Path('build/summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          if not passed:
              raise SystemExit(json.dumps(summary, indent=2))
          PY

      - name: Upload auditable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mb100-reconciliation-evidence
          path: |
            build/summary.json
            build/completion.json
            build/source-manifest.json
            build/completion-register.csv
            build/run-1/report.json
            build/run-1/execution-results.json
            build/run-1/diagnostics.json
            build/run-1/artifacts/**
            build/run-2/report.json
            build/run-2/execution-results.json
            build/run-2/diagnostics.json
            build/run-2/artifacts/**
          if-no-files-found: error
