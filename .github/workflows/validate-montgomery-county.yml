name: Validate Montgomery County complete schema

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-montgomery-county:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Validate freshness, application chain, and live roster contracts
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from collections import deque

          PORTAL = 'https://www.arcgis.com'
          APP_ITEM = '06f7b0e0e2354c8f8e77be19c4256ff5'
          WEB_MAP = '8d0ca3edd9bb46f9aea60c99faa54e83'
          DATA_ITEM = 'ea4f547b5eec474b8eb6d022afe173b3'
          LAYER = 'https://services1.arcgis.com/PRoAPGnMSUqvTrzq/arcgis/rest/services/CountyDistrict_Commissioner/FeatureServer/0'
          EXPECTED = {
              'C1': 'Robert Walker',
              'C2': 'Charlie Riley',
              'C3': 'Ritch Wheeler',
              'C4': 'Matt Gray',
          }

          def fetch_json(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'Civic-Cartography-validator/1.0'})
              last_error = None
              for attempt in range(1, 6):
                  try:
                      with urllib.request.urlopen(request, timeout=45) as response:
                          return json.load(response)
                  except Exception as exc:
                      last_error = exc
                      if attempt == 5:
                          raise
                      time.sleep(attempt * 5)
              raise last_error

          def item_metadata(item_id):
              return fetch_json(f'{PORTAL}/sharing/rest/content/items/{item_id}?f=json')

          def item_data(item_id):
              return fetch_json(f'{PORTAL}/sharing/rest/content/items/{item_id}/data?f=json')

          app = item_metadata(APP_ITEM)
          web_map = item_metadata(WEB_MAP)
          dataset = item_metadata(DATA_ITEM)
          if app.get('id') != APP_ITEM or app.get('type') != 'Web Mapping Application':
              raise SystemExit(f'Unexpected Montgomery County lookup app: {app!r}')
          if web_map.get('id') != WEB_MAP or web_map.get('type') != 'Web Map':
              raise SystemExit(f'Unexpected Montgomery County lookup web map: {web_map!r}')
          if dataset.get('id') != DATA_ITEM or dataset.get('type') != 'Feature Service':
              raise SystemExit(f'Unexpected Montgomery County Commissioner dataset: {dataset!r}')
          if str(dataset.get('url') or '').rstrip('/') != LAYER.rsplit('/', 1)[0]:
              raise SystemExit(f'Montgomery County dataset URL changed: {dataset.get("url")!r}')

          id_pattern = re.compile(r'\b[0-9a-fA-F]{32}\b')
          seen = set()
          queue = deque([(APP_ITEM, 0)])
          referenced = set()
          while queue and len(seen) < 60:
              item_id, depth = queue.popleft()
              item_id = item_id.lower()
              if item_id in seen or depth > 5:
                  continue
              seen.add(item_id)
              try:
                  data = item_data(item_id)
              except Exception:
                  continue
              for child_id in id_pattern.findall(json.dumps(data)):
                  child_id = child_id.lower()
                  referenced.add(child_id)
                  if child_id not in seen:
                      queue.append((child_id, depth + 1))
          for required in (WEB_MAP, DATA_ITEM):
              if required not in referenced:
                  raise SystemExit(f'Montgomery County lookup chain lost item {required}: {sorted(referenced)!r}')

          metadata = fetch_json(f'{LAYER}?f=json')
          if metadata.get('geometryType') != 'esriGeometryPolygon':
              raise SystemExit(f'Unexpected Montgomery County geometry type: {metadata.get("geometryType")!r}')
          fields = {field.get('name') for field in metadata.get('fields', [])}
          required_fields = {'DISTRICTID', 'NAME', 'REPNAME1'}
          if not required_fields.issubset(fields):
              raise SystemExit(f'Montgomery County layer lost fields: {sorted(required_fields - fields)}')

          query = urllib.parse.urlencode({
              'where': '1=1',
              'outFields': 'DISTRICTID,NAME,REPNAME1',
              'returnGeometry': 'false',
              'orderByFields': 'DISTRICTID',
              'f': 'json',
          })
          payload = fetch_json(f'{LAYER}/query?{query}')
          rows = {
              str(feature['attributes']['DISTRICTID']): feature['attributes']
              for feature in payload.get('features', [])
          }
          if set(rows) != set(EXPECTED):
              raise SystemExit(f'Unexpected Montgomery County district IDs: {sorted(rows)}')
          for district_id, officeholder in EXPECTED.items():
              attributes = rows[district_id]
              precinct_id = district_id[-1]
              if str(attributes.get('NAME')) != f'Commissioner Precinct {precinct_id}':
                  raise SystemExit(f'Montgomery County NAME drift for {district_id}: {attributes.get("NAME")!r}')
              if str(attributes.get('REPNAME1')).strip().casefold() != officeholder.casefold():
                  raise SystemExit(f'Montgomery County roster drift for {district_id}: {attributes.get("REPNAME1")!r}')
          print('Montgomery County freshness, application chain, and live roster contracts match the release.')
          PY

      - name: Fetch current Montgomery County Commissioner precincts
        run: |
          for attempt in 1 2 3 4 5; do
            rm -rf build/montgomery-county/precincts
            if python scripts/fetch_arcgis_districts.py \
              --layer-url https://services1.arcgis.com/PRoAPGnMSUqvTrzq/arcgis/rest/services/CountyDistrict_Commissioner/FeatureServer/0 \
              --district-ids 1,2,3,4 \
              --district-field DISTRICTID \
              --district-type commissioner_precinct \
              --district-name-prefix "Commissioner Precinct" \
              --jurisdiction-name "Montgomery County" \
              --record-id-prefix TX:county:montgomery:commissioner_precinct \
              --geometry-id-prefix montgomery-county-commissioner-precinct \
              --source-agency "Montgomery County IT-GIS" \
              --retrieved-at 2026-08-02 \
              --raw-output build/montgomery-county/precincts/raw/commissioner-precincts-1-4.geojson \
              --output build/montgomery-county/precincts/geojson/montgomery_county_commissioner_precincts.geojson; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Verify committed Montgomery County precincts match official source
        run: |
          python scripts/compare_arcgis_district_snapshot.py \
            --committed-raw data/raw/montgomery-county/commissioner-precincts-1-4.geojson \
            --fresh-raw build/montgomery-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --committed-canonical data/geojson/montgomery_county_commissioner_precincts.geojson \
            --fresh-canonical build/montgomery-county/precincts/geojson/montgomery_county_commissioner_precincts.geojson

      - name: Upload Montgomery County precinct drift evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: montgomery-county-precinct-drift
          path: build/montgomery-county/precincts/
          if-no-files-found: error

      - name: Fetch current Montgomery County boundary
        run: |
          for attempt in 1 2 3 4 5; do
            rm -rf build/montgomery-county/county
            if python scripts/fetch_tigerweb_county.py \
              --geoid 48339 \
              --record-id TX:county:montgomery:countywide:COUNTYWIDE \
              --geometry-id montgomery-county-countywide \
              --retrieved-at 2026-08-02 \
              --raw-output build/montgomery-county/county/raw/tigerweb-county-48339.geojson \
              --output build/montgomery-county/county/geojson/montgomery_county_countywide.geojson; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Verify committed Montgomery County boundary matches Census
        run: |
          python scripts/compare_tigerweb_snapshot.py \
            --committed-raw data/raw/montgomery-county/tigerweb-county-48339.geojson \
            --fresh-raw build/montgomery-county/county/raw/tigerweb-county-48339.geojson \
            --committed-canonical data/geojson/montgomery_county_countywide.geojson \
            --fresh-canonical build/montgomery-county/county/geojson/montgomery_county_countywide.geojson

      - name: Run automated tests
        run: pytest -q

      - name: Validate normalized datasets
        run: python scripts/validate.py

      - name: Validate geometry joins
        run: python scripts/validate_geojson.py

      - name: Calculate Montgomery County combined canonical digest
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          paths = [
              Path('data/geojson/montgomery_county_countywide.geojson'),
              Path('data/geojson/montgomery_county_commissioner_precincts.geojson'),
          ]
          digest = hashlib.sha256()
          for path in sorted(paths, key=lambda item: item.name):
              digest.update(path.name.encode('utf-8'))
              digest.update(b'\0')
              digest.update(path.read_bytes())
              digest.update(b'\0')
          value = digest.hexdigest()
          output = Path('build/montgomery-county/release-sha256.txt')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(value + '\n', encoding='utf-8')
          print(f'Montgomery County combined canonical SHA-256: {value}')
          PY

      - name: Upload Montgomery County validation check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: montgomery-county-validation
          path: build/montgomery-county/
          if-no-files-found: error
