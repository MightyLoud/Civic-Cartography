name: Bootstrap Burnet County official geometry

on:
  push:
    branches:
      - agent/burnet-county-dual-prosecutor
    paths:
      - ".github/workflows/bootstrap-burnet-county.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-burnet-county:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve official ArcGIS application
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, re, time, urllib.parse, urllib.request
          from pathlib import Path

          OUT=Path("build/burnet-county-bootstrap")
          OUT.mkdir(parents=True,exist_ok=True)
          APP="54aa0faa57064472a3cb2039b0e115ad"
          UA="Civic-Cartography/0.1 (+https://github.com/MightyLoud/Civic-Cartography)"
          HEAD={"User-Agent":UA,"Accept-Encoding":"identity"}

          def get(url:str):
              last=None
              for attempt in range(1,5):
                  try:
                      req=urllib.request.Request(url,headers=HEAD)
                      with urllib.request.urlopen(req,timeout=90) as r:
                          return json.loads(r.read().decode("utf-8",errors="replace"))
                  except Exception as exc:
                      last=exc
                      if attempt<4: time.sleep(attempt*3)
              raise RuntimeError(f"GET failed {url}: {last}")

          def item_url(item_id:str,data=False):
              suffix="/data" if data else ""
              return f"https://www.arcgis.com/sharing/rest/content/items/{item_id}{suffix}?f=json"

          item_ids=[APP]
          seen_items=set()
          item_records={}
          service_urls=set()
          id_re=re.compile(r"(?<![0-9a-f])[0-9a-f]{32}(?![0-9a-f])",re.I)
          url_re=re.compile(r"https?://[^\"'<>\\s]+(?:FeatureServer|MapServer)(?:/\d+)?",re.I)

          while item_ids and len(seen_items)<40:
              item_id=item_ids.pop(0)
              if item_id in seen_items: continue
              seen_items.add(item_id)
              meta=get(item_url(item_id))
              data=get(item_url(item_id,True))
              item_records[item_id]={"meta":meta,"data":data}
              text=json.dumps({"meta":meta,"data":data})
              for ref in id_re.findall(text):
                  ref=ref.lower()
                  if ref not in seen_items and ref not in item_ids: item_ids.append(ref)
              for url in url_re.findall(text): service_urls.add(url.rstrip("/"))

          candidates=[]
          inspected=[]
          def inspect_layer(layer_url:str,origin:str):
              try:
                  meta=get(layer_url+"?f=json")
              except Exception as exc:
                  inspected.append({"url":layer_url,"origin":origin,"error":str(exc)})
                  return
              record={"url":layer_url,"origin":origin,"name":meta.get("name"),"type":meta.get("type"),"geometryType":meta.get("geometryType")}
              inspected.append(record)
              if meta.get("geometryType")!="esriGeometryPolygon": return
              try:
                  query=layer_url+"/query?"+urllib.parse.urlencode({"where":"1=1","outFields":"*","returnGeometry":"false","f":"json"})
                  rows=get(query).get("features",[])
              except Exception as exc:
                  record["query_error"]=str(exc); return
              if len(rows)!=4: return
              attrs=[row.get("attributes",{}) for row in rows]
              fields=[]
              for field in meta.get("fields",[]):
                  name=field.get("name")
                  values=[]
                  for row in attrs:
                      value=row.get(name)
                      if value is None: continue
                      text=str(value).strip()
                      if text.endswith(".0"): text=text[:-2]
                      values.append(text)
                  unique=sorted(set(values))
                  if unique==["1","2","3","4"]: fields.append(name)
              if not fields: return
              score=0
              text=(str(meta.get("name",""))+" "+layer_url+" "+origin).casefold()
              if "commission" in text: score+=8
              if "precinct" in text: score+=6
              if "burnet" in text: score+=4
              if "county" in text: score+=2
              candidates.append({"url":layer_url,"origin":origin,"name":meta.get("name"),"fields":fields,"score":score,"attributes":attrs})

          for service in sorted(service_urls):
              parts=service.rstrip("/").split("/")
              if parts[-1].isdigit():
                  inspect_layer(service,"embedded_url")
                  continue
              try:
                  meta=get(service+"?f=json")
              except Exception as exc:
                  inspected.append({"url":service,"origin":"embedded_service","error":str(exc)})
                  continue
              layers=meta.get("layers") or []
              if layers:
                  for layer in layers: inspect_layer(service+"/"+str(layer["id"]),"embedded_service")
              elif meta.get("geometryType"):
                  inspect_layer(service,"embedded_service")

          candidates.sort(key=lambda row:(row["score"],row["name"] or ""),reverse=True)
          if not candidates:
              raise SystemExit("No official four-polygon Commissioner candidate with stable values 1-4")
          winner=candidates[0]
          geojson_url=winner["url"]+"/query?"+urllib.parse.urlencode({"where":"1=1","outFields":"*","returnGeometry":"true","outSR":"4326","f":"geojson"})
          req=urllib.request.Request(geojson_url,headers=HEAD)
          with urllib.request.urlopen(req,timeout=120) as r:
              geojson=json.loads(r.read().decode("utf-8"))
          if len(geojson.get("features",[]))!=4: raise SystemExit("Winner GeoJSON did not contain four features")
          (OUT/"commissioner-precincts.geojson").write_text(json.dumps(geojson,sort_keys=True,separators=(",",":"))+"\n")
          report={"application_item_id":APP,"items":item_records,"service_urls":sorted(service_urls),"inspected":inspected,"candidates":candidates,"winner":winner,"winner_geojson_url":geojson_url}
          (OUT/"discovery.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"winner":winner,"feature_count":len(geojson["features"])},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: burnet-county-bootstrap
          path: build/burnet-county-bootstrap/
          if-no-files-found: error
