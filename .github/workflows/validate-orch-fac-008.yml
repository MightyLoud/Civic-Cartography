name: Validate ORCH-FAC-008 Real Batch Integration

on:
  pull_request:
    paths:
      - 'tests/fixtures/orch_fac_008_multnomah.json'
      - 'schemas/orch-fac-008-*.schema.json'
      - 'scripts/validate_orch_fac_*.py'
      - '.github/workflows/validate-orch-fac-008.yml'
      - 'evidence/measured-batch-100/completion-register.csv'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate prerequisite orchestration gates
        run: |
          python scripts/validate_orch_fac_001.py
          python scripts/validate_orch_fac_002.py
          python scripts/validate_orch_fac_003.py
          python scripts/validate_orch_fac_004.py
          python scripts/validate_orch_fac_005.py
          python scripts/validate_orch_fac_006.py
          python scripts/validate_orch_fac_007.py
      - name: Replay frozen MB100-100 evidence through ORCH-FAC
        run: python scripts/validate_orch_fac_008.py
