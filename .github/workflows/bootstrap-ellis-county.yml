name: Bootstrap Ellis County official GIS

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-ellis-county.yml"
      - "scripts/fetch_ellis_commissioner_precincts.py"

jobs:
  probe-ellis-gis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose official layer geometry query modes
        run: |
          python - <<'PY'
          import json, pathlib, urllib.parse, urllib.request
          out=pathlib.Path('build/ellis-bootstrap');out.mkdir(parents=True,exist_ok=True)
          layer='https://maps.co.ellis.tx.us/arcgis/rest/services/Commissioner/Commissioner_Web_Map/MapServer/680'
          headers={'User-Agent':'Civic-Cartography/0.1 (+https://github.com/MightyLoud/Civic-Cartography)'}
          def get(name,url,params):
              full=url+'?'+urllib.parse.urlencode(params)
              try:
                  req=urllib.request.Request(full,headers=headers)
                  with urllib.request.urlopen(req,timeout=120) as r:data=json.load(r)
              except Exception as exc:data={'_error':repr(exc),'_url':full}
              (out/f'{name}.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
              return data
          meta=get('layer-metadata',layer,{'f':'json'})
          ids=get('ids',layer+'/query',{'where':'1=1','returnIdsOnly':'true','f':'json'})
          object_ids=ids.get('objectIds') or []
          variants={
            'bulk-json':{'where':'1=1','outFields':'*','returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'json'},
            'bulk-geojson':{'where':'1=1','outFields':'*','returnGeometry':'true','outSR':'4326','f':'geojson'},
            'pct-only':{'where':'Commissioner_Pct IN (1,2,3,4)','outFields':'*','returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'json'},
          }
          summary={'object_ids':object_ids,'metadata_geometry_type':meta.get('geometryType'),'variants':{}}
          for name,params in variants.items():
              data=get(name,layer+'/query',params)
              feats=data.get('features') or []
              summary['variants'][name]={'feature_count':len(feats),'geometry_count':sum(isinstance(f.get('geometry'),dict) for f in feats),'attributes':[f.get('attributes') or f.get('properties') for f in feats[:12]]}
          for oid in object_ids:
              data=get(f'object-{oid}',layer+'/query',{'objectIds':str(oid),'outFields':'*','returnGeometry':'true','outSR':'4326','returnZ':'false','returnM':'false','f':'json'})
              feats=data.get('features') or []
              summary.setdefault('objects',{})[str(oid)]={'feature_count':len(feats),'geometry_count':sum(isinstance(f.get('geometry'),dict) for f in feats),'attributes':[f.get('attributes') for f in feats]}
          (out/'diagnostic-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ellis-county-gis-bootstrap
          path: build/ellis-bootstrap/
          if-no-files-found: error
