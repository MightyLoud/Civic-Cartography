name: Bootstrap Ellis County official GIS

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-ellis-county.yml"
      - "scripts/derive_ellis_commissioner_precincts.py"

jobs:
  probe-ellis-gis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry dependencies
        run: python -m pip install pyshp pyproj shapely
      - name: Generate current Commissioner and county geometry
        run: |
          python scripts/derive_ellis_commissioner_precincts.py \
            --retrieved-at 2026-08-04 \
            --work-dir build/ellis-bootstrap/work \
            --raw-output build/ellis-bootstrap/data/raw/ellis-county/commissioner-precincts-1-4.geojson \
            --output build/ellis-bootstrap/data/geojson/ellis_county_commissioner_precincts.geojson \
            --contract-output build/ellis-bootstrap/data/raw/ellis-county/gis-source-contract.json \
            --evidence-output build/ellis-bootstrap/data/raw/ellis-county/derivation-evidence.json
          python scripts/fetch_tigerweb_county.py \
            --geoid 48139 \
            --record-id TX:county:ellis:countywide:COUNTYWIDE \
            --geometry-id ellis-county-countywide \
            --retrieved-at 2026-08-04 \
            --raw-output build/ellis-bootstrap/data/raw/ellis-county/tigerweb-county-48139.geojson \
            --output build/ellis-bootstrap/data/geojson/ellis_county_countywide.geojson
          python - <<'PY'
          import hashlib
          from pathlib import Path
          paths=[Path('build/ellis-bootstrap/data/geojson/ellis_county_countywide.geojson'),Path('build/ellis-bootstrap/data/geojson/ellis_county_commissioner_precincts.geojson')]
          digest=hashlib.sha256()
          for path in sorted(paths,key=lambda p:p.name):
              digest.update(path.name.encode());digest.update(b'\0');digest.update(path.read_bytes());digest.update(b'\0')
          value=digest.hexdigest()
          Path('build/ellis-bootstrap/release-sha256.txt').write_text(value+'\n')
          print('Ellis County combined canonical SHA-256:',value)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ellis-county-gis-bootstrap
          path: build/ellis-bootstrap/
          if-no-files-found: error
