name: Bootstrap Ellis County official GIS

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-ellis-county.yml"

jobs:
  probe-ellis-gis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe official ArcGIS Enterprise endpoints
        run: |
          python - <<'PY'
          import json, pathlib, urllib.parse, urllib.request

          out = pathlib.Path('build/ellis-bootstrap')
          out.mkdir(parents=True, exist_ok=True)
          headers = {'User-Agent': 'Civic-Cartography/0.1 (+https://github.com/MightyLoud/Civic-Cartography)'}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.load(response)

          portal = 'https://maps.co.ellis.tx.us/portal'
          queries = [
              'commissioner',
              'commissioner precinct',
              'precinct',
              'redistricting',
              'owner:EllisCountyGIS',
          ]
          results = []
          for query in queries:
              url = portal + '/sharing/rest/search?' + urllib.parse.urlencode({'f':'json','num':100,'q':query})
              payload = get(url)
              for item in payload.get('results', []):
                  item = dict(item)
                  item['_query'] = query
                  results.append(item)

          # De-duplicate by item id.
          items = {item['id']: item for item in results if item.get('id')}
          enriched = []
          for item_id, item in sorted(items.items()):
              data_url = f'{portal}/sharing/rest/content/items/{item_id}/data?f=json'
              try:
                  data = get(data_url)
              except Exception as exc:
                  data = {'_error': str(exc)}
              record = {'item': item, 'data': data}
              enriched.append(record)
              title = str(item.get('title') or '')
              item_type = str(item.get('type') or '')
              url = str(item.get('url') or '')
              if any(term in (title + ' ' + url).casefold() for term in ('commission', 'precinct', 'redistrict')):
                  print(json.dumps({'id': item_id, 'title': title, 'type': item_type, 'owner': item.get('owner'), 'url': url}, sort_keys=True))

          catalogs = {}
          for base in (
              'https://maps.co.ellis.tx.us/server/rest/services',
              'https://maps.co.ellis.tx.us/arcgis/rest/services',
          ):
              try:
                  catalogs[base] = get(base + '?f=json')
              except Exception as exc:
                  catalogs[base] = {'_error': str(exc)}

          (out/'portal-items.json').write_text(json.dumps(enriched, indent=2, sort_keys=True) + '\n')
          (out/'service-catalogs.json').write_text(json.dumps(catalogs, indent=2, sort_keys=True) + '\n')
          print(f'portal item count: {len(enriched)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ellis-county-gis-bootstrap
          path: build/ellis-bootstrap/
          if-no-files-found: error
