name: Bootstrap Ellis County official GIS

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-ellis-county.yml"

jobs:
  probe-ellis-gis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect official Commissioner MapServer
        run: |
          python - <<'PY'
          import json, pathlib, urllib.parse, urllib.request

          out = pathlib.Path('build/ellis-bootstrap')
          out.mkdir(parents=True, exist_ok=True)
          headers = {'User-Agent': 'Civic-Cartography/0.1 (+https://github.com/MightyLoud/Civic-Cartography)'}
          service = 'https://maps.co.ellis.tx.us/arcgis/rest/services/Commissioner/Commissioner_Web_Map/MapServer'

          def get(url, params=None):
              if params:
                  url += ('&' if '?' in url else '?') + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.load(response)

          metadata = get(service, {'f':'pjson'})
          (out/'mapserver.json').write_text(json.dumps(metadata, indent=2, sort_keys=True) + '\n')

          report = []
          candidates = []
          for layer in metadata.get('layers', []):
              layer_id = int(layer['id'])
              layer_url = f'{service}/{layer_id}'
              layer_meta = get(layer_url, {'f':'pjson'})
              query = get(layer_url + '/query', {
                  'where':'1=1',
                  'outFields':'*',
                  'returnGeometry':'true',
                  'outSR':'4326',
                  'f':'geojson',
              })
              features = query.get('features', []) if isinstance(query, dict) else []
              record = {
                  'id': layer_id,
                  'name': layer_meta.get('name'),
                  'geometryType': layer_meta.get('geometryType'),
                  'displayField': layer_meta.get('displayField'),
                  'fields': [field.get('name') for field in layer_meta.get('fields', [])],
                  'feature_count': len(features),
                  'sample_properties': [feature.get('properties', {}) for feature in features[:8]],
              }
              report.append(record)
              (out/f'layer-{layer_id}-metadata.json').write_text(json.dumps(layer_meta, indent=2, sort_keys=True) + '\n')
              (out/f'layer-{layer_id}.geojson').write_text(json.dumps(query, sort_keys=True, separators=(',', ':')) + '\n')
              print(json.dumps(record, sort_keys=True))
              if layer_meta.get('geometryType') == 'esriGeometryPolygon' and len(features) == 4:
                  candidates.append(record)

          (out/'layer-report.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          if not candidates:
              raise SystemExit('No four-feature polygon layer found')
          print('four-feature polygon candidates:', json.dumps(candidates, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ellis-county-gis-bootstrap
          path: build/ellis-bootstrap/
          if-no-files-found: error
