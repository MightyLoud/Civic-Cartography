name: Bootstrap Ellis County official GIS

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-ellis-county.yml"

permissions:
  contents: write

jobs:
  probe-ellis-gis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ellis-county-combined-prosecutor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry dependencies
        run: python -m pip install pyshp pyproj shapely
      - name: Generate permanent geometry snapshots
        run: |
          python scripts/derive_ellis_commissioner_precincts.py \
            --retrieved-at 2026-08-04 \
            --work-dir build/ellis-publish/work \
            --raw-output data/raw/ellis-county/commissioner-precincts-1-4.geojson \
            --output data/geojson/ellis_county_commissioner_precincts.geojson \
            --contract-output data/raw/ellis-county/gis-source-contract.json \
            --evidence-output data/raw/ellis-county/derivation-evidence.json
          python scripts/fetch_tigerweb_county.py \
            --geoid 48139 \
            --record-id TX:county:ellis:countywide:COUNTYWIDE \
            --geometry-id ellis-county-countywide \
            --retrieved-at 2026-08-04 \
            --raw-output data/raw/ellis-county/tigerweb-county-48139.geojson \
            --output data/geojson/ellis_county_countywide.geojson
          python - <<'PY'
          import hashlib
          from pathlib import Path
          paths=[Path('data/geojson/ellis_county_countywide.geojson'),Path('data/geojson/ellis_county_commissioner_precincts.geojson')]
          digest=hashlib.sha256()
          for path in sorted(paths,key=lambda p:p.name):
              digest.update(path.name.encode());digest.update(b'\0');digest.update(path.read_bytes());digest.update(b'\0')
          value=digest.hexdigest()
          if value!='cbac5b521198324dc1fa4e7a94974a27a5c91a84db401803d7235c5f3f2ae343':
              raise SystemExit(f'Unexpected Ellis release digest: {value}')
          print('Ellis County combined canonical SHA-256:',value)
          PY
      - name: Commit exact snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geojson/ellis_county_commissioner_precincts.geojson data/geojson/ellis_county_countywide.geojson data/raw/ellis-county/commissioner-precincts-1-4.geojson data/raw/ellis-county/derivation-evidence.json data/raw/ellis-county/gis-source-contract.json data/raw/ellis-county/tigerweb-county-48139.geojson
          git commit -m "Publish Ellis County combined-prosecutor geometry"
          git push origin HEAD:agent/ellis-county-combined-prosecutor
