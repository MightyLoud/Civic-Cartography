name: Bootstrap Ellis County official GIS

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-ellis-county.yml"
      - "scripts/fetch_ellis_commissioner_precincts.py"

jobs:
  probe-ellis-gis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch exact county Commissioner layer
        run: |
          python scripts/fetch_ellis_commissioner_precincts.py \
            --retrieved-at 2026-08-04 \
            --raw-output build/ellis-bootstrap/commissioner-precincts-1-4.geojson \
            --output build/ellis-bootstrap/ellis_county_commissioner_precincts.geojson \
            --contract-output build/ellis-bootstrap/gis-source-contract.json
          python - <<'PY'
          import json
          from pathlib import Path
          raw=json.loads(Path('build/ellis-bootstrap/commissioner-precincts-1-4.geojson').read_text())
          canonical=json.loads(Path('build/ellis-bootstrap/ellis_county_commissioner_precincts.geojson').read_text())
          ids=[str(feature['properties']['Commissioner_Pct']) for feature in raw['features']]
          geometry_types={feature['geometry']['type'] for feature in raw['features']}
          if ids != ['1','2','3','4'] or len(canonical['features']) != 4:
              raise SystemExit(f'Unexpected Commissioner output: ids={ids}')
          if not geometry_types <= {'Polygon','MultiPolygon'}:
              raise SystemExit(f'Unexpected geometry types: {geometry_types}')
          print(json.dumps({'district_ids':ids,'geometry_types':sorted(geometry_types)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ellis-county-gis-bootstrap
          path: build/ellis-bootstrap/
          if-no-files-found: error
