name: Bootstrap LIC-G5 rebased lock and SBOM

on:
  push:
    branches:
      - "agent/lic-g5-supply-chain-hardening"
    paths:
      - "requirements-dev.txt"
      - "requirements-dev.lock"
      - "scripts/build_supply_chain_artifacts.py"
      - ".github/workflows/bootstrap-lic-g5-rebased-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref_name == 'agent/lic-g5-supply-chain-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/lic-g5-supply-chain-hardening
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install the retained bootstrap environment
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Regenerate the comprehensive exact lock
        run: uv pip compile requirements-dev.txt --generate-hashes --python-version 3.12 --no-header --output-file requirements-dev.lock
      - name: Install and verify the regenerated environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          PYTHONPATH=. python -c "import fitz, pypdfium2"
          PYTHONPATH=scripts python -c "import fitz, pypdfium2"
      - name: Regenerate the deterministic CycloneDX SBOM
        run: python scripts/build_supply_chain_artifacts.py --write
      - name: Commit the generated controls back to the PR branch
        shell: bash
        run: |
          if git diff --quiet -- requirements-dev.lock sbom.cdx.json; then
            echo "Lock and SBOM already match"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-dev.lock sbom.cdx.json
          git commit -m "Regenerate rebased LIC-G5 lock and SBOM"
          git push origin HEAD:agent/lic-g5-supply-chain-hardening
