name: Probe Burnet County ArcGIS index

on:
  pull_request:
    paths:
      - ".github/workflows/probe-burnet-arcgis-index.yml"
      - "scripts/probe_burnet_arcgis_index.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-burnet-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_burnet_arcgis_index.py
      - uses: actions/upload-artifact@v4
        with:
          name: burnet-arcgis-index
          path: build/burnet-arcgis-index/
          if-no-files-found: error
