name: Validate Collin County Commissioners Court

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-collin-county:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Validate stale narrative, operational layer, and adoption metadata
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request

          PAGE_URL = 'https://www.collincountytx.gov/government/commissioners-court/precincts'
          APP_URL = 'https://maps.collincountytx.gov/ccmap_commissioners/'
          OPERATIONAL_LAYER = 'https://maps.collincountytx.gov/server/rest/services/InteractiveMap/Election/MapServer/1'
          ADOPTION_LAYER = 'https://maps.collincountytx.gov/server/rest/services/Election/VotingPrecincts_Edited_PlanC2333/FeatureServer/3'

          def fetch(url, json_response=False):
              request = urllib.request.Request(url, headers={'User-Agent': 'Civic-Cartography-validator/1.0'})
              last_error = None
              for attempt in range(1, 6):
                  try:
                      with urllib.request.urlopen(request, timeout=45) as response:
                          if json_response:
                              return json.load(response)
                          return response.read().decode('utf-8', errors='replace')
                  except Exception as exc:
                      last_error = exc
                      if attempt == 5:
                          raise
                      time.sleep(attempt * 5)
              raise last_error

          page = fetch(PAGE_URL)
          for value in ('September 6, 2011', 'January 1, 2012'):
              if value not in page:
                  raise SystemExit(f'Collin County stale landing-page marker changed: {value}')
          app = fetch(APP_URL)
          if not app.strip():
              raise SystemExit('Collin County Commissioner application returned empty content.')

          operational = fetch(f'{OPERATIONAL_LAYER}?f=json', json_response=True)
          if operational.get('geometryType') != 'esriGeometryPolygon':
              raise SystemExit(f'Unexpected Collin County operational geometry type: {operational.get("geometryType")!r}')
          operational_fields = {field.get('name') for field in operational.get('fields', [])}
          required = {'COMMISH', 'COMMISH_N'}
          if not required.issubset(operational_fields):
              raise SystemExit(f'Collin County operational layer lost fields: {sorted(required - operational_fields)}')

          adoption = fetch(f'{ADOPTION_LAYER}?f=json', json_response=True)
          if adoption.get('geometryType') != 'esriGeometryPolygon':
              raise SystemExit(f'Unexpected Collin County adoption geometry type: {adoption.get("geometryType")!r}')
          description = adoption.get('description') or ''
          for value in ('November 1, 2021', '2021-1127-11-01'):
              if value not in description:
                  raise SystemExit(f'Collin County adoption layer lost marker: {value}')
          adoption_fields = {field.get('name') for field in adoption.get('fields', [])}
          if not required.issubset(adoption_fields):
              raise SystemExit(f'Collin County adoption layer lost fields: {sorted(required - adoption_fields)}')

          query = urllib.parse.urlencode({
              'where': '1=1',
              'outFields': 'COMMISH,COMMISH_N',
              'returnGeometry': 'false',
              'orderByFields': 'COMMISH',
              'f': 'json',
          })
          payload = fetch(f'{OPERATIONAL_LAYER}/query?{query}', json_response=True)
          rows = {str(feature['attributes']['COMMISH']): str(feature['attributes']['COMMISH_N'] or '').strip() for feature in payload.get('features', [])}
          expected = {
              '1': 'Susan Fletcher',
              '2': 'Cheryl Williams',
              '3': 'Darrell Hale',
              '4': 'Duncan Webb',
          }
          if set(rows) != set(expected):
              raise SystemExit(f'Unexpected Collin County precinct IDs: {sorted(rows)}')
          for precinct_id, officeholder in expected.items():
              if rows[precinct_id].casefold() != officeholder.casefold():
                  raise SystemExit(f'Collin County operational roster drift for precinct {precinct_id}: {rows[precinct_id]!r}')
              if rows[precinct_id] != rows[precinct_id].upper():
                  raise SystemExit(f'Collin County source-label casing changed for precinct {precinct_id}: {rows[precinct_id]!r}')
          print('Collin County stale narrative, app-resolved operational layer, and 2021 adoption metadata match the release contract.')
          PY

      - name: Fetch current Collin County Commissioner precincts
        run: |
          for attempt in 1 2 3 4 5; do
            rm -rf build/collin-county/precincts
            if python scripts/fetch_arcgis_districts.py \
              --layer-url https://maps.collincountytx.gov/server/rest/services/InteractiveMap/Election/MapServer/1 \
              --district-ids 1,2,3,4 \
              --district-field COMMISH \
              --district-type commissioner_precinct \
              --district-name-prefix "Commissioner Precinct" \
              --jurisdiction-name "Collin County" \
              --record-id-prefix TX:county:collin:commissioner_precinct \
              --geometry-id-prefix collin-county-commissioner-precinct \
              --source-agency "Collin County GIS" \
              --retrieved-at 2026-08-02 \
              --raw-output build/collin-county/precincts/raw/commissioner-precincts-1-4.geojson \
              --output build/collin-county/precincts/geojson/collin_county_commissioner_precincts.geojson; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Verify committed Collin County precincts match official source
        run: |
          python scripts/compare_arcgis_district_snapshot.py \
            --committed-raw data/raw/collin-county/commissioner-precincts-1-4.geojson \
            --fresh-raw build/collin-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --committed-canonical data/geojson/collin_county_commissioner_precincts.geojson \
            --fresh-canonical build/collin-county/precincts/geojson/collin_county_commissioner_precincts.geojson

      - name: Fetch current Collin County boundary
        run: |
          for attempt in 1 2 3 4 5; do
            rm -rf build/collin-county/county
            if python scripts/fetch_tigerweb_county.py \
              --geoid 48085 \
              --record-id TX:county:collin:countywide:COUNTYWIDE \
              --geometry-id collin-county-countywide \
              --retrieved-at 2026-08-02 \
              --raw-output build/collin-county/county/raw/tigerweb-county-48085.geojson \
              --output build/collin-county/county/geojson/collin_county_countywide.geojson; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Verify committed Collin County boundary matches Census
        run: |
          python scripts/compare_tigerweb_snapshot.py \
            --committed-raw data/raw/collin-county/tigerweb-county-48085.geojson \
            --fresh-raw build/collin-county/county/raw/tigerweb-county-48085.geojson \
            --committed-canonical data/geojson/collin_county_countywide.geojson \
            --fresh-canonical build/collin-county/county/geojson/collin_county_countywide.geojson

      - name: Run automated tests
        run: pytest -q

      - name: Validate normalized datasets
        run: python scripts/validate.py

      - name: Validate geometry joins
        run: python scripts/validate_geojson.py

      - name: Calculate Collin County combined canonical digest
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          paths = [
              Path('data/geojson/collin_county_countywide.geojson'),
              Path('data/geojson/collin_county_commissioner_precincts.geojson'),
          ]
          digest = hashlib.sha256()
          for path in sorted(paths, key=lambda item: item.name):
              digest.update(path.name.encode('utf-8'))
              digest.update(b'\0')
              digest.update(path.read_bytes())
              digest.update(b'\0')
          value = digest.hexdigest()
          output = Path('build/collin-county/release-sha256.txt')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(value + '\n', encoding='utf-8')
          print(f'Collin County combined canonical SHA-256: {value}')
          PY

      - name: Upload Collin County validation check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collin-county-validation
          path: build/collin-county/
          if-no-files-found: error
