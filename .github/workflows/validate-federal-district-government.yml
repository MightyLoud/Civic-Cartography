name: Validate federal district government rule

on:
  pull_request:
    paths:
      - ".github/workflows/validate-federal-district-government.yml"
      - "patches/openstates-jurisdictions/0001-continue-jurisdiction-after-stub.patch"
      - "patches/openstates-jurisdictions/0002-normalize-blank-lsad-before-classification.patch"
      - "patches/openstates-jurisdictions/0003-authoritative-jurisdiction-overrides.patch"
      - "patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch"
      - "patches/openstates-jurisdictions/0005-transit-division-jurisdiction-classification.patch"
      - "patches/openstates-jurisdictions/0006-territory-municipio-support.patch"
      - "patches/openstates-jurisdictions/0007-federal-district-government.patch"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: openstates/jurisdictions
  UPSTREAM_REVISION: 6fbe7d6aed32c3b781490c8e4c5a737bdd6e4705

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Civic-Cartography
        uses: actions/checkout@v4

      - name: Check out pinned upstream generator
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REVISION }}
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned upstream dependencies
        run: |
          python -m pip install uv
          cd upstream
          uv sync --frozen

      - name: Apply validated upstream patch stack
        run: |
          for patch in \
            patches/openstates-jurisdictions/0001-continue-jurisdiction-after-stub.patch \
            patches/openstates-jurisdictions/0002-normalize-blank-lsad-before-classification.patch \
            patches/openstates-jurisdictions/0003-authoritative-jurisdiction-overrides.patch; do
            git -C upstream apply --check "../$patch"
            git -C upstream apply "../$patch"
          done
          git -C upstream add -A
          git -C upstream \
            -c user.name="Civic Cartography" \
            -c user.email="civic-cartography@example.invalid" \
            commit -m "Apply validated upstream fixes 1-3"

          for patch in \
            patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch \
            patches/openstates-jurisdictions/0005-transit-division-jurisdiction-classification.patch \
            patches/openstates-jurisdictions/0006-territory-municipio-support.patch \
            patches/openstates-jurisdictions/0007-federal-district-government.patch; do
            git -C upstream apply --check "../$patch"
            git -C upstream apply "../$patch"
          done
          git -C upstream diff --check

      - name: Test federal district classification and stub generation
        run: |
          cd upstream
          uv run pytest \
            tests/src/init_migration/test_jurisdiction_seed.py \
            tests/src/init_migration/test_generate_pipeline_stub_classification.py \
            tests/src/init_migration/test_federal_district.py \
            --color=yes
          uv run ruff check \
            src/init_migration/jurisdiction_seed.py \
            tests/src/init_migration/test_federal_district.py
