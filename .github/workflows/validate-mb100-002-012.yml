name: Validate MB100-002 through MB100-012

on:
  pull_request:
    paths:
      - ".github/workflows/validate-mb100-002-012.yml"
      - "tests/fixtures/mb100_002_012.yml"
      - "scripts/capture_upstream_batch.py"
      - "scripts/capture_upstream_fixtures.py"
      - "scripts/capture_upstream_with_authoritative_overrides.py"
      - "scripts/normalize_capture_acceptance.py"
      - "scripts/normalize_canonical_alias_acceptance.py"
      - "civic_cartography/target_manifest.py"
      - "data/authoritative_jurisdiction_overrides.yml"
      - "data/canonical_alias_groups.yml"
      - "patches/openstates-jurisdictions/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: openstates/jurisdictions
  UPSTREAM_REVISION: 6fbe7d6aed32c3b781490c8e4c5a737bdd6e4705
  RUN_ASOF: 2026-08-06T13:32:00Z
  TARGET_MANIFEST: tests/fixtures/mb100_002_012.yml
  OVERRIDE_REGISTRY: data/authoritative_jurisdiction_overrides.yml
  ALIAS_REGISTRY: data/canonical_alias_groups.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Civic-Cartography
        uses: actions/checkout@v4

      - name: Check out pinned upstream generator
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REVISION }}
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install uv
          cd upstream
          uv sync --frozen

      - name: Apply validated upstream patches
        run: |
          for patch in \
            patches/openstates-jurisdictions/0001-continue-jurisdiction-after-stub.patch \
            patches/openstates-jurisdictions/0002-normalize-blank-lsad-before-classification.patch \
            patches/openstates-jurisdictions/0003-authoritative-jurisdiction-overrides.patch; do
            git -C upstream apply --check "../$patch"
            git -C upstream apply "../$patch"
          done
          git -C upstream add -A
          git -C upstream -c user.name="Civic Cartography" -c user.email="civic-cartography@example.invalid" commit -m "Apply validated upstream fixes 1-3"
          git -C upstream apply --check ../patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch
          git -C upstream apply ../patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch
          git -C upstream diff --check

      - name: Capture deterministic run 1
        run: |
          PYTHONPATH=. upstream/.venv/bin/python scripts/capture_upstream_with_authoritative_overrides.py \
            --override-registry "$OVERRIDE_REGISTRY" \
            --alias-registry "$ALIAS_REGISTRY" \
            --upstream-root upstream \
            --target-manifest "$TARGET_MANIFEST" \
            --run-asof "$RUN_ASOF" \
            --source-dir build/upstream-source \
            --work-dir build/run-1 \
            --execution-results build/run-1/execution-results.json \
            --diagnostics build/run-1/diagnostics.json
          python scripts/normalize_capture_acceptance.py \
            --target-manifest "$TARGET_MANIFEST" \
            --execution-results build/run-1/execution-results.json \
            --diagnostics build/run-1/diagnostics.json
          PYTHONPATH=. python scripts/normalize_canonical_alias_acceptance.py \
            --alias-registry "$ALIAS_REGISTRY" \
            --target-manifest "$TARGET_MANIFEST" \
            --execution-results build/run-1/execution-results.json \
            --diagnostics build/run-1/diagnostics.json
          python scripts/run_target_manifest.py \
            --target-manifest "$TARGET_MANIFEST" \
            --run-asof "$RUN_ASOF" \
            --execution-results build/run-1/execution-results.json \
            --artifact-root build/run-1/artifacts \
            --result-path build/run-1/report.json

      - name: Capture deterministic run 2
        run: |
          PYTHONPATH=. upstream/.venv/bin/python scripts/capture_upstream_with_authoritative_overrides.py \
            --override-registry "$OVERRIDE_REGISTRY" \
            --alias-registry "$ALIAS_REGISTRY" \
            --upstream-root upstream \
            --target-manifest "$TARGET_MANIFEST" \
            --run-asof "$RUN_ASOF" \
            --source-dir build/upstream-source \
            --work-dir build/run-2 \
            --execution-results build/run-2/execution-results.json \
            --diagnostics build/run-2/diagnostics.json
          python scripts/normalize_capture_acceptance.py \
            --target-manifest "$TARGET_MANIFEST" \
            --execution-results build/run-2/execution-results.json \
            --diagnostics build/run-2/diagnostics.json
          PYTHONPATH=. python scripts/normalize_canonical_alias_acceptance.py \
            --alias-registry "$ALIAS_REGISTRY" \
            --target-manifest "$TARGET_MANIFEST" \
            --execution-results build/run-2/execution-results.json \
            --diagnostics build/run-2/diagnostics.json
          python scripts/run_target_manifest.py \
            --target-manifest "$TARGET_MANIFEST" \
            --run-asof "$RUN_ASOF" \
            --execution-results build/run-2/execution-results.json \
            --artifact-root build/run-2/artifacts \
            --result-path build/run-2/report.json

      - name: Evaluate parity and emit measured summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          r1 = json.loads(Path('build/run-1/report.json').read_text())
          r2 = json.loads(Path('build/run-2/report.json').read_text())

          def normalized(report):
              return {
                  row['target_id']: {
                      'match_status': row['match_status'],
                      'classification_status': row['classification_status'],
                      'generation_status': row['generation_status'],
                      'resolved_ocdids': row['resolved_ocdids'],
                      'division_paths': row['division_paths'],
                      'jurisdiction_paths': row['jurisdiction_paths'],
                      'output_hashes': row['output_hashes'],
                      'exception_class': row['exception_class'],
                      'review_reason': row['review_reason'],
                  }
                  for row in report['results']
              }

          n1, n2 = normalized(r1), normalized(r2)
          parity = n1 == n2
          rows = []
          for target_id in sorted(n1):
              row = n1[target_id]
              row_parity = row == n2[target_id]
              passed = (
                  row['match_status'] == 'matched'
                  and row['classification_status'] == 'matched'
                  and row['generation_status'] == 'generated'
                  and row['exception_class'] is None
                  and row_parity
              )
              canonical_ids = []
              for path in row['jurisdiction_paths']:
                  canonical_ids.append(Path(path).stem)
              rows.append({
                  'target_id': target_id,
                  **row,
                  'canonical_ids': sorted(canonical_ids),
                  'parity_ok': row_parity,
                  'qa_status': 'PASS' if passed else 'FAIL',
              })

          summary = {
              'schema_version': 1,
              'run_asof': r1['run_asof'],
              'upstream_repository': 'openstates/jurisdictions',
              'upstream_revision': '6fbe7d6aed32c3b781490c8e4c5a737bdd6e4705',
              'repository_commit': '${{ github.sha }}',
              'run_1_id': r1['run_id'],
              'run_2_id': r2['run_id'],
              'parity_ok': parity,
              'pass_count': sum(row['qa_status'] == 'PASS' for row in rows),
              'target_count': len(rows),
              'results': rows,
          }
          Path('build/mb100-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          Path('build/mb100-checksums.txt').write_text(
              '\n'.join(
                  f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.as_posix()}"
                  for path in sorted(Path('build').glob('run-*/report.json'))
              ) + '\n'
          )
          if not parity or summary['pass_count'] != summary['target_count']:
              raise SystemExit(json.dumps(summary, indent=2))
          PY

      - name: Upload auditable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mb100-002-012-evidence
          path: |
            build/mb100-summary.json
            build/mb100-checksums.txt
            build/run-1/report.json
            build/run-1/execution-results.json
            build/run-1/diagnostics.json
            build/run-2/report.json
            build/run-2/execution-results.json
            build/run-2/diagnostics.json
          if-no-files-found: error
