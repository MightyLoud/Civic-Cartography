name: Validate Denton County proof

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate-denton-county:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Generate Denton County release geometry
        run: |
          python scripts/fetch_tigerweb_county.py \
            --geoid 48121 \
            --record-id TX:county:denton:countywide:COUNTYWIDE \
            --geometry-id denton-county-countywide \
            --retrieved-at 2026-08-01 \
            --raw-output data/raw/denton-county/tigerweb-county-48121.geojson \
            --output data/geojson/denton_county_countywide.geojson

          python scripts/fetch_arcgis_districts.py \
            --layer-url https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/4 \
            --district-ids 1,2,3,4 \
            --district-field COMMISH \
            --district-type commissioner_precinct \
            --district-name-prefix "Commissioner Precinct" \
            --jurisdiction-name "Denton County" \
            --record-id-prefix TX:county:denton:commissioner_precinct \
            --geometry-id-prefix denton-county-commissioner-precinct \
            --source-agency "Denton County GIS" \
            --retrieved-at 2026-08-01 \
            --raw-output data/raw/denton-county/commissioner-precincts-1-4.geojson \
            --output data/geojson/denton_county_commissioner_precincts.geojson

      - name: Create Denton County normalized records
        run: |
          mkdir -p data/normalized
          cat > data/normalized/denton_county_commissioners_court.csv <<'CSV'
          record_id,state_fips,state_abbr,jurisdiction_type,jurisdiction_name,district_type,district_id,district_name,source_url,source_retrieved_at,source_confidence,qa_status,parity_ok,office_name,election_date,geometry_source_url,geometry_id,parent_record_id,notes
          TX:county:denton:countywide:COUNTYWIDE,48,TX,county,Denton County,countywide,COUNTYWIDE,Countywide,https://www.dentoncounty.gov/165/Commissioners-Court,2026-08-01,high,approved,TRUE,County Judge,,https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Current/MapServer/82,denton-county-countywide,,"Andy Eads is the current County Judge and represents Denton County countywide. Census GEOID 48121."
          TX:county:denton:commissioner_precinct:1,48,TX,county,Denton County,commissioner_precinct,1,Commissioner Precinct 1,https://www.dentoncounty.gov/165/Commissioners-Court,2026-08-01,high,approved,TRUE,County Commissioner Precinct 1,,https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/4,denton-county-commissioner-precinct-1,,"Ryan Williams is the current Precinct 1 Commissioner. Official Denton County GIS source field COMMISH equals 1."
          TX:county:denton:commissioner_precinct:2,48,TX,county,Denton County,commissioner_precinct,2,Commissioner Precinct 2,https://www.dentoncounty.gov/165/Commissioners-Court,2026-08-01,high,approved,TRUE,County Commissioner Precinct 2,,https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/4,denton-county-commissioner-precinct-2,,"Kevin Falconer is the current Precinct 2 Commissioner. Official Denton County GIS source field COMMISH equals 2."
          TX:county:denton:commissioner_precinct:3,48,TX,county,Denton County,commissioner_precinct,3,Commissioner Precinct 3,https://www.dentoncounty.gov/165/Commissioners-Court,2026-08-01,high,approved,TRUE,County Commissioner Precinct 3,,https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/4,denton-county-commissioner-precinct-3,,"Bobbie J. Mitchell is the current Precinct 3 Commissioner. Official Denton County GIS source field COMMISH equals 3."
          TX:county:denton:commissioner_precinct:4,48,TX,county,Denton County,commissioner_precinct,4,Commissioner Precinct 4,https://www.dentoncounty.gov/165/Commissioners-Court,2026-08-01,high,approved,TRUE,County Commissioner Precinct 4,,https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/4,denton-county-commissioner-precinct-4,,"Dianne Edmondson is the current Precinct 4 Commissioner. Official Denton County GIS source field COMMISH equals 4."
          CSV
          sed -i 's/^          //' data/normalized/denton_county_commissioners_court.csv

      - name: Run automated tests
        run: pytest -q

      - name: Validate normalized datasets
        run: python scripts/validate.py

      - name: Validate geometry joins
        run: python scripts/validate_geojson.py

      - name: Commit Denton County release files once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/denton-county/tigerweb-county-48121.geojson \
            data/raw/denton-county/commissioner-precincts-1-4.geojson \
            data/geojson/denton_county_countywide.geojson \
            data/geojson/denton_county_commissioner_precincts.geojson \
            data/normalized/denton_county_commissioners_court.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add Denton County Commissioners Court release files"
            git push
          fi

      - name: Upload Denton County release check
        uses: actions/upload-artifact@v4
        with:
          name: denton-county-boundary-check
          path: |
            data/raw/denton-county/tigerweb-county-48121.geojson
            data/raw/denton-county/commissioner-precincts-1-4.geojson
            data/geojson/denton_county_countywide.geojson
            data/geojson/denton_county_commissioner_precincts.geojson
            data/normalized/denton_county_commissioners_court.csv
          if-no-files-found: error
