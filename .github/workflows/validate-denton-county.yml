name: Validate Denton County proof

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate-denton-county:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch current Denton County boundary
        run: |
          python scripts/fetch_tigerweb_county.py \
            --geoid 48121 \
            --record-id TX:county:denton:countywide:COUNTYWIDE \
            --geometry-id denton-county-countywide \
            --retrieved-at 2026-08-01 \
            --raw-output build/denton-county/county/raw/tigerweb-county-48121.geojson \
            --output build/denton-county/county/geojson/denton_county_countywide.geojson

      - name: Verify committed Denton County boundary matches Census
        run: |
          python scripts/compare_tigerweb_snapshot.py \
            --committed-raw data/raw/denton-county/tigerweb-county-48121.geojson \
            --fresh-raw build/denton-county/county/raw/tigerweb-county-48121.geojson \
            --committed-canonical data/geojson/denton_county_countywide.geojson \
            --fresh-canonical build/denton-county/county/geojson/denton_county_countywide.geojson

      - name: Fetch current Denton County commissioner precincts
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/4 \
            --district-ids 1,2,3,4 \
            --district-field COMMISH \
            --district-type commissioner_precinct \
            --district-name-prefix "Commissioner Precinct" \
            --jurisdiction-name "Denton County" \
            --record-id-prefix TX:county:denton:commissioner_precinct \
            --geometry-id-prefix denton-county-commissioner-precinct \
            --source-agency "Denton County GIS" \
            --retrieved-at 2026-08-01 \
            --raw-output build/denton-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --output build/denton-county/precincts/geojson/denton_county_commissioner_precincts.geojson

      - name: Verify committed Denton County precincts match official GIS
        run: |
          python scripts/compare_arcgis_district_snapshot.py \
            --committed-raw data/raw/denton-county/commissioner-precincts-1-4.geojson \
            --fresh-raw build/denton-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --committed-canonical data/geojson/denton_county_commissioner_precincts.geojson \
            --fresh-canonical build/denton-county/precincts/geojson/denton_county_commissioner_precincts.geojson

      - name: Generate Denton County constable release files
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/5 \
            --district-ids 1,2,3,4,5,6 \
            --district-field JP_C \
            --district-type constable_precinct \
            --district-name-prefix "Constable Precinct" \
            --jurisdiction-name "Denton County" \
            --record-id-prefix TX:county:denton:constable_precinct \
            --geometry-id-prefix denton-county-constable-precinct \
            --source-agency "Denton County GIS" \
            --retrieved-at 2026-08-01 \
            --raw-output data/raw/denton-county/constable-precincts-1-6.geojson \
            --output data/geojson/denton_county_constable_precincts.geojson

          mkdir -p data/normalized
          cat > data/normalized/denton_county_constables.csv <<'CSV'
          record_id,state_fips,state_abbr,jurisdiction_type,jurisdiction_name,district_type,district_id,district_name,source_url,source_retrieved_at,source_confidence,qa_status,parity_ok,office_name,election_date,geometry_source_url,geometry_id,parent_record_id,notes
          TX:county:denton:constable_precinct:1,48,TX,county,Denton County,constable_precinct,1,Constable Precinct 1,https://www.dentoncounty.gov/232/Constable-Precinct-1,2026-08-01,high,approved,TRUE,Constable Precinct 1,,https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/5,denton-county-constable-precinct-1,,"Trevor Krueger was appointed effective May 29, 2026 after Johnny Hammons resigned. The live office page and official GIS NAME_CONST value agree; the county Elected Officials directory still lists Hammons and is preserved as a stale-source conflict. Constables have countywide peace-officer jurisdiction but are elected by precinct."
          TX:county:denton:constable_precinct:2,48,TX,county,Denton County,constable_precinct,2,Constable Precinct 2,https://www.dentoncounty.gov/233/Constable-Precinct-2,2026-08-01,high,approved,TRUE,Constable Precinct 2,,https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/5,denton-county-constable-precinct-2,,"Michael A. Truitt is the current Constable. Official Denton County GIS source field JP_C equals 2 and NAME_CONST matches the officeholder. Constables have countywide peace-officer jurisdiction but are elected by precinct."
          TX:county:denton:constable_precinct:3,48,TX,county,Denton County,constable_precinct,3,Constable Precinct 3,https://www.dentoncounty.gov/234/Constable-Precinct-3,2026-08-01,high,approved,TRUE,Constable Precinct 3,,https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/5,denton-county-constable-precinct-3,,"Dan Rochelle is the current Constable. Official Denton County GIS source field JP_C equals 3 and NAME_CONST matches the officeholder. Constables have countywide peace-officer jurisdiction but are elected by precinct."
          TX:county:denton:constable_precinct:4,48,TX,county,Denton County,constable_precinct,4,Constable Precinct 4,https://www.dentoncounty.gov/235/Constable-Precinct-4,2026-08-01,high,approved,TRUE,Constable Precinct 4,,https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/5,denton-county-constable-precinct-4,,"Danny Fletcher is the current Constable. Official Denton County GIS source field JP_C equals 4 and NAME_CONST matches the officeholder. Constables have countywide peace-officer jurisdiction but are elected by precinct."
          TX:county:denton:constable_precinct:5,48,TX,county,Denton County,constable_precinct,5,Constable Precinct 5,https://www.dentoncounty.gov/236/Constable-Precinct-5,2026-08-01,high,approved,TRUE,Constable Precinct 5,,https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/5,denton-county-constable-precinct-5,,"Doug Boydston is the current Constable. Official Denton County GIS source field JP_C equals 5 and NAME_CONST matches the officeholder. Constables have countywide peace-officer jurisdiction but are elected by precinct."
          TX:county:denton:constable_precinct:6,48,TX,county,Denton County,constable_precinct,6,Constable Precinct 6,https://www.dentoncounty.gov/237/Constable-Precinct-6,2026-08-01,high,approved,TRUE,Constable Precinct 6,,https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/5,denton-county-constable-precinct-6,,"Richard Bachus is the current Constable. Official Denton County GIS source field JP_C equals 6 and NAME_CONST matches the officeholder. Constables have countywide peace-officer jurisdiction but are elected by precinct."
          CSV
          sed -i 's/^          //' data/normalized/denton_county_constables.csv

      - name: Verify constable roster attributes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/geojson/denton_county_constable_precincts.geojson')
          payload = json.loads(path.read_text(encoding='utf-8'))
          expected = {
              '1': 'TREVOR KRUEGER',
              '2': 'MICHAEL A. TRUITT',
              '3': 'DAN ROCHELLE',
              '4': 'DANNY FLETCHER',
              '5': 'DOUG BOYDSTON',
              '6': 'RICHARD BACHUS',
          }
          found = {}
          for feature in payload.get('features', []):
              props = feature.get('properties') or {}
              district_id = str(props.get('district_id') or '')
              attrs = props.get('source_attributes') or {}
              found[district_id] = str(attrs.get('NAME_CONST') or '').strip().upper()
              if props.get('source_district_field') != 'JP_C':
                  raise SystemExit(f"Unexpected source field for precinct {district_id}: {props.get('source_district_field')!r}")
          if found != expected:
              raise SystemExit(f'Constable roster mismatch: expected {expected!r}; found {found!r}')
          print('Verified six current constable names against official GIS attributes.')
          PY

      - name: Run automated tests
        run: pytest -q

      - name: Validate normalized datasets
        run: python scripts/validate.py

      - name: Validate geometry joins
        run: python scripts/validate_geojson.py

      - name: Calculate Denton County combined canonical digest
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          paths = [
              Path('data/geojson/denton_county_countywide.geojson'),
              Path('data/geojson/denton_county_commissioner_precincts.geojson'),
              Path('data/geojson/denton_county_constable_precincts.geojson'),
          ]
          digest = hashlib.sha256()
          for path in sorted(paths, key=lambda item: item.name):
              digest.update(path.name.encode('utf-8'))
              digest.update(b'\0')
              digest.update(path.read_bytes())
              digest.update(b'\0')
          value = digest.hexdigest()
          output = Path('build/denton-county/release-sha256.txt')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(value + '\n', encoding='utf-8')
          print(f'Denton County combined canonical SHA-256: {value}')
          PY

      - name: Commit Denton County constable release files once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/denton-county/constable-precincts-1-6.geojson \
            data/geojson/denton_county_constable_precincts.geojson \
            data/normalized/denton_county_constables.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add Denton County constable precinct release files"
            git push
          fi

      - name: Upload Denton County validation check
        uses: actions/upload-artifact@v4
        with:
          name: denton-county-boundary-check
          path: |
            build/denton-county/
            data/raw/denton-county/constable-precincts-1-6.geojson
            data/geojson/denton_county_constable_precincts.geojson
            data/normalized/denton_county_constables.csv
          if-no-files-found: error
