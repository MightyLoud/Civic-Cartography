name: Validate ORCH-FAC-005 Dependency Readiness

on:
  pull_request:
    paths:
      - 'tests/fixtures/orch_fac_005_dag.json'
      - 'scripts/validate_orch_fac_005.py'
      - '.github/workflows/validate-orch-fac-005.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dependency DAG scheduling
        run: python scripts/validate_orch_fac_005.py
