name: Probe Burnet County organization web map

on:
  pull_request:
    paths:
      - ".github/workflows/probe-burnet-webmap.yml"
      - "scripts/probe_burnet_webmap.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-burnet-webmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_burnet_webmap.py
      - uses: actions/upload-artifact@v4
        with:
          name: burnet-webmap
          path: build/burnet-webmap/
          if-no-files-found: error
