name: Validate Completion Contract

on:
  pull_request:
    paths:
      - ".github/workflows/validate-completion-contract.yml"
      - "civic_cartography/completion_manifest.py"
      - "civic_cartography/completion_register.py"
      - "scripts/check_completion_manifest.py"
      - "scripts/update_completion_register.py"
      - "tests/test_completion_manifest.py"
      - "tests/test_completion_register.py"
      - "evidence/measured-batch-100/completion-register.csv"
      - "civic_cartography/fixture_harness.py"
      - "civic_cartography/target_manifest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Civic-Cartography
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate completion contract and register
        run: python -m pytest tests/test_completion_manifest.py tests/test_completion_register.py --color=yes
