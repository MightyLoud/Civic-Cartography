name: Bootstrap Kerr County source geometry

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-kerr-county.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-kerr-county:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Resolve official Kerr County GIS contract and generate geometry
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          from pathlib import Path

          SERVICE = (
              "https://services1.arcgis.com/Ijqs2ihddUy84otW/ArcGIS/rest/services/"
              "Kerr_County_Commissioner_Precincts_2022/FeatureServer"
          )
          BUILD = Path("build/kerr-county")
          BUILD.mkdir(parents=True, exist_ok=True)

          def fetch_json(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Civic-Cartography-bootstrap/1.0"},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.load(response)
              if not isinstance(payload, dict):
                  raise SystemExit(f"Expected JSON object from {url}")
              return payload

          service = fetch_json(f"{SERVICE}?f=json")
          candidates = []
          inspections = []
          for layer in service.get("layers", []):
              layer_id = int(layer["id"])
              layer_url = f"{SERVICE}/{layer_id}"
              metadata = fetch_json(f"{layer_url}?f=json")
              if metadata.get("geometryType") != "esriGeometryPolygon":
                  continue
              fields = metadata.get("fields", [])
              query = urllib.parse.urlencode(
                  {
                      "where": "1=1",
                      "outFields": "*",
                      "returnGeometry": "false",
                      "f": "json",
                  }
              )
              payload = fetch_json(f"{layer_url}/query?{query}")
              rows = [feature.get("attributes", {}) for feature in payload.get("features", [])]
              inspections.append(
                  {
                      "layer_id": layer_id,
                      "layer_name": metadata.get("name"),
                      "layer_url": layer_url,
                      "fields": fields,
                      "rows": rows,
                  }
              )
              for field in fields:
                  name = str(field.get("name") or "")
                  field_type = str(field.get("type") or "")
                  if field_type == "esriFieldTypeOID" or name.casefold() in {"objectid", "fid", "oid"}:
                      continue
                  values = []
                  for row in rows:
                      value = row.get(name)
                      if value is None or value == "":
                          continue
                      if isinstance(value, float) and value.is_integer():
                          value = int(value)
                      values.append(str(value).strip())
                  if set(values) != {"1", "2", "3", "4"}:
                      continue
                  lowered = name.casefold()
                  score = 0
                  for marker, points in (
                      ("precinct", 40),
                      ("pct", 30),
                      ("commission", 20),
                      ("district", 10),
                  ):
                      if marker in lowered:
                          score += points
                  candidates.append((score, -len(name), layer_id, name, layer_url, metadata, rows))

          if not candidates:
              Path("build/kerr-county/inspection.json").write_text(
                  json.dumps(
                      {"service": service, "inspections": inspections},
                      indent=2,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )
              raise SystemExit("No non-OID polygon field has exact district values 1-4.")

          candidates.sort(reverse=True)
          _, _, layer_id, field, layer_url, metadata, rows = candidates[0]
          contract = {
              "service_name": "Kerr_County_Commissioner_Precincts_2022",
              "service_url": SERVICE,
              "service_item_id": service.get("serviceItemId"),
              "operational_layer_id": layer_id,
              "operational_layer_name": metadata.get("name"),
              "operational_layer_url": layer_url,
              "geometry_type": metadata.get("geometryType"),
              "district_field": field,
              "district_values": ["1", "2", "3", "4"],
              "layer_fields": [item.get("name") for item in metadata.get("fields", [])],
              "source_rows": rows,
              "resolved_from_county_elections_page": True,
              "source_retrieved_at": "2026-08-02",
          }
          Path("build/kerr-county/gis-source-contract.json").write_text(
              json.dumps(contract, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(contract, indent=2, sort_keys=True))

          subprocess.run(
              [
                  "python",
                  "scripts/fetch_arcgis_districts.py",
                  "--layer-url",
                  layer_url,
                  "--district-ids",
                  "1,2,3,4",
                  "--district-field",
                  field,
                  "--district-type",
                  "commissioner_precinct",
                  "--district-name-prefix",
                  "Commissioner Precinct",
                  "--jurisdiction-name",
                  "Kerr County",
                  "--record-id-prefix",
                  "TX:county:kerr:commissioner_precinct",
                  "--geometry-id-prefix",
                  "kerr-county-commissioner-precinct",
                  "--source-agency",
                  "City of Kerrville GIS",
                  "--retrieved-at",
                  "2026-08-02",
                  "--raw-output",
                  "build/kerr-county/raw/commissioner-precincts-1-4.geojson",
                  "--output",
                  "build/kerr-county/geojson/kerr_county_commissioner_precincts.geojson",
              ],
              check=True,
          )
          subprocess.run(
              [
                  "python",
                  "scripts/fetch_tigerweb_county.py",
                  "--geoid",
                  "48265",
                  "--record-id",
                  "TX:county:kerr:countywide:COUNTYWIDE",
                  "--geometry-id",
                  "kerr-county-countywide",
                  "--retrieved-at",
                  "2026-08-02",
                  "--raw-output",
                  "build/kerr-county/raw/tigerweb-county-48265.geojson",
                  "--output",
                  "build/kerr-county/geojson/kerr_county_countywide.geojson",
              ],
              check=True,
          )
          PY

      - name: Upload Kerr County bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: kerr-county-bootstrap
          path: build/kerr-county/
          if-no-files-found: error
