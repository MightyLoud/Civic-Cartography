name: Validate ORCH-FAC-003 Bounded Batch Orchestration

on:
  pull_request:
    paths:
      - 'tests/fixtures/orch_fac_003_batches.json'
      - 'scripts/validate_orch_fac_003.py'
      - '.github/workflows/validate-orch-fac-003.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded fan-out and fan-in
        run: python scripts/validate_orch_fac_003.py
