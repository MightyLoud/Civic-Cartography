name: Validate ORCH-FAC-003 Bounded Batch Orchestration

on:
  pull_request:
    paths:
      - 'schemas/orch-fac-003-batch.schema.json'
      - 'schemas/orch-fac-003-report.schema.json'
      - 'schemas/orch-fac-002-orchestration.schema.json'
      - 'schemas/orch-fac-002-report.schema.json'
      - 'tests/fixtures/orch_fac_003_batches.json'
      - 'scripts/validate_orch_fac_001.py'
      - 'scripts/validate_orch_fac_002.py'
      - 'scripts/validate_orch_fac_003.py'
      - '.github/workflows/validate-orch-fac-003.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Validate prerequisite orchestration contracts
        run: |
          python scripts/validate_orch_fac_001.py
          python scripts/validate_orch_fac_002.py
      - name: Validate evidence-derived bounded fan-out and fan-in
        run: python scripts/validate_orch_fac_003.py
