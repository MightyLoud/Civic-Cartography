name: Validate upstream stub classification fix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/validate-upstream-stub-classification-fix.yml"
      - "patches/openstates-jurisdictions/0001-continue-jurisdiction-after-stub.patch"
      - "scripts/capture_upstream_fixtures.py"
      - "tests/fixtures/batch_pilot_25.yml"
      - "civic_cartography/fixture_harness.py"
      - "civic_cartography/target_manifest.py"

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: openstates/jurisdictions
  UPSTREAM_REVISION: 6fbe7d6aed32c3b781490c8e4c5a737bdd6e4705
  RUN_ASOF: 2026-08-02T15:00:00Z
  PATCH_PATH: patches/openstates-jurisdictions/0001-continue-jurisdiction-after-stub.patch

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out Civic-Cartography
        uses: actions/checkout@v4

      - name: Check out pinned upstream generator
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REVISION }}
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Civic-Cartography dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install upstream dependencies
        run: |
          python -m pip install uv
          cd upstream
          uv sync --frozen

      - name: Apply upstream-ready patch
        run: |
          git -C upstream apply --check "../$PATCH_PATH"
          git -C upstream apply "../$PATCH_PATH"
          git -C upstream diff --check

      - name: Run targeted upstream unit tests
        run: |
          cd upstream
          uv run pytest \
            tests/src/init_migration/test_generate_pipeline_stub_classification.py \
            --color=yes

      - name: Run upstream lint on changed Python files
        run: |
          cd upstream
          uv run ruff check \
            src/init_migration/generate_pipeline.py \
            tests/src/init_migration/test_generate_pipeline_stub_classification.py

      - name: Capture patched upstream run 1
        run: |
          upstream/.venv/bin/python scripts/capture_upstream_fixtures.py \
            --upstream-root upstream \
            --target-manifest tests/fixtures/batch_pilot_25.yml \
            --run-asof "$RUN_ASOF" \
            --source-dir build/upstream-source \
            --work-dir build/run-1 \
            --execution-results build/run-1/execution-results.json \
            --diagnostics build/run-1/diagnostics.json
          python scripts/run_target_manifest.py \
            --target-manifest tests/fixtures/batch_pilot_25.yml \
            --run-asof "$RUN_ASOF" \
            --execution-results build/run-1/execution-results.json \
            --artifact-root build/run-1/artifacts \
            --result-path build/run-1/report.json

      - name: Capture patched upstream run 2
        run: |
          upstream/.venv/bin/python scripts/capture_upstream_fixtures.py \
            --upstream-root upstream \
            --target-manifest tests/fixtures/batch_pilot_25.yml \
            --run-asof "$RUN_ASOF" \
            --source-dir build/upstream-source \
            --work-dir build/run-2 \
            --execution-results build/run-2/execution-results.json \
            --diagnostics build/run-2/diagnostics.json
          python scripts/run_target_manifest.py \
            --target-manifest tests/fixtures/batch_pilot_25.yml \
            --run-asof "$RUN_ASOF" \
            --execution-results build/run-2/execution-results.json \
            --artifact-root build/run-2/artifacts \
            --result-path build/run-2/report.json

      - name: Evaluate six-fixture gate
        id: fixture_gate
        continue-on-error: true
        run: |
          PYTHONPATH=. python scripts/check_regression_fixtures.py \
            --target-manifest tests/fixtures/batch_pilot_25.yml \
            --first-report build/run-1/report.json \
            --second-report build/run-2/report.json \
            --upstream-repository "$UPSTREAM_REPOSITORY" \
            --upstream-revision "$UPSTREAM_REVISION" \
            --result-path build/fixture-evaluation.json

      - name: Assert fix 1 behavior
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = [
              json.loads(Path("build/run-1/report.json").read_text()),
              json.loads(Path("build/run-2/report.json").read_text()),
          ]
          expected = {
              "BP25-009": "government",
              "BP25-014": "school_system",
          }
          for report in reports:
              by_id = {row["target_id"]: row for row in report["results"]}
              for target_id, classification in expected.items():
                  row = by_id[target_id]
                  assert row["jurisdiction_paths"], (
                      f"{target_id} did not continue from stub Division "
                      "to Jurisdiction generation"
                  )
                  assert row["inferred_classification"] == classification
                  assert row["classification_status"] == "matched"

              denver = by_id["BP25-022"]
              assert len(denver["jurisdiction_paths"]) == 2, (
                  "Denver county alias member did not continue through "
                  "stub classification"
              )

          evaluation = json.loads(
              Path("build/fixture-evaluation.json").read_text()
          )
          summary = evaluation["summary"]
          assert summary["deterministic_count"] == 6
          assert summary["report_content_match"] is True
          PY

      - name: Write fix summary
        if: always()
        run: |
          if [[ -f build/fixture-evaluation.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/fixture-evaluation.json").read_text())
          summary = report["summary"]
          lines = [
              "## Upstream fix 1: classify after stub Division",
              "",
              f"- Fixtures passing strict gate: **{summary['passed_count']}/{summary['fixture_count']}**",
              f"- Deterministic fixtures: **{summary['deterministic_count']}/{summary['fixture_count']}**",
              f"- Full report match: **{summary['report_content_match']}**",
              "",
              "| Fixture | Generation | Classification | Exception |",
              "|---|---|---|---|",
          ]
          for fixture in report["fixtures"]:
              lines.append(
                  f"| {fixture['jurisdiction_name']} | "
                  f"{fixture.get('generation_status')} | "
                  f"{fixture.get('inferred_classification') or ''} | "
                  f"{fixture.get('exception_class') or ''} |"
              )
          Path("fix-summary.md").write_text("\n".join(lines) + "\n")
          PY
            cat fix-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload patched capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-stub-classification-fix
          path: |
            build/upstream-source/source-manifest.json
            build/run-1/execution-results.json
            build/run-1/diagnostics.json
            build/run-1/report.json
            build/run-1/artifacts
            build/run-2/execution-results.json
            build/run-2/diagnostics.json
            build/run-2/report.json
            build/run-2/artifacts
            build/fixture-evaluation.json
            fix-summary.md
          if-no-files-found: warn
