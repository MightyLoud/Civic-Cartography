name: Bootstrap Bexar County Commissioners Court

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap-bexar-county:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch current Bexar County Commissioner precincts
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url https://maps.bexar.org/arcgis/rest/services/CommissionerPrecincts/MapServer/0 \
            --district-ids 1,2,3,4 \
            --district-field Comm \
            --district-type commissioner_precinct \
            --district-name-prefix "Commissioner Precinct" \
            --jurisdiction-name "Bexar County" \
            --record-id-prefix TX:county:bexar:commissioner_precinct \
            --geometry-id-prefix bexar-county-commissioner-precinct \
            --source-agency "Bexar County GIS" \
            --retrieved-at 2026-08-02 \
            --raw-output build/bexar-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --output build/bexar-county/precincts/geojson/bexar_county_commissioner_precincts.geojson

      - name: Inspect Bexar County live precinct attributes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/bexar-county/precincts/raw/commissioner-precincts-1-4.geojson')
          payload = json.loads(path.read_text(encoding='utf-8'))
          found = {}
          for feature in payload['features']:
              props = feature.get('properties') or {}
              found[str(props.get('Comm'))] = {
                  'ComName': props.get('ComName'),
                  'Website': props.get('Website'),
              }
          if set(found) != {'1', '2', '3', '4'}:
              raise SystemExit(f'Unexpected Bexar County precinct IDs: {found!r}')
          output = Path('build/bexar-county/live-attributes.json')
          output.write_text(json.dumps(found, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(found, indent=2, sort_keys=True))
          PY

      - name: Fetch current Bexar County boundary
        run: |
          python scripts/fetch_tigerweb_county.py \
            --geoid 48029 \
            --record-id TX:county:bexar:countywide:COUNTYWIDE \
            --geometry-id bexar-county-countywide \
            --retrieved-at 2026-08-02 \
            --raw-output build/bexar-county/county/raw/tigerweb-county-48029.geojson \
            --output build/bexar-county/county/geojson/bexar_county_countywide.geojson

      - name: Commit generated Bexar County snapshots
        if: github.event_name == 'push'
        run: |
          mkdir -p data/raw/bexar-county data/geojson
          cp build/bexar-county/county/raw/tigerweb-county-48029.geojson data/raw/bexar-county/tigerweb-county-48029.geojson
          cp build/bexar-county/county/geojson/bexar_county_countywide.geojson data/geojson/bexar_county_countywide.geojson
          cp build/bexar-county/precincts/raw/commissioner-precincts-1-4.geojson data/raw/bexar-county/commissioner-precincts-1-4.geojson
          cp build/bexar-county/precincts/geojson/bexar_county_commissioner_precincts.geojson data/geojson/bexar_county_commissioner_precincts.geojson
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/raw/bexar-county/tigerweb-county-48029.geojson \
            data/raw/bexar-county/commissioner-precincts-1-4.geojson \
            data/geojson/bexar_county_countywide.geojson \
            data/geojson/bexar_county_commissioner_precincts.geojson
          if git diff --cached --quiet; then
            echo "Bexar County snapshots already match generated output."
            exit 0
          fi
          git commit -m "Add Bexar County source snapshots"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload Bexar County bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: bexar-county-bootstrap
          path: build/bexar-county/
          if-no-files-found: error
