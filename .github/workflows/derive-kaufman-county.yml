name: Derive Kaufman County Commissioner geometry

on:
  pull_request:
    paths:
      - "scripts/derive_kaufman_commissioner_precincts.py"
      - ".github/workflows/derive-kaufman-county.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive-kaufman-county:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install derivation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install pyshp shapely pyproj pillow

      - name: Derive Commissioner precincts from official map and TLC precincts
        run: |
          python scripts/derive_kaufman_commissioner_precincts.py \
            --retrieved-at 2026-08-02 \
            --work-dir build/kaufman-county/work \
            --raw-output build/kaufman-county/raw/commissioner-precincts-1-4.geojson \
            --output build/kaufman-county/geojson/kaufman_county_commissioner_precincts.geojson \
            --contract-output build/kaufman-county/gis-source-contract.json \
            --evidence-output build/kaufman-county/derivation-evidence.json

      - name: Fetch current Kaufman County boundary
        run: |
          python scripts/fetch_tigerweb_county.py \
            --geoid 48257 \
            --record-id TX:county:kaufman:countywide:COUNTYWIDE \
            --geometry-id kaufman-county-countywide \
            --retrieved-at 2026-08-02 \
            --raw-output build/kaufman-county/raw/tigerweb-county-48257.geojson \
            --output build/kaufman-county/geojson/kaufman_county_countywide.geojson

      - uses: actions/upload-artifact@v4
        with:
          name: kaufman-county-derived-geometry
          path: build/kaufman-county/
          if-no-files-found: error
