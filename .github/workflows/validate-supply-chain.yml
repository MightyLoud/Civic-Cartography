name: Validate LIC-G5 supply-chain controls

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "requirements-dev.txt"
      - "requirements-dev.lock"
      - "THIRD_PARTY_NOTICES.md"
      - "sbom.cdx.json"
      - "scripts/validate_supply_chain.py"
  push:
    paths:
      - ".github/workflows/**"
      - "requirements-dev.txt"
      - "requirements-dev.lock"
      - "THIRD_PARTY_NOTICES.md"
      - "sbom.cdx.json"
      - "scripts/validate_supply_chain.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify pinned actions, hashed dependencies, SBOM, and notices
        run: python scripts/validate_supply_chain.py
