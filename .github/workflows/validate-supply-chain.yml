name: Validate LIC-G5 supply-chain controls

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "requirements-dev.txt"
      - "requirements-dev.lock"
      - "THIRD_PARTY_NOTICES.md"
      - "sbom.cdx.json"
      - "**/*.py"
      - "scripts/build_supply_chain_artifacts.py"
      - "scripts/validate_supply_chain.py"
  push:
    paths:
      - ".github/workflows/**"
      - "requirements-dev.txt"
      - "requirements-dev.lock"
      - "THIRD_PARTY_NOTICES.md"
      - "sbom.cdx.json"
      - "**/*.py"
      - "scripts/build_supply_chain_artifacts.py"
      - "scripts/validate_supply_chain.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install exact locked environment
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify deterministic SBOM and retained controls
        run: |
          python scripts/build_supply_chain_artifacts.py --check
          python scripts/validate_supply_chain.py
