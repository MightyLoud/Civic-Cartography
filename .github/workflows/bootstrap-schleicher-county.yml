name: Bootstrap Schleicher County geometry

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-schleicher-county.yml"
      - "scripts/bootstrap_schleicher_geometry.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-schleicher-county:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install map dependencies
        run: python -m pip install pymupdf pyshp pyproj shapely
      - name: Download and inspect official sources
        run: python scripts/bootstrap_schleicher_geometry.py
      - uses: actions/upload-artifact@v4
        with:
          name: schleicher-county-bootstrap
          path: build/schleicher-county-bootstrap/
          if-no-files-found: error
