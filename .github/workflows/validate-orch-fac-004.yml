name: Validate ORCH-FAC-004 Retry Recovery Idempotency

on:
  pull_request:
    paths:
      - 'schemas/orch-fac-004-recovery.schema.json'
      - 'schemas/orch-fac-004-report.schema.json'
      - 'tests/fixtures/orch_fac_004_recovery.json'
      - 'scripts/validate_orch_fac_001.py'
      - 'scripts/validate_orch_fac_002.py'
      - 'scripts/validate_orch_fac_003.py'
      - 'scripts/validate_orch_fac_004.py'
      - '.github/workflows/validate-orch-fac-004.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Validate prerequisite orchestration contracts
        run: |
          python scripts/validate_orch_fac_001.py
          python scripts/validate_orch_fac_002.py
          python scripts/validate_orch_fac_003.py
      - name: Validate evidence-derived retry recovery and idempotency
        run: python scripts/validate_orch_fac_004.py
