name: Validate Bexar County Commissioners Court

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-bexar-county:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Fetch current Bexar County Commissioner precincts
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url https://maps.bexar.org/arcgis/rest/services/CommissionerPrecincts/MapServer/0 \
            --district-ids 1,2,3,4 \
            --district-field Comm \
            --district-type commissioner_precinct \
            --district-name-prefix "Commissioner Precinct" \
            --jurisdiction-name "Bexar County" \
            --record-id-prefix TX:county:bexar:commissioner_precinct \
            --geometry-id-prefix bexar-county-commissioner-precinct \
            --source-agency "Bexar County GIS" \
            --retrieved-at 2026-08-02 \
            --raw-output build/bexar-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --output build/bexar-county/precincts/geojson/bexar_county_commissioner_precincts.geojson

      - name: Validate current Bexar County GIS roster attributes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path('build/bexar-county/precincts/raw/commissioner-precincts-1-4.geojson').read_text(encoding='utf-8')
          )
          expected_names = {
              '1': 'Rebeca Clay-Flores',
              '2': 'Justin Rodriguez',
              '3': 'Grant Moody',
              '4': 'Tommy Calvert Jr.',
          }
          expected_websites = {
              key: f'https://www.bexar.org/commissionerpct{key}' for key in expected_names
          }
          names = {}
          websites = {}
          for feature in payload['features']:
              props = feature.get('properties') or {}
              district_id = str(props.get('Comm'))
              names[district_id] = props.get('ComName')
              websites[district_id] = props.get('Website')
          if names != expected_names:
              raise SystemExit(f'Bexar County GIS ComName mismatch: expected {expected_names!r}; found {names!r}')
          if websites != expected_websites:
              raise SystemExit(f'Bexar County GIS Website mismatch: expected {expected_websites!r}; found {websites!r}')
          print('Bexar County live GIS roster attributes match the release contract.')
          PY

      - name: Fetch current Bexar County boundary
        run: |
          for attempt in 1 2 3 4 5; do
            rm -rf build/bexar-county/county
            if python scripts/fetch_tigerweb_county.py \
              --geoid 48029 \
              --record-id TX:county:bexar:countywide:COUNTYWIDE \
              --geometry-id bexar-county-countywide \
              --retrieved-at 2026-08-02 \
              --raw-output build/bexar-county/county/raw/tigerweb-county-48029.geojson \
              --output build/bexar-county/county/geojson/bexar_county_countywide.geojson; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Verify committed Bexar County boundary matches Census
        run: |
          python scripts/compare_tigerweb_snapshot.py \
            --committed-raw data/raw/bexar-county/tigerweb-county-48029.geojson \
            --fresh-raw build/bexar-county/county/raw/tigerweb-county-48029.geojson \
            --committed-canonical data/geojson/bexar_county_countywide.geojson \
            --fresh-canonical build/bexar-county/county/geojson/bexar_county_countywide.geojson

      - name: Verify committed Bexar County precincts match GIS
        run: |
          python scripts/compare_arcgis_district_snapshot.py \
            --committed-raw data/raw/bexar-county/commissioner-precincts-1-4.geojson \
            --fresh-raw build/bexar-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --committed-canonical data/geojson/bexar_county_commissioner_precincts.geojson \
            --fresh-canonical build/bexar-county/precincts/geojson/bexar_county_commissioner_precincts.geojson

      - name: Run automated tests
        run: pytest -q

      - name: Validate normalized datasets
        run: python scripts/validate.py

      - name: Validate geometry joins
        run: python scripts/validate_geojson.py

      - name: Calculate Bexar County combined canonical digest
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          paths = [
              Path('data/geojson/bexar_county_countywide.geojson'),
              Path('data/geojson/bexar_county_commissioner_precincts.geojson'),
          ]
          digest = hashlib.sha256()
          for path in sorted(paths, key=lambda item: item.name):
              digest.update(path.name.encode('utf-8'))
              digest.update(b'\0')
              digest.update(path.read_bytes())
              digest.update(b'\0')
          value = digest.hexdigest()
          output = Path('build/bexar-county/release-sha256.txt')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(value + '\n', encoding='utf-8')
          print(f'Bexar County combined canonical SHA-256: {value}')
          PY

      - name: Upload Bexar County validation check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bexar-county-validation
          path: build/bexar-county/
          if-no-files-found: error
