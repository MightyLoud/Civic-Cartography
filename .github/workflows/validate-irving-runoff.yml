name: Validate Irving runoff proof

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate-irving:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Generate verified Irving District 3 release geometry
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url https://services3.arcgis.com/OfsJXUlu8pSkbl7B/arcgis/rest/services/CityCouncilDistricts2022/FeatureServer/0 \
            --district-ids 3 \
            --district-field DISTRICTID \
            --jurisdiction-name "City of Irving" \
            --record-id-prefix TX:municipality:irving:district \
            --geometry-id-prefix irving-district \
            --source-agency "City of Irving" \
            --retrieved-at 2026-08-01 \
            --raw-output data/raw/irving/city-council-district-3.geojson \
            --output data/geojson/irving_district_3.geojson

      - name: Create runoff-aware normalized record
        run: |
          mkdir -p data/normalized
          cat > data/normalized/irving_district_3_2026.csv <<'CSV'
          record_id,state_fips,state_abbr,jurisdiction_type,jurisdiction_name,district_type,district_id,district_name,source_url,source_retrieved_at,source_confidence,qa_status,parity_ok,office_name,election_date,geometry_source_url,geometry_id,parent_record_id,notes
          TX:municipality:irving:district:3,48,TX,municipality,City of Irving,district,3,District 3,https://irvingtx.gov/elections,2026-08-01,high,approved,TRUE,City Council District 3,2026-06-13,https://services3.arcgis.com/OfsJXUlu8pSkbl7B/arcgis/rest/services/CityCouncilDistricts2022/FeatureServer/0,irving-district-3,,"Two-stage election: May 2 general had Abdul Khabeer 35.02 percent, Kejal Patel 32.58 percent, and Tammam Alwan 32.40 percent; Khabeer and Patel advanced. June 13 runoff elected Abdul Khabeer 54.85 percent to 45.15 percent. Five candidate-stage evidence rows are preserved separately."
          CSV
          sed -i 's/^          //' data/normalized/irving_district_3_2026.csv

      - name: Run automated tests
        run: pytest -q

      - name: Validate normalized datasets
        run: python scripts/validate.py

      - name: Validate geometry joins
        run: python scripts/validate_geojson.py

      - name: Commit Irving release files once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/irving/city-council-district-3.geojson \
            data/geojson/irving_district_3.geojson \
            data/normalized/irving_district_3_2026.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add Irving District 3 runoff release files"
            git push
          fi
