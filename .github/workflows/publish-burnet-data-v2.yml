name: Activate Burnet County data publisher

# Registered branch publisher; this update activates the existing push trigger.
on:
  push:
    branches:
      - agent/burnet-county-dual-prosecutor
    paths:
      - ".github/workflows/publish-burnet-data-v2.yml"
      - ".release/burnet-text-package.tar.gz"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-burnet-data:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/burnet-county-dual-prosecutor
          fetch-depth: 0
      - name: Download validated geometry artifact
        run: |
          rm -rf /tmp/burnet-derived
          mkdir -p /tmp/burnet-derived
          gh run download 30820583252 \
            --repo "$GITHUB_REPOSITORY" \
            --name burnet-county-derived-geometry \
            --dir /tmp/burnet-derived
      - name: Expand permanent text package
        run: tar -xzf .release/burnet-text-package.tar.gz -C .
      - name: Promote exact geometry snapshots
        run: |
          mkdir -p data/raw/burnet-county data/geojson
          cp /tmp/burnet-derived/raw/commissioner-precincts-1-4.geojson data/raw/burnet-county/commissioner-precincts-1-4.geojson
          cp /tmp/burnet-derived/raw/tigerweb-county-48053.geojson data/raw/burnet-county/tigerweb-county-48053.geojson
          cp /tmp/burnet-derived/raw/district-attorney-component-counties.geojson data/raw/burnet-county/district-attorney-component-counties.geojson
          cp /tmp/burnet-derived/gis-source-contract.json data/raw/burnet-county/gis-source-contract.json
          cp /tmp/burnet-derived/district-attorney-service-area-contract.json data/raw/burnet-county/district-attorney-service-area-contract.json
          cp /tmp/burnet-derived/geojson/burnet_county_commissioner_precincts.geojson data/geojson/burnet_county_commissioner_precincts.geojson
          cp /tmp/burnet-derived/geojson/burnet_county_countywide.geojson data/geojson/burnet_county_countywide.geojson
          cp /tmp/burnet-derived/geojson/burnet_33rd_424th_district_attorney_service_area.geojson data/geojson/burnet_33rd_424th_district_attorney_service_area.geojson
      - name: Remove discovery material and publish
        run: |
          git rm -f --ignore-unmatch \
            .release/burnet-text-package.tar.gz \
            scripts/discover_burnet_arcgis.py \
            scripts/probe_burnet_arcgis_index.py \
            scripts/probe_burnet_webmap.py \
            scripts/probe_burnet_precinct_layer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs scripts tests
          git diff --cached --check
          git commit -m "Add Burnet County separate prosecutor release"
          git push origin HEAD:agent/burnet-county-dual-prosecutor
