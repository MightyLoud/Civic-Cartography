name: Validate Production Batch WA Wave E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/validate-production-batch-wa-wave-e.yml"
      - "scripts/run_production_batch_wa_wave_d_ci.sh"
      - "scripts/select_production_wave.py"
      - "scripts/check_production_wave.py"
      - "scripts/inventory_production_artifacts.py"
      - "scripts/run_batch_pilot_25_ci.sh"
      - "scripts/capture_upstream_fixtures.py"
      - "scripts/capture_upstream_batch.py"
      - "scripts/capture_upstream_batch_with_overrides.py"
      - "scripts/run_target_manifest.py"
      - "scripts/normalize_capture_acceptance.py"
      - "scripts/normalize_canonical_alias_acceptance.py"
      - "civic_cartography/production_wave.py"
      - "civic_cartography/production_rollup.py"
      - "civic_cartography/target_manifest.py"
      - "civic_cartography/batch_acceptance.py"
      - "schemas/production-artifact-inventory.schema.json"
      - "schemas/production-wave-report.schema.json"
      - "schemas/production-batch-rollup.schema.json"
      - "schemas/target-manifest.schema.json"
      - "schemas/target-result-report.schema.json"
      - "tests/fixtures/production_batch_wa_100.yml"
      - "tests/fixtures/batch_pilot_25.yml"
      - "tests/test_production_wave.py"
      - "tests/test_production_batch_rollup.py"
      - "tests/test_production_batch_wa_100_selection.py"
      - "docs/production-batch-wa-wave-e.md"
      - "docs/production-batch-wa-100-closeout.md"
      - "data/authoritative_jurisdiction_overrides.yml"
      - "data/canonical_alias_groups.yml"
      - "evidence/production-batch-wa-100/selection/selection-crosswalk.json"
      - "evidence/production-batch-wa-100/wave-e/**"
      - "evidence/production-batch-wa-100/closeout/**"
      - "scripts/check_production_batch_wa_100.py"
      - "patches/openstates-jurisdictions/0001-continue-jurisdiction-after-stub.patch"
      - "patches/openstates-jurisdictions/0002-normalize-blank-lsad-before-classification.patch"
      - "patches/openstates-jurisdictions/0003-authoritative-jurisdiction-overrides.patch"
      - "patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch"

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: openstates/jurisdictions
  UPSTREAM_REVISION: 6fbe7d6aed32c3b781490c8e4c5a737bdd6e4705
  RUN_ASOF: 2026-08-04T15:00:00Z
  PATCH_1: patches/openstates-jurisdictions/0001-continue-jurisdiction-after-stub.patch
  PATCH_2: patches/openstates-jurisdictions/0002-normalize-blank-lsad-before-classification.patch
  PATCH_3: patches/openstates-jurisdictions/0003-authoritative-jurisdiction-overrides.patch
  PATCH_4: patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch
  OVERRIDE_REGISTRY: data/authoritative_jurisdiction_overrides.yml
  ALIAS_REGISTRY: data/canonical_alias_groups.yml

jobs:
  wave-e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out Civic-Cartography
        uses: actions/checkout@v4

      - name: Check out pinned upstream generator
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REVISION }}
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Civic-Cartography test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run and enforce WA-PB01-E
        run: bash scripts/run_production_batch_wa_wave_e_ci.sh

      - name: Upload WA-PB01-E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wa-pb01-wave-e-acceptance
          path: |
            build/wa-pb01-wave-e-manifest.yml
            build/upstream-source/source-manifest.json
            build/run-1/execution-results.json
            build/run-1/diagnostics.json
            build/run-1/report.json
            build/run-1/artifact-inventory.json
            build/run-1/artifacts
            build/run-2/execution-results.json
            build/run-2/diagnostics.json
            build/run-2/report.json
            build/run-2/artifact-inventory.json
            build/run-2/artifacts
            build/wa-pb01-wave-e-acceptance.json
            wa-pb01-wave-e-summary.md
          if-no-files-found: warn
  batch-pilot-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out Civic-Cartography
        uses: actions/checkout@v4

      - name: Check out pinned upstream generator
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REVISION }}
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Civic-Cartography test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run frozen Batch Pilot 25 regression
        run: bash scripts/run_batch_pilot_25_ci.sh

      - name: Upload frozen Batch Pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wa-pb01-wave-e-batch-pilot-25-regression
          path: |
            build/upstream-source/source-manifest.json
            build/run-1/report.json
            build/run-2/report.json
            build/batch-acceptance.json
            batch-pilot-summary.md
          if-no-files-found: warn
