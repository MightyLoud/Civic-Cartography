name: Validate Travis County transfer proof

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-travis-county:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch current Travis County boundary
        run: |
          python scripts/fetch_tigerweb_county.py \
            --geoid 48453 \
            --record-id TX:county:travis:countywide:COUNTYWIDE \
            --geometry-id travis-county-countywide \
            --retrieved-at 2026-08-02 \
            --raw-output build/travis-county/county/raw/tigerweb-county-48453.geojson \
            --output build/travis-county/county/geojson/travis_county_countywide.geojson

      - name: Fetch current Travis County commissioner precincts
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url https://gis.traviscountytx.gov/server1/rest/services/Boundaries_and_Jurisdictions/Travis_County_Commissioner_Precincts/MapServer/0 \
            --district-ids 1,2,3,4 \
            --district-field PRECINCT \
            --district-type commissioner_precinct \
            --district-name-prefix "Commissioner Precinct" \
            --jurisdiction-name "Travis County" \
            --record-id-prefix TX:county:travis:commissioner_precinct \
            --geometry-id-prefix travis-county-commissioner-precinct \
            --source-agency "Travis County GIS" \
            --retrieved-at 2026-08-02 \
            --raw-output build/travis-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --output build/travis-county/precincts/geojson/travis_county_commissioner_precincts.geojson

      - name: Verify Travis County build contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          county = json.loads(Path('build/travis-county/county/geojson/travis_county_countywide.geojson').read_text())
          precincts = json.loads(Path('build/travis-county/precincts/geojson/travis_county_commissioner_precincts.geojson').read_text())

          if len(county.get('features', [])) != 1:
              raise SystemExit('Expected exactly one Travis County feature')
          features = precincts.get('features', [])
          if len(features) != 4:
              raise SystemExit(f'Expected four commissioner precincts, found {len(features)}')
          ids = sorted(str((feature.get('properties') or {}).get('district_id')) for feature in features)
          if ids != ['1', '2', '3', '4']:
              raise SystemExit(f'Unexpected precinct IDs: {ids!r}')

          found = {}
          for feature in features:
              props = feature.get('properties') or {}
              district_id = str(props.get('district_id') or '')
              attrs = props.get('source_attributes') or {}
              if props.get('source_district_field') != 'PRECINCT':
                  raise SystemExit(f"Unexpected source field: {props.get('source_district_field')!r}")
              commissioner = str(attrs.get('COMMISSIONER') or '').strip()
              if not commissioner:
                  raise SystemExit(f'Blank COMMISSIONER attribute for precinct {district_id}')
              found[district_id] = commissioner
          print(f'Live Travis County commissioner attributes: {found!r}')
          PY

      - name: Run automated tests
        run: pytest -q

      - name: Validate released normalized datasets
        run: python scripts/validate.py

      - name: Validate released geometry joins
        run: python scripts/validate_geojson.py

      - name: Upload Travis County build check
        uses: actions/upload-artifact@v4
        with:
          name: travis-county-boundary-check
          path: build/travis-county/
          if-no-files-found: error
