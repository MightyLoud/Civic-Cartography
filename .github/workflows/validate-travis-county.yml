name: Validate Travis County transfer proof

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-travis-county:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch current Travis County boundary
        run: |
          python scripts/fetch_tigerweb_county.py \
            --geoid 48453 \
            --record-id TX:county:travis:countywide:COUNTYWIDE \
            --geometry-id travis-county-countywide \
            --retrieved-at 2026-08-02 \
            --raw-output build/travis-county/county/raw/tigerweb-county-48453.geojson \
            --output build/travis-county/county/geojson/travis_county_countywide.geojson

      - name: Verify committed Travis County boundary matches Census
        run: |
          python scripts/compare_tigerweb_snapshot.py \
            --committed-raw data/raw/travis-county/tigerweb-county-48453.geojson \
            --fresh-raw build/travis-county/county/raw/tigerweb-county-48453.geojson \
            --committed-canonical data/geojson/travis_county_countywide.geojson \
            --fresh-canonical build/travis-county/county/geojson/travis_county_countywide.geojson

      - name: Fetch current simplified Travis County commissioner precincts
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url https://gis.traviscountytx.gov/server1/rest/services/Boundaries_and_Jurisdictions/Admin_Boundaries_Simple/MapServer/0 \
            --district-ids 1,2,3,4 \
            --district-field PRECINCT \
            --district-type commissioner_precinct \
            --district-name-prefix "Commissioner Precinct" \
            --jurisdiction-name "Travis County" \
            --record-id-prefix TX:county:travis:commissioner_precinct \
            --geometry-id-prefix travis-county-commissioner-precinct \
            --source-agency "Travis County GIS" \
            --retrieved-at 2026-08-02 \
            --out-fields PRECINCT,COMMISSIONER \
            --geometry-precision 6 \
            --response-format esri-json \
            --raw-output build/travis-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --output build/travis-county/precincts/geojson/travis_county_commissioner_precincts.geojson

      - name: Verify committed Travis County precincts match official GIS
        run: |
          python scripts/compare_arcgis_district_snapshot.py \
            --committed-raw data/raw/travis-county/commissioner-precincts-1-4.geojson \
            --fresh-raw build/travis-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --committed-canonical data/geojson/travis_county_commissioner_precincts.geojson \
            --fresh-canonical build/travis-county/precincts/geojson/travis_county_commissioner_precincts.geojson

      - name: Verify current Travis County commissioner attributes
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def normalize(value):
              return re.sub(r'[^A-Z0-9]', '', str(value or '').upper())

          payload = json.loads(Path('build/travis-county/precincts/geojson/travis_county_commissioner_precincts.geojson').read_text())
          expected = {
              '1': normalize('Jeff Travillion'),
              '2': normalize('Brigid Shea'),
              '3': normalize('Ann Howard'),
              '4': normalize('George Morales'),
          }
          found = {}
          for feature in payload.get('features', []):
              props = feature.get('properties') or {}
              district_id = str(props.get('district_id') or '')
              attrs = props.get('source_attributes') or {}
              found[district_id] = normalize(attrs.get('COMMISSIONER'))
              if props.get('source_district_field') != 'PRECINCT':
                  raise SystemExit(f"Unexpected source field for precinct {district_id}: {props.get('source_district_field')!r}")
          if found != expected:
              raise SystemExit(f'Commissioner roster mismatch: expected {expected!r}; found {found!r}')
          print('Verified four current Travis County commissioner attributes.')
          PY

      - name: Run automated tests
        run: pytest -q

      - name: Validate normalized datasets
        run: python scripts/validate.py

      - name: Validate geometry joins
        run: python scripts/validate_geojson.py

      - name: Calculate Travis County combined canonical digest
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          paths = [
              Path('data/geojson/travis_county_countywide.geojson'),
              Path('data/geojson/travis_county_commissioner_precincts.geojson'),
          ]
          digest = hashlib.sha256()
          for path in sorted(paths, key=lambda item: item.name):
              digest.update(path.name.encode('utf-8'))
              digest.update(b'\0')
              digest.update(path.read_bytes())
              digest.update(b'\0')
          value = digest.hexdigest()
          output = Path('build/travis-county/release-sha256.txt')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(value + '\n', encoding='utf-8')
          print(f'Travis County combined canonical SHA-256: {value}')
          PY

      - name: Upload Travis County validation check
        uses: actions/upload-artifact@v4
        with:
          name: travis-county-boundary-check
          path: build/travis-county/
          if-no-files-found: error
