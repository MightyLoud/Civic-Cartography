name: Validate Travis County transfer proof

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate-travis-county:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Generate Travis County release geometry
        run: |
          python scripts/fetch_tigerweb_county.py \
            --geoid 48453 \
            --record-id TX:county:travis:countywide:COUNTYWIDE \
            --geometry-id travis-county-countywide \
            --retrieved-at 2026-08-02 \
            --raw-output data/raw/travis-county/tigerweb-county-48453.geojson \
            --output data/geojson/travis_county_countywide.geojson

          python scripts/fetch_arcgis_districts.py \
            --layer-url https://gis.traviscountytx.gov/server1/rest/services/Boundaries_and_Jurisdictions/Admin_Boundaries_Simple/MapServer/0 \
            --district-ids 1,2,3,4 \
            --district-field PRECINCT \
            --district-type commissioner_precinct \
            --district-name-prefix "Commissioner Precinct" \
            --jurisdiction-name "Travis County" \
            --record-id-prefix TX:county:travis:commissioner_precinct \
            --geometry-id-prefix travis-county-commissioner-precinct \
            --source-agency "Travis County GIS" \
            --retrieved-at 2026-08-02 \
            --out-fields PRECINCT,COMMISSIONER \
            --geometry-precision 6 \
            --response-format esri-json \
            --raw-output data/raw/travis-county/commissioner-precincts-1-4.geojson \
            --output data/geojson/travis_county_commissioner_precincts.geojson

      - name: Create Travis County normalized records
        run: |
          mkdir -p data/normalized
          cat > data/normalized/travis_county_commissioners_court.csv <<'CSV'
          record_id,state_fips,state_abbr,jurisdiction_type,jurisdiction_name,district_type,district_id,district_name,source_url,source_retrieved_at,source_confidence,qa_status,parity_ok,office_name,election_date,geometry_source_url,geometry_id,parent_record_id,notes
          TX:county:travis:countywide:COUNTYWIDE,48,TX,county,Travis County,countywide,COUNTYWIDE,Countywide,https://www.traviscountytx.gov/commissioners-court/county-judge,2026-08-02,high,approved,TRUE,County Judge,,https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Current/MapServer/82,travis-county-countywide,,"Andy Brown is the current County Judge and represents Travis County countywide. Census GEOID 48453."
          TX:county:travis:commissioner_precinct:1,48,TX,county,Travis County,commissioner_precinct,1,Commissioner Precinct 1,https://www.traviscountytx.gov/commissioners-court/precinct-one,2026-08-02,high,approved,TRUE,County Commissioner Precinct 1,,https://gis.traviscountytx.gov/server1/rest/services/Boundaries_and_Jurisdictions/Admin_Boundaries_Simple/MapServer/0,travis-county-commissioner-precinct-1,,"Jeff Travillion is the current Precinct 1 Commissioner. Official simplified GIS field PRECINCT equals 1 and live COMMISSIONER attributes match."
          TX:county:travis:commissioner_precinct:2,48,TX,county,Travis County,commissioner_precinct,2,Commissioner Precinct 2,https://www.traviscountytx.gov/commissioners-court/precinct-two,2026-08-02,high,approved,TRUE,County Commissioner Precinct 2,,https://gis.traviscountytx.gov/server1/rest/services/Boundaries_and_Jurisdictions/Admin_Boundaries_Simple/MapServer/0,travis-county-commissioner-precinct-2,,"Brigid Shea is the current Precinct 2 Commissioner. Official simplified GIS field PRECINCT equals 2 and live COMMISSIONER attributes match."
          TX:county:travis:commissioner_precinct:3,48,TX,county,Travis County,commissioner_precinct,3,Commissioner Precinct 3,https://www.traviscountytx.gov/commissioners-court/precinct-three,2026-08-02,high,approved,TRUE,County Commissioner Precinct 3,,https://gis.traviscountytx.gov/server1/rest/services/Boundaries_and_Jurisdictions/Admin_Boundaries_Simple/MapServer/0,travis-county-commissioner-precinct-3,,"Ann Howard is the current Precinct 3 Commissioner. Official simplified GIS field PRECINCT equals 3 and live COMMISSIONER attributes match."
          TX:county:travis:commissioner_precinct:4,48,TX,county,Travis County,commissioner_precinct,4,Commissioner Precinct 4,https://www.traviscountytx.gov/commissioners-court/precinct-four,2026-08-02,high,approved,TRUE,County Commissioner Precinct 4,,https://gis.traviscountytx.gov/server1/rest/services/Boundaries_and_Jurisdictions/Admin_Boundaries_Simple/MapServer/0,travis-county-commissioner-precinct-4,,"George Morales is the current Precinct 4 Commissioner. Live office pages, current directory, detailed GIS metadata, and simplified feature attributes agree; stale Margaret Gomez directory and renderer records remain preserved in the source manifest."
          CSV
          sed -i 's/^          //' data/normalized/travis_county_commissioners_court.csv

      - name: Verify Travis County release contract
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def normalize(value):
              return re.sub(r'[^A-Z0-9]', '', str(value or '').upper())

          county = json.loads(Path('data/geojson/travis_county_countywide.geojson').read_text())
          precincts = json.loads(Path('data/geojson/travis_county_commissioner_precincts.geojson').read_text())
          expected = {
              '1': normalize('Jeff Travillion'),
              '2': normalize('Brigid Shea'),
              '3': normalize('Ann Howard'),
              '4': normalize('George Morales'),
          }
          if len(county.get('features', [])) != 1:
              raise SystemExit('Expected exactly one Travis County feature')
          features = precincts.get('features', [])
          if len(features) != 4:
              raise SystemExit(f'Expected four commissioner precincts, found {len(features)}')
          found = {}
          for feature in features:
              props = feature.get('properties') or {}
              district_id = str(props.get('district_id') or '')
              attrs = props.get('source_attributes') or {}
              if props.get('source_district_field') != 'PRECINCT':
                  raise SystemExit(f"Unexpected source field: {props.get('source_district_field')!r}")
              found[district_id] = normalize(attrs.get('COMMISSIONER'))
          if found != expected:
              raise SystemExit(f'Commissioner roster mismatch: expected {expected!r}; found {found!r}')
          print('Verified one county feature and four current Travis County commissioner precincts.')
          PY

      - name: Run automated tests
        run: pytest -q

      - name: Validate normalized datasets
        run: python scripts/validate.py

      - name: Validate geometry joins
        run: python scripts/validate_geojson.py

      - name: Commit Travis County release files once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/travis-county/tigerweb-county-48453.geojson \
            data/raw/travis-county/commissioner-precincts-1-4.geojson \
            data/geojson/travis_county_countywide.geojson \
            data/geojson/travis_county_commissioner_precincts.geojson \
            data/normalized/travis_county_commissioners_court.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add Travis County Commissioners Court release files"
            git push
          fi

      - name: Upload Travis County release check
        uses: actions/upload-artifact@v4
        with:
          name: travis-county-boundary-check
          path: |
            data/raw/travis-county/tigerweb-county-48453.geojson
            data/raw/travis-county/commissioner-precincts-1-4.geojson
            data/geojson/travis_county_countywide.geojson
            data/geojson/travis_county_commissioner_precincts.geojson
            data/normalized/travis_county_commissioners_court.csv
          if-no-files-found: error
