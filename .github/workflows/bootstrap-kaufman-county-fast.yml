name: Bootstrap Kaufman County source geometry fast

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-kaufman-county-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-kaufman-county-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve app graph and generate official geometry
        run: |
          python - <<'PY'
          import json, re, subprocess, urllib.parse, urllib.request
          from collections import deque
          from pathlib import Path

          PORTAL = "https://gis.kaufmancounty.net/portal/sharing/rest"
          APP = "da2d7bb2339b4c67bfe382fc24bb775a"
          ID_RE = re.compile(r"(?<![0-9a-fA-F])([0-9a-fA-F]{32})(?![0-9a-fA-F])")
          URL_RE = re.compile(r"https?://[^\"'\\\s]+?/(?:FeatureServer|MapServer)(?:/\d+)?", re.I)
          build = Path("build/kaufman-county")
          build.mkdir(parents=True, exist_ok=True)

          def get(url, timeout=20):
              req = urllib.request.Request(url, headers={"User-Agent": "Civic-Cartography/1.0"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  value = json.load(r)
              return value if isinstance(value, dict) else {}

          def item(item_id, suffix=""):
              return get(f"{PORTAL}/content/items/{item_id}{suffix}?f=json")

          app_meta = item(APP)
          if app_meta.get("id", "").lower() != APP:
              raise SystemExit(f"Official app item unavailable: {app_meta!r}")

          q = deque([(APP, 0)])
          seen = set()
          graph = {}
          roots = set()
          while q and len(seen) < 40:
              item_id, depth = q.popleft()
              item_id = item_id.lower()
              if item_id in seen or depth > 4:
                  continue
              seen.add(item_id)
              try:
                  meta = item(item_id)
                  data = item(item_id, "/data")
              except Exception as exc:
                  graph[item_id] = {"error": repr(exc)}
                  continue
              graph[item_id] = {"metadata": meta, "data": data}
              text = json.dumps(graph[item_id], sort_keys=True)
              for child in ID_RE.findall(text):
                  if child.lower() not in seen:
                      q.append((child.lower(), depth + 1))
              for url in URL_RE.findall(text):
                  clean = url.rstrip("/.,;)")
                  root = re.sub(r"/\d+$", "", clean)
                  roots.add(root)
              url = str(meta.get("url") or "").rstrip("/")
              if re.search(r"/(?:FeatureServer|MapServer)(?:/\d+)?$", url, re.I):
                  roots.add(re.sub(r"/\d+$", "", url))

          layers = set()
          for root in sorted(roots):
              try:
                  service = get(f"{root}?f=json")
              except Exception:
                  continue
              for layer in service.get("layers", []):
                  if "id" in layer:
                      layers.add(f"{root}/{int(layer['id'])}")

          candidates = []
          inspected = []
          for url in sorted(layers):
              try:
                  meta = get(f"{url}?f=json")
                  if meta.get("geometryType") != "esriGeometryPolygon":
                      continue
                  params = urllib.parse.urlencode({"where":"1=1","outFields":"*","returnGeometry":"false","f":"json"})
                  rows = [f.get("attributes", {}) for f in get(f"{url}/query?{params}").get("features", [])]
              except Exception as exc:
                  inspected.append({"url": url, "error": repr(exc)})
                  continue
              inspected.append({"url": url, "name": meta.get("name"), "fields": meta.get("fields", []), "rows": rows})
              for field in meta.get("fields", []):
                  name = str(field.get("name") or "")
                  if field.get("type") == "esriFieldTypeOID" or name.casefold() in {"objectid","fid","oid"}:
                      continue
                  values = [str(int(v) if isinstance(v, float) and v.is_integer() else v).strip() for v in (row.get(name) for row in rows) if v not in (None, "")]
                  if len(values) != 4 or set(values) != {"1","2","3","4"}:
                      continue
                  hay = f"{url} {meta.get('name','')} {name}".casefold()
                  score = sum(points for marker, points in (("commissioner",100),("precinct",70),("commission",60),("pct",40),("district",20)) if marker in hay)
                  candidates.append({"score":score,"layer_url":url,"layer_name":meta.get("name"),"district_field":name,"geometry_type":meta.get("geometryType"),"layer_fields":[x.get("name") for x in meta.get("fields",[])],"source_rows":rows})

          evidence = {"app_metadata":app_meta,"visited_items":sorted(seen),"graph":graph,"service_roots":sorted(roots),"inspected_layers":inspected,"candidates":sorted(candidates,key=lambda x:(-x['score'],x['layer_url'],x['district_field']))}
          (build / "discovery-evidence.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n")
          if not candidates:
              raise SystemExit("No exact Kaufman Commissioner polygon candidate found.")
          selected = sorted(candidates,key=lambda x:(-x['score'],x['layer_url'],x['district_field']))[0]
          contract = {"portal_url":PORTAL,"application_item_id":APP,"application_title":app_meta.get("title"),"application_owner":app_meta.get("owner"),**selected,"district_values":["1","2","3","4"],"resolved_from_official_county_application":True,"source_retrieved_at":"2026-08-02"}
          (build / "gis-source-contract.json").write_text(json.dumps(contract,indent=2,sort_keys=True)+"\n")
          print(json.dumps(contract,indent=2,sort_keys=True))

          subprocess.run(["python","scripts/fetch_arcgis_districts.py","--layer-url",selected["layer_url"],"--district-ids","1,2,3,4","--district-field",selected["district_field"],"--district-type","commissioner_precinct","--district-name-prefix","Commissioner Precinct","--jurisdiction-name","Kaufman County","--record-id-prefix","TX:county:kaufman:commissioner_precinct","--geometry-id-prefix","kaufman-county-commissioner-precinct","--source-agency","Kaufman County GIS","--retrieved-at","2026-08-02","--raw-output","build/kaufman-county/raw/commissioner-precincts-1-4.geojson","--output","build/kaufman-county/geojson/kaufman_county_commissioner_precincts.geojson"],check=True)
          subprocess.run(["python","scripts/fetch_tigerweb_county.py","--geoid","48257","--record-id","TX:county:kaufman:countywide:COUNTYWIDE","--geometry-id","kaufman-county-countywide","--retrieved-at","2026-08-02","--raw-output","build/kaufman-county/raw/tigerweb-county-48257.geojson","--output","build/kaufman-county/geojson/kaufman_county_countywide.geojson"],check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kaufman-county-bootstrap-fast
          path: build/kaufman-county/
          if-no-files-found: error
