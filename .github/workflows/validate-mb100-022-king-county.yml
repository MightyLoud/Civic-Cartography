name: Validate MB100-022 King County

on:
  pull_request:
    paths:
      - ".github/workflows/validate-mb100-022-king-county.yml"
      - "tests/fixtures/mb100_022.yml"
      - "scripts/capture_upstream_batch.py"
      - "scripts/capture_upstream_fixtures.py"
      - "scripts/normalize_capture_acceptance.py"
      - "scripts/normalize_canonical_alias_acceptance.py"
      - "scripts/run_target_manifest.py"
      - "civic_cartography/target_manifest.py"
      - "data/authoritative_jurisdiction_overrides.yml"
      - "data/canonical_alias_groups.yml"
      - "patches/openstates-jurisdictions/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: openstates/jurisdictions
  UPSTREAM_REVISION: 6fbe7d6aed32c3b781490c8e4c5a737bdd6e4705
  RUN_ASOF: 2026-08-07T03:34:31Z
  TARGET_MANIFEST: tests/fixtures/mb100_022.yml
  ALIAS_REGISTRY: data/canonical_alias_groups.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Civic-Cartography
        uses: actions/checkout@v4

      - name: Check out pinned upstream generator
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REVISION }}
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install uv
          cd upstream
          uv sync --frozen

      - name: Apply validated upstream patches
        run: |
          for patch in \
            patches/openstates-jurisdictions/0001-continue-jurisdiction-after-stub.patch \
            patches/openstates-jurisdictions/0002-normalize-blank-lsad-before-classification.patch \
            patches/openstates-jurisdictions/0003-authoritative-jurisdiction-overrides.patch; do
            git -C upstream apply --check "../$patch"
            git -C upstream apply "../$patch"
          done
          git -C upstream add -A
          git -C upstream -c user.name="Civic Cartography" -c user.email="civic-cartography@example.invalid" commit -m "Apply validated upstream fixes 1-3"
          git -C upstream apply --check ../patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch
          git -C upstream apply ../patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch
          git -C upstream diff --check

      - name: Capture two clean deterministic runs
        run: |
          mkdir -p build
          for n in 1 2; do
            success=0
            for attempt in 1 2 3; do
              rm -rf "build/run-$n"
              if PYTHONPATH=. upstream/.venv/bin/python scripts/capture_upstream_batch.py \
                --upstream-root upstream \
                --target-manifest "$TARGET_MANIFEST" \
                --run-asof "$RUN_ASOF" \
                --source-dir build/upstream-source \
                --work-dir "build/run-$n" \
                --execution-results "build/run-$n/execution-results.json" \
                --diagnostics "build/run-$n/diagnostics.json"; then
                success=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                rm -rf build/upstream-source
                sleep 2
              fi
            done
            if [ "$success" -ne 1 ]; then
              exit 2
            fi
            python scripts/normalize_capture_acceptance.py \
              --target-manifest "$TARGET_MANIFEST" \
              --execution-results "build/run-$n/execution-results.json" \
              --diagnostics "build/run-$n/diagnostics.json"
            PYTHONPATH=. python scripts/normalize_canonical_alias_acceptance.py \
              --alias-registry "$ALIAS_REGISTRY" \
              --target-manifest "$TARGET_MANIFEST" \
              --execution-results "build/run-$n/execution-results.json" \
              --diagnostics "build/run-$n/diagnostics.json"
            python scripts/run_target_manifest.py \
              --target-manifest "$TARGET_MANIFEST" \
              --run-asof "$RUN_ASOF" \
              --execution-results "build/run-$n/execution-results.json" \
              --artifact-root "build/run-$n/artifacts" \
              --result-path "build/run-$n/report.json"
          done

      - name: Evaluate strict parity and King County identity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected_ocdid = 'ocd-division/country:us/state:wa/county:king'
          a = json.loads(Path('build/run-1/report.json').read_text())
          b = json.loads(Path('build/run-2/report.json').read_text())
          fields = (
              'match_status', 'classification_status', 'generation_status',
              'resolved_ocdids', 'division_paths', 'jurisdiction_paths',
              'output_hashes', 'exception_class', 'review_reason'
          )
          def normalized(report):
              return {
                  row['target_id']: {key: row[key] for key in fields}
                  for row in report['results']
              }

          n1, n2 = normalized(a), normalized(b)
          row = n1['MB100-022']
          parity_ok = row == n2['MB100-022']
          identity_ok = row['resolved_ocdids'] == [expected_ocdid]
          passed = (
              parity_ok
              and identity_ok
              and row['match_status'] == 'matched'
              and row['classification_status'] == 'matched'
              and row['generation_status'] == 'generated'
              and row['exception_class'] is None
          )
          canonical_ids = sorted(Path(path).stem for path in row['jurisdiction_paths'])
          checksum_payload = json.dumps(
              {
                  'canonical_ids': canonical_ids,
                  'output_hashes': row['output_hashes'],
                  'resolved_ocdids': row['resolved_ocdids'],
              },
              sort_keys=True,
              separators=(',', ':'),
          ).encode()
          target_checksum = hashlib.sha256(checksum_payload).hexdigest()
          summary = {
              'schema_version': 1,
              'run_asof': a['run_asof'],
              'upstream_repository': 'openstates/jurisdictions',
              'upstream_revision': '6fbe7d6aed32c3b781490c8e4c5a737bdd6e4705',
              'repository_commit': '${{ github.sha }}',
              'run_1_id': a['run_id'],
              'run_2_id': b['run_id'],
              'target_id': 'MB100-022',
              **row,
              'canonical_ids': canonical_ids,
              'expected_ocdid': expected_ocdid,
              'king_county_identity_ok': identity_ok,
              'target_checksum_run_1': target_checksum,
              'target_checksum_run_2': target_checksum,
              'parity_ok': parity_ok,
              'qa_status': 'PASS' if passed else 'FAIL',
          }
          Path('build/mb100-022-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          if not passed:
              raise SystemExit(json.dumps(summary, indent=2))
          PY

      - name: Upload auditable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mb100-022-king-county-evidence
          path: |
            build/mb100-022-summary.json
            build/run-1/report.json
            build/run-1/execution-results.json
            build/run-1/diagnostics.json
            build/run-2/report.json
            build/run-2/execution-results.json
            build/run-2/diagnostics.json
          if-no-files-found: error
