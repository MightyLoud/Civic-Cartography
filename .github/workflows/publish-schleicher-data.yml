name: Publish Schleicher County permanent data package

on:
  pull_request:
    paths:
      - ".github/workflows/publish-schleicher-data.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-schleicher-data:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/schleicher-county-combined-clerk
          fetch-depth: 0
      - name: Download validated geometry artifact
        run: |
          rm -rf /tmp/schleicher-derived
          mkdir -p /tmp/schleicher-derived
          gh run download 30846587177 \
            --repo "$GITHUB_REPOSITORY" \
            --name schleicher-county-derived-geometry \
            --dir /tmp/schleicher-derived
      - name: Expand permanent text package
        run: |
          base64 -d > /tmp/schleicher-text.tar.gz <<'ARCHIVE'
[...]
ARCHIVE
          tar -xzf /tmp/schleicher-text.tar.gz -C .
      - name: Promote exact geometry snapshots
        run: |
          mkdir -p data/raw/schleicher-county data/geojson
          cp /tmp/schleicher-derived/raw/commissioner-precincts-1-4.geojson data/raw/schleicher-county/commissioner-precincts-1-4.geojson
          cp /tmp/schleicher-derived/raw/tigerweb-county-48413.geojson data/raw/schleicher-county/tigerweb-county-48413.geojson
          cp /tmp/schleicher-derived/gis-source-contract.json data/raw/schleicher-county/gis-source-contract.json
          cp /tmp/schleicher-derived/derivation-evidence.json data/raw/schleicher-county/derivation-evidence.json
          cp /tmp/schleicher-derived/geojson/schleicher_county_commissioner_precincts.geojson data/geojson/schleicher_county_commissioner_precincts.geojson
          cp /tmp/schleicher-derived/geojson/schleicher_county_countywide.geojson data/geojson/schleicher_county_countywide.geojson
      - name: Publish permanent data files
        run: |
          git rm -f --ignore-unmatch scripts/bootstrap_schleicher_geometry.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs scripts tests
          git diff --cached --check
          git commit -m "Add Schleicher County combined clerk release"
          git push origin HEAD:agent/schleicher-county-combined-clerk
