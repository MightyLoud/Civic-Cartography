name: Validate MB100 closeout and clean rerun

on:
  pull_request:
    paths:
      - ".github/workflows/validate-mb100-closeout.yml"
      - "scripts/validate_mb100_closeout.py"
      - "evidence/measured-batch-100/completion-register.csv"
      - "evidence/measured-batch-100/closeout/**"
      - "civic_cartography/**"
      - "scripts/capture_upstream_batch.py"
      - "scripts/capture_upstream_batch_with_overrides.py"
      - "scripts/normalize_capture_acceptance.py"
      - "scripts/normalize_canonical_alias_acceptance.py"
      - "scripts/run_target_manifest.py"
      - "scripts/check_completion_manifest.py"
      - "scripts/check_regression_fixtures.py"
      - "data/authoritative_jurisdiction_overrides.yml"
      - "data/canonical_alias_groups.yml"
      - "patches/openstates-jurisdictions/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: openstates/jurisdictions
  UPSTREAM_REVISION: 6fbe7d6aed32c3b781490c8e4c5a737bdd6e4705
  RUN_ASOF: 2026-08-13T01:42:43Z
  TARGET_MANIFEST: evidence/measured-batch-100/closeout/MB100_FINAL_MANIFEST.yml
  OVERRIDE_REGISTRY: data/authoritative_jurisdiction_overrides.yml
  ALIAS_REGISTRY: data/canonical_alias_groups.yml

jobs:
  certify:
    name: Certified 100-target clean rerun
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4

      - name: Check out pinned upstream generator
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REVISION }}
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install uv
          cd upstream
          uv sync --frozen

      - name: Validate repository and frozen static closeout
        run: |
          python -m pytest --color=yes
          python scripts/validate_mb100_closeout.py

      - name: Apply governed upstream patches
        run: |
          for patch in \
            patches/openstates-jurisdictions/0001-continue-jurisdiction-after-stub.patch \
            patches/openstates-jurisdictions/0002-normalize-blank-lsad-before-classification.patch \
            patches/openstates-jurisdictions/0003-authoritative-jurisdiction-overrides.patch; do
            git -C upstream apply --check "../$patch"
            git -C upstream apply "../$patch"
          done
          git -C upstream add -A
          git -C upstream \
            -c user.name="Civic Cartography" \
            -c user.email="civic-cartography@example.invalid" \
            commit -m "Apply validated upstream fixes 1-3"
          for patch in \
            patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch \
            patches/openstates-jurisdictions/0005-transit-division-jurisdiction-classification.patch \
            patches/openstates-jurisdictions/0006-territory-municipio-support.patch; do
            git -C upstream apply --check "../$patch"
            git -C upstream apply "../$patch"
          done
          git -C upstream diff --check

      - name: Capture two unchanged 100-target runs
        run: |
          mkdir -p build
          for n in 1 2; do
            success=0
            for attempt in 1 2 3; do
              rm -rf "build/run-$n"
              if PYTHONPATH=. upstream/.venv/bin/python scripts/capture_upstream_batch_with_overrides.py \
                --override-registry "$OVERRIDE_REGISTRY" \
                --alias-registry "$ALIAS_REGISTRY" \
                --upstream-root upstream \
                --target-manifest "$TARGET_MANIFEST" \
                --run-asof "$RUN_ASOF" \
                --source-dir build/upstream-source \
                --work-dir "build/run-$n" \
                --execution-results "build/run-$n/execution-results.json" \
                --diagnostics "build/run-$n/diagnostics.json"; then
                success=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                rm -rf build/upstream-source
              fi
            done
            if [ "$success" -ne 1 ]; then
              exit 2
            fi
            python scripts/normalize_capture_acceptance.py \
              --target-manifest "$TARGET_MANIFEST" \
              --execution-results "build/run-$n/execution-results.json" \
              --diagnostics "build/run-$n/diagnostics.json"
            PYTHONPATH=. python scripts/normalize_canonical_alias_acceptance.py \
              --alias-registry "$ALIAS_REGISTRY" \
              --target-manifest "$TARGET_MANIFEST" \
              --execution-results "build/run-$n/execution-results.json" \
              --diagnostics "build/run-$n/diagnostics.json"
            python scripts/run_target_manifest.py \
              --target-manifest "$TARGET_MANIFEST" \
              --run-asof "$RUN_ASOF" \
              --execution-results "build/run-$n/execution-results.json" \
              --artifact-root "build/run-$n/artifacts" \
              --result-path "build/run-$n/report.json"
          done

      - name: Build retained raw-source manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("build/upstream-source")
          files = {}
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              rel = path.relative_to(root).as_posix()
              files[rel] = {
                  "path": rel,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size_bytes": path.stat().st_size,
              }
          if not files:
              raise SystemExit("No retained raw source files")
          payload = {
              "version": 1,
              "generator_repository": "openstates/jurisdictions",
              "generator_revision": "6fbe7d6aed32c3b781490c8e4c5a737bdd6e4705",
              "files": files,
          }
          Path("build/source-manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Require 100-target completion and active-fixture parity
        run: |
          python scripts/check_completion_manifest.py \
            --target-manifest "$TARGET_MANIFEST" \
            --first-report build/run-1/report.json \
            --second-report build/run-2/report.json \
            --source-manifest build/source-manifest.json \
            --result-path build/mb100-clean-rerun-completion.json \
            --require-all-complete
          python scripts/check_regression_fixtures.py \
            --target-manifest "$TARGET_MANIFEST" \
            --first-report build/run-1/report.json \
            --second-report build/run-2/report.json \
            --upstream-repository "$UPSTREAM_REPOSITORY" \
            --upstream-revision "$UPSTREAM_REVISION" \
            --result-path build/fixture-evaluation.json

      - name: Certify frozen parity and write CLOSE-08 evidence
        env:
          MB100_REPO_TESTS: PASS
        run: |
          python scripts/validate_mb100_closeout.py \
            --first-report build/run-1/report.json \
            --second-report build/run-2/report.json \
            --completion-manifest build/mb100-clean-rerun-completion.json \
            --fixture-evaluation build/fixture-evaluation.json \
            --evidence-json build/MB100_CLEAN_RERUN_EVIDENCE.json

      - name: Publish certification summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("build/MB100_CLEAN_RERUN_EVIDENCE.json")
          if path.is_file():
              evidence = json.loads(path.read_text())
              rerun = evidence["clean_rerun"]
              lines = [
                  "## MB100 certified clean rerun",
                  "",
                  f"- Candidate head: `{evidence['candidate']['sha']}`",
                  f"- Frozen main: `{evidence['frozen_main_commit']}`",
                  f"- Targets complete: **{rerun['complete_count']}/100**",
                  f"- Frozen checksum matches: **{rerun['checksum_match_count']}/100**",
                  f"- Active fixtures: **{rerun['active_fixture_summary']['passed_count']}/6 PASS**",
                  f"- Command parity: **{rerun['command_parity']}**",
                  f"- Historical timer integrity: **{evidence['historical_timer_integrity']}**",
                  f"- Promotion gates: **{evidence['promotion_gates']} — HOLD**",
                  "",
                  "FX-007 and FX-008 remain staged. Promotion and a successor decision are not emitted.",
              ]
          else:
              lines = [
                  "## MB100 certified clean rerun",
                  "",
                  "Certification stopped before CLOSE-08 evidence was produced.",
              ]
          Path("build/closeout-summary.md").write_text("\n".join(lines) + "\n")
          PY
          cat build/closeout-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload retained closeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mb100-certified-clean-rerun
          path: |
            evidence/measured-batch-100/closeout
            build/MB100_CLEAN_RERUN_EVIDENCE.json
            build/closeout-summary.md
            build/source-manifest.json
            build/mb100-clean-rerun-completion.json
            build/fixture-evaluation.json
            build/run-1/report.json
            build/run-1/execution-results.json
            build/run-1/diagnostics.json
            build/run-1/artifacts
            build/run-2/report.json
            build/run-2/execution-results.json
            build/run-2/diagnostics.json
            build/run-2/artifacts
          if-no-files-found: warn
