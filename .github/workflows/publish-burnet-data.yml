name: Publish Burnet County permanent data package

on:
  pull_request:
    paths:
      - ".github/workflows/publish-burnet-data.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-burnet-data:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/burnet-county-dual-prosecutor
          fetch-depth: 0
      - name: Download validated geometry artifact
        run: |
          rm -rf /tmp/burnet-derived
          mkdir -p /tmp/burnet-derived
          gh run download 30820583252 \
            --repo "$GITHUB_REPOSITORY" \
            --name burnet-county-derived-geometry \
            --dir /tmp/burnet-derived
