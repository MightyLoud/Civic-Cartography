name: Validate MB100-039 City and County of San Francisco

on:
  pull_request:
    paths:
      - ".github/workflows/validate-mb100-039-city-and-county-of-san-francisco.yml"
      - "tests/fixtures/mb100_039.yml"
      - "scripts/capture_upstream_batch.py"
      - "scripts/capture_upstream_batch_with_overrides.py"
      - "scripts/capture_upstream_fixtures.py"
      - "scripts/capture_upstream_with_authoritative_overrides.py"
      - "scripts/normalize_capture_acceptance.py"
      - "scripts/normalize_canonical_alias_acceptance.py"
      - "scripts/run_target_manifest.py"
      - "civic_cartography/target_manifest.py"
      - "civic_cartography/canonical_aliases.py"
      - "data/authoritative_jurisdiction_overrides.yml"
      - "data/canonical_alias_groups.yml"
      - "patches/openstates-jurisdictions/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: openstates/jurisdictions
  UPSTREAM_REVISION: 6fbe7d6aed32c3b781490c8e4c5a737bdd6e4705
  RUN_ASOF: 2026-08-08T02:57:00Z
  TARGET_MANIFEST: tests/fixtures/mb100_039.yml
  OVERRIDE_REGISTRY: data/authoritative_jurisdiction_overrides.yml
  ALIAS_REGISTRY: data/canonical_alias_groups.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Civic-Cartography
        uses: actions/checkout@v4

      - name: Check out pinned upstream generator
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REVISION }}
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install uv
          cd upstream
          uv sync --frozen

      - name: Apply validated upstream patches
        run: |
          for patch in \
            patches/openstates-jurisdictions/0001-continue-jurisdiction-after-stub.patch \
            patches/openstates-jurisdictions/0002-normalize-blank-lsad-before-classification.patch \
            patches/openstates-jurisdictions/0003-authoritative-jurisdiction-overrides.patch; do
            git -C upstream apply --check "../$patch"
            git -C upstream apply "../$patch"
          done
          git -C upstream add -A
          git -C upstream -c user.name="Civic Cartography" -c user.email="civic-cartography@example.invalid" commit -m "Apply validated upstream fixes 1-3"
          git -C upstream apply --check ../patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch
          git -C upstream apply ../patches/openstates-jurisdictions/0004-canonical-alias-jurisdiction.patch
          git -C upstream diff --check

      - name: Capture two clean deterministic runs
        run: |
          mkdir -p build
          for n in 1 2; do
            success=0
            for attempt in 1 2 3; do
              rm -rf "build/run-$n"
              if PYTHONPATH=. upstream/.venv/bin/python scripts/capture_upstream_batch_with_overrides.py \
                --override-registry "$OVERRIDE_REGISTRY" \
                --alias-registry "$ALIAS_REGISTRY" \
                --upstream-root upstream \
                --target-manifest "$TARGET_MANIFEST" \
                --run-asof "$RUN_ASOF" \
                --source-dir build/upstream-source \
                --work-dir "build/run-$n" \
                --execution-results "build/run-$n/execution-results.json" \
                --diagnostics "build/run-$n/diagnostics.json"; then
                success=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                rm -rf build/upstream-source
                sleep 2
              fi
            done
            if [ "$success" -ne 1 ]; then
              exit 2
            fi
            python scripts/normalize_capture_acceptance.py \
              --target-manifest "$TARGET_MANIFEST" \
              --execution-results "build/run-$n/execution-results.json" \
              --diagnostics "build/run-$n/diagnostics.json"
            PYTHONPATH=. python scripts/normalize_canonical_alias_acceptance.py \
              --alias-registry "$ALIAS_REGISTRY" \
              --target-manifest "$TARGET_MANIFEST" \
              --execution-results "build/run-$n/execution-results.json" \
              --diagnostics "build/run-$n/diagnostics.json"
            python scripts/run_target_manifest.py \
              --target-manifest "$TARGET_MANIFEST" \
              --run-asof "$RUN_ASOF" \
              --execution-results "build/run-$n/execution-results.json" \
              --artifact-root "build/run-$n/artifacts" \
              --result-path "build/run-$n/report.json"
          done

      - name: Evaluate strict parity and San Francisco canonical government identity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import yaml

          place_ocdid = 'ocd-division/country:us/state:ca/place:san_francisco'
          county_ocdid = 'ocd-division/country:us/state:ca/county:san_francisco'
          expected_jurisdiction_ocdid = 'ocd-jurisdiction/country:us/state:ca/place:san_francisco/government'
          expected_alias_id = 'ca-san-francisco-city-county-government'
          frozen_geographic_identifier = 'place-0667000 / county-06075'
          a = json.loads(Path('build/run-1/report.json').read_text())
          b = json.loads(Path('build/run-2/report.json').read_text())
          diagnostics = json.loads(Path('build/run-1/diagnostics.json').read_text())
          fields = (
              'match_status', 'classification_status', 'generation_status',
              'resolved_ocdids', 'division_paths', 'jurisdiction_paths',
              'output_hashes', 'exception_class', 'review_reason'
          )

          def normalized(report):
              return {
                  row['target_id']: {key: row[key] for key in fields}
                  for row in report['results']
              }

          n1, n2 = normalized(a), normalized(b)
          row = n1['MB100-039']
          parity_ok = row == n2['MB100-039']
          full_alias_identity_ok = set(row['resolved_ocdids']) == {place_ocdid, county_ocdid}
          california_paths_ok = (
              all(path.startswith('divisions/ca/') for path in row['division_paths'])
              and all(path.startswith('jurisdictions/ca/') for path in row['jurisdiction_paths'])
          )
          two_divisions_ok = len(row['division_paths']) == 2
          one_government_jurisdiction_ok = len(row['jurisdiction_paths']) == 1
          canonical_place_jurisdiction_ok = False
          county_duplicate_absent = False
          human_facing_name_ok = False
          canonical_alias_source_ok = False
          canonical_alias_semantics_ok = False
          jurisdiction_name = None
          jurisdiction_ocdid = None
          jurisdiction_classification = None
          jurisdiction_path = None

          target_diagnostic = next(
              (item for item in diagnostics.get('targets', []) if item.get('target_id') == 'MB100-039'),
              {},
          )
          canonical_alias = target_diagnostic.get('canonical_alias', {})
          canonical_alias_semantics_ok = (
              canonical_alias.get('alias_id') == expected_alias_id
              and canonical_alias.get('canonical_member') == place_ocdid
              and canonical_alias.get('canonical_jurisdiction_ocdid') == expected_jurisdiction_ocdid
              and canonical_alias.get('invariant_errors') == []
          )

          if len(row['jurisdiction_paths']) == 1:
              jurisdiction_path = row['jurisdiction_paths'][0]
              artifact_path = Path('build/run-1/artifacts') / jurisdiction_path
              if artifact_path.exists():
                  artifact = yaml.safe_load(artifact_path.read_text())
                  jurisdiction_name = artifact.get('name')
                  jurisdiction_ocdid = artifact.get('ocdid')
                  jurisdiction_classification = artifact.get('classification')
                  canonical_place_jurisdiction_ok = jurisdiction_ocdid == expected_jurisdiction_ocdid
                  county_duplicate_absent = '/county:san_francisco/' not in (jurisdiction_ocdid or '')
                  human_facing_name_ok = jurisdiction_name == 'City and County of San Francisco'
                  canonical_alias_source_ok = any(
                      {'ocdid', 'name', 'classification'}.issubset(set(source.get('field', [])))
                      and source.get('source_name') == 'City and County of San Francisco'
                      and source.get('source_type') == 'human_researched'
                      for source in artifact.get('sourcing', [])
                      if isinstance(source, dict)
                  )

          canonical_ids = sorted(Path(path).stem for path in row['jurisdiction_paths'])
          checksum_payload = json.dumps(
              {
                  'canonical_ids': canonical_ids,
                  'output_hashes': row['output_hashes'],
                  'resolved_ocdids': row['resolved_ocdids'],
              },
              sort_keys=True,
              separators=(',', ':'),
          ).encode()
          target_checksum = hashlib.sha256(checksum_payload).hexdigest()

          passed = (
              parity_ok
              and full_alias_identity_ok
              and california_paths_ok
              and two_divisions_ok
              and one_government_jurisdiction_ok
              and canonical_place_jurisdiction_ok
              and county_duplicate_absent
              and human_facing_name_ok
              and canonical_alias_source_ok
              and canonical_alias_semantics_ok
              and jurisdiction_classification == 'government'
              and row['match_status'] == 'matched'
              and row['classification_status'] == 'matched'
              and row['generation_status'] == 'generated'
              and row['exception_class'] is None
          )

          summary = {
              'schema_version': 1,
              'run_asof': a['run_asof'],
              'upstream_repository': 'openstates/jurisdictions',
              'upstream_revision': '6fbe7d6aed32c3b781490c8e4c5a737bdd6e4705',
              'repository_commit': '${{ github.sha }}',
              'run_1_id': a['run_id'],
              'run_2_id': b['run_id'],
              'target_id': 'MB100-039',
              **row,
              'canonical_ids': canonical_ids,
              'frozen_place_ocdid': place_ocdid,
              'frozen_county_ocdid': county_ocdid,
              'expected_jurisdiction_ocdid': expected_jurisdiction_ocdid,
              'expected_alias_id': expected_alias_id,
              'frozen_geographic_identifier': frozen_geographic_identifier,
              'full_alias_identity_ok': full_alias_identity_ok,
              'california_paths_ok': california_paths_ok,
              'two_divisions_ok': two_divisions_ok,
              'one_government_jurisdiction_ok': one_government_jurisdiction_ok,
              'canonical_place_jurisdiction_ok': canonical_place_jurisdiction_ok,
              'county_duplicate_absent': county_duplicate_absent,
              'human_facing_name_ok': human_facing_name_ok,
              'canonical_alias_source_ok': canonical_alias_source_ok,
              'canonical_alias_semantics_ok': canonical_alias_semantics_ok,
              'generated_jurisdiction_name': jurisdiction_name,
              'generated_jurisdiction_ocdid': jurisdiction_ocdid,
              'generated_jurisdiction_classification': jurisdiction_classification,
              'generated_jurisdiction_path': jurisdiction_path,
              'target_checksum_run_1': target_checksum,
              'target_checksum_run_2': target_checksum,
              'parity_ok': parity_ok,
              'qa_status': 'PASS' if passed else 'FAIL',
          }
          Path('build/mb100-039-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          if not passed:
              raise SystemExit(json.dumps(summary, indent=2))
          PY

      - name: Upload auditable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mb100-039-city-and-county-of-san-francisco-evidence
          path: |
            build/mb100-039-summary.json
            build/run-1/report.json
            build/run-1/execution-results.json
            build/run-1/diagnostics.json
            build/run-1/artifacts/divisions/ca/local/*.yaml
            build/run-1/artifacts/jurisdictions/ca/local/*.yaml
            build/run-2/report.json
            build/run-2/execution-results.json
            build/run-2/diagnostics.json
            build/run-2/artifacts/divisions/ca/local/*.yaml
            build/run-2/artifacts/jurisdictions/ca/local/*.yaml
          if-no-files-found: error
