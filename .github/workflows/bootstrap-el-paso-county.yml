name: Bootstrap El Paso County complete schema

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap-el-paso-county:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Resolve official portal item to operational layer
        id: source
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          PORTAL = 'https://maps.epcounty.com/portal'
          ITEM_ID = '0b4e626d91684cecb1e35828cf52092f'
          USER_AGENT = 'Civic-Cartography-bootstrap/1.0'

          def fetch_json(url):
              request = urllib.request.Request(url, headers={'User-Agent': USER_AGENT})
              last_error = None
              for attempt in range(1, 6):
                  try:
                      with urllib.request.urlopen(request, timeout=45) as response:
                          return json.load(response)
                  except Exception as exc:
                      last_error = exc
                      if attempt == 5:
                          raise
                      time.sleep(attempt * 5)
              raise last_error

          item_url = f'{PORTAL}/sharing/rest/content/items/{ITEM_ID}'
          item = fetch_json(f'{item_url}?f=json')
          data = fetch_json(f'{item_url}/data?f=json')

          layer_entries = []
          def walk(layers):
              for layer in layers or []:
                  if isinstance(layer, dict):
                      layer_entries.append(layer)
                      walk(layer.get('layers'))
          walk(data.get('operationalLayers'))

          roots = set()
          direct = set()
          for layer in layer_entries:
              url = layer.get('url')
              if not isinstance(url, str):
                  continue
              url = url.rstrip('/')
              if re.search(r'/(?:MapServer|FeatureServer)/\d+$', url, re.I):
                  direct.add(url)
                  roots.add(url.rsplit('/', 1)[0])
              elif re.search(r'/(?:MapServer|FeatureServer)$', url, re.I):
                  roots.add(url)

          candidates = set(direct)
          for root in sorted(roots):
              service = fetch_json(f'{root}?f=json')
              for layer in service.get('layers', []):
                  name = str(layer.get('name') or '').lower()
                  if 'commission' in name or 'precinct' in name:
                      candidates.add(f"{root}/{layer['id']}")

          field_patterns = ('PRECINCT', 'PREC', 'PCT', 'DISTRICT', 'DIST', 'COMMISH')
          ranked = []
          for layer_url in sorted(candidates):
              try:
                  metadata = fetch_json(f'{layer_url}?f=json')
              except Exception:
                  continue
              if metadata.get('geometryType') != 'esriGeometryPolygon':
                  continue
              fields = [str(field.get('name') or '') for field in metadata.get('fields', [])]
              for field in fields:
                  upper = field.upper()
                  if not any(token in upper for token in field_patterns):
                      continue
                  query = urllib.parse.urlencode({
                      'where': '1=1',
                      'outFields': field,
                      'returnGeometry': 'false',
                      'f': 'json',
                  })
                  payload = fetch_json(f'{layer_url}/query?{query}')
                  values = []
                  for feature in payload.get('features', []):
                      value = feature.get('attributes', {}).get(field)
                      text = str(value).strip() if value is not None else ''
                      match = re.search(r'(?<!\d)([1-4])(?!\d)', text)
                      if match:
                          values.append(match.group(1))
                  unique = sorted(set(values))
                  if unique != ['1', '2', '3', '4']:
                      continue
                  score = 100
                  title = str(metadata.get('name') or '')
                  if 'commission' in title.lower(): score += 30
                  if upper in {'PRECINCT', 'PRECINCT_N', 'PCT', 'PCT_NO', 'DISTRICT'}: score += 20
                  if 'commission' in layer_url.lower(): score += 15
                  if '/FeatureServer/' in layer_url: score += 3
                  ranked.append((score, layer_url, field, metadata, len(values)))

          ranked.sort(key=lambda value: (value[0], value[1], value[2]), reverse=True)
          if not ranked:
              raise SystemExit(f'No El Paso County polygon layer resolved four Commissioner precinct IDs. Item layers: {layer_entries!r}')

          score, layer_url, district_field, metadata, matched_count = ranked[0]
          contract = {
              'portal_url': PORTAL,
              'item_id': ITEM_ID,
              'item': item,
              'operational_layers': layer_entries,
              'ranked_candidates': [
                  {
                      'score': item_score,
                      'layer_url': candidate,
                      'district_field': field,
                      'layer_name': layer_metadata.get('name'),
                      'matched_feature_count': count,
                  }
                  for item_score, candidate, field, layer_metadata, count in ranked
              ],
              'operational_layer_url': layer_url,
              'district_field': district_field,
          }
          output = Path('build/el-paso-county/portal-source-contract.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(contract, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'layer_url={layer_url}\n')
              handle.write(f'district_field={district_field}\n')
          print(f'El Paso County operational layer: {layer_url}')
          print(f'El Paso County district field: {district_field}')
          PY

      - name: Fetch current El Paso County Commissioner precincts
        run: |
          python scripts/fetch_arcgis_districts.py \
            --layer-url "${{ steps.source.outputs.layer_url }}" \
            --district-ids 1,2,3,4 \
            --district-field "${{ steps.source.outputs.district_field }}" \
            --district-type commissioner_precinct \
            --district-name-prefix "Commissioner Precinct" \
            --jurisdiction-name "El Paso County" \
            --record-id-prefix TX:county:el_paso:commissioner_precinct \
            --geometry-id-prefix el-paso-county-commissioner-precinct \
            --source-agency "El Paso County GIS" \
            --retrieved-at 2026-08-02 \
            --raw-output build/el-paso-county/precincts/raw/commissioner-precincts-1-4.geojson \
            --output build/el-paso-county/precincts/geojson/el_paso_county_commissioner_precincts.geojson

      - name: Fetch current El Paso County boundary
        run: |
          python scripts/fetch_tigerweb_county.py \
            --geoid 48141 \
            --record-id TX:county:el_paso:countywide:COUNTYWIDE \
            --geometry-id el-paso-county-countywide \
            --retrieved-at 2026-08-02 \
            --raw-output build/el-paso-county/county/raw/tigerweb-county-48141.geojson \
            --output build/el-paso-county/county/geojson/el_paso_county_countywide.geojson

      - name: Commit generated El Paso County snapshots
        if: github.event_name == 'push'
        run: |
          mkdir -p data/raw/el-paso-county data/geojson
          cp build/el-paso-county/precincts/raw/commissioner-precincts-1-4.geojson data/raw/el-paso-county/commissioner-precincts-1-4.geojson
          cp build/el-paso-county/precincts/geojson/el_paso_county_commissioner_precincts.geojson data/geojson/el_paso_county_commissioner_precincts.geojson
          cp build/el-paso-county/county/raw/tigerweb-county-48141.geojson data/raw/el-paso-county/tigerweb-county-48141.geojson
          cp build/el-paso-county/county/geojson/el_paso_county_countywide.geojson data/geojson/el_paso_county_countywide.geojson
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/raw/el-paso-county/commissioner-precincts-1-4.geojson \
            data/geojson/el_paso_county_commissioner_precincts.geojson \
            data/raw/el-paso-county/tigerweb-county-48141.geojson \
            data/geojson/el_paso_county_countywide.geojson
          if git diff --cached --quiet; then
            echo "El Paso County snapshots already match generated output."
            exit 0
          fi
          git commit -m "Add El Paso County source snapshots"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload El Paso County bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: el-paso-county-bootstrap
          path: build/el-paso-county/
          if-no-files-found: error
