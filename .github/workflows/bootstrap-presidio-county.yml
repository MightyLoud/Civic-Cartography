name: Bootstrap Presidio County geometry

on:
  pull_request:
    paths:
      - "scripts/bootstrap_presidio_geometry.py"
      - ".github/workflows/bootstrap-presidio-county.yml"
  workflow_dispatch:

jobs:
  bootstrap-presidio-county:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source dependencies
        run: python -m pip install pymupdf pyshp
      - name: Verify ballot assignments and TLC precincts
        run: python scripts/bootstrap_presidio_geometry.py
      - uses: actions/upload-artifact@v4
        with:
          name: presidio-county-bootstrap
          path: build/presidio-bootstrap/
          if-no-files-found: error
