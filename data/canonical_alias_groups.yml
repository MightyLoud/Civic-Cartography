      source_description: >-
        Official Metro materials identify one city-county consolidated
        government created in 1963. The maintained OCD source preserves both
        Nashville place and Davidson County Divisions and advises that the
        county identifier is preferable for government statistics.
    verified_asof: '2026-08-02'
    evidence_notes: >-
      Davidson County is the maintained canonical member because the
